# .github/workflows/stack.yml — the stack built in the container recipe on a clean Ubuntu, then
# `hep doctor` and the fast tests in it: a second machine in the loop (docs/audit_3/06_Plan.md, 2.2).
# It runs only when started by hand (Actions → stack → Run workflow): a core build takes hours.
name: stack

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "packages= for build_stack.py (core, @lab, names …)"
        default: "core"

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Room for the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h /
      - name: Build the image
        run: >
          docker build -f recipes/platforms/container/Dockerfile
          --build-arg PACKAGES="${{ inputs.packages }}" --build-arg ROOT_CORES=2 --build-arg GEANT4_DATA=OFF
          -t heimdall:ci .
      - name: hep doctor
        run: docker run --rm heimdall:ci bash -lc 'hep doctor --quick'
      - name: The fast tests
        run: docker run --rm heimdall:ci bash -lc 'cd /opt/heimdall && python3 -m pytest -q -m "not slow"'
