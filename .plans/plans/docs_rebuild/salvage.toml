# Where each old document's knowledge goes. `to`: new page ids (docs/stable/<to>.md), or `reference:<name>`, `issues`,
# `rules:<name>`, or "wipe" with a `why`. A numbered page's section is listed; everything else by its file.
# Every destination is a rewrite verified against code: a mapping says where a claim may go, not that it is still true.
# check_salvage.py holds this file to the tree at tag docs/pre-rebuild.

