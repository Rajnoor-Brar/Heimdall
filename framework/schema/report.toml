# framework/schema/report.toml — a report's recipe (V207, V209, V211): [report] and its [[report.section]]s, in a
# recipe of its own (configs/<A>/<E>.toml, [report] alone), in an errand file (what its Runs' reports show), and
# in the report.toml a job writes beside each Run's plot.toml.
#
# Every key's type, default and meaning, written once: runner/schema.py checks a recipe against it (its tables
# "report" and "section"), and `make docs` writes the tables into doc:errand-file.
# Entries as in run.toml: type, items, choices, min, default, required, doc, notes.

[report.title]
type = "str"
doc  = "the report's title, on its front page (default: its one source's address, else what its sources' addresses share)"
notes = """\
  the report's title, on its front page (default: its one source's address, else what its sources' addresses \
  share). `{assignment}`, `{errand}`, `{configuration}` and `{title}` (a configuration's title, else its name) in the title or \
  subtitle are filled in from its sources' plot documents (several values joined by commas), so one template \
  titles each folder's report."""

[report.subtitle]
type = "str"
doc  = "a line under the title: the date, who it is for"

[report.from]
type  = "list"
items = "str"
doc   = "its sources: result folders holding a plot.toml, as <A>/<E>/<R>, <A>/<E> (each of its Runs, then its own when drawn), a path, or a glob; the command line's replace them"

[report.output]
type = "str"
doc  = "where it is built: a folder under reports/ (eic/weekly), or a path (./…, /…); default: where results/ has its sources (reports/<A>/<E>/<R>/, reports/<A>/<E>/, …); -o replaces it. Not in an errand file"

[report.template]
type = "str"
doc  = "a recipe laid under this table, named as [config].import names a file (weekly, eic/weekly, ./…; .toml optional): its keys under these, its sections first"

[report.section]
type  = "list"
items = "table"
doc   = "its sections, [[report.section]] each, in order: each shows one of pages, compare, stats, bars, files or tools"

[report.tools]
type  = "list"
items = "str"
doc   = "the tools whose configurations the default sections show, last, in a Tools section: tags ([tools.<tag>]) or globs; default: every tool given a card or options; [] none"

[report.font]
type    = "str"
choices = ["sans", "serif"]
default = "sans"
doc     = "the report's font: sans sets everything in TeX Gyre Heros (Helvetica's metrics, as the pages Paint draws), math too; serif sets the body (notes, prose) in TeX Gyre Termes, the titles, tables and labels still sans"

[report.size]
type    = "float"
min     = 8
default = 9.5
doc     = "the body's size in pt, 8 to 12, its line 1.42 times it; titles, tables, captions and labels keep their own sizes"

[report.accent]
type    = "str"
default = "#2a78d6"
doc     = "the accent colour, #rrggbb: section numbers, kickers, code's keys"

[report.contents]
type    = "bool"
default = true
doc     = "a table of contents on the front page, under the sources"

[report.columns]
type    = "int"
min     = 1
default = 2
doc     = "a grid's columns when its section names none, 1 to 4 (a grid of one figure: 1; a side-by-side grid of three or more sources: 3)"

[report.method]
type    = "bool"
default = true
doc     = "a section How the numbers are made, whenever the report shows statistics or bar tables: how a page is compared, each statistic shown (its formula and what it means, a paragraph each) and how points are scored; the statistics parts then leave those notes out. false: each part keeps its own"

[report.context]
type    = "str"
choices = ["first", "last"]
default = "first"
doc     = "where what was run (the tools sections) and How the numbers are made go: first, before every other section (the results, in the recipe's order); last, after them"

[section.title]
type     = "str"
required = true
doc      = "the section's title, in the contents and above its figures"

[section.note]
type = "str"
doc  = "a line of text under the title"

[section.from]
type  = "list"
items = "str"
doc   = "this section's own sources (as [report].from), kept when the command line names others"

[section.pages]
type  = "list"
items = "str"
doc   = "globs of page names in each source's plots/<set>/<backend>/ (`d01-x01-y01`, `18x275/d0*`, `*`): a grid of them per page cell, or per page with layout = \"sources\""

[section.set]
type    = "str"
default = "totality"
doc     = "the set whose pages or numbers it takes: each source's plots/<set>/ and statistics/<set>/, else drawn for the report"

[section.cells]
type  = "list"
items = "str"
doc   = "globs of page cells (the folders in a set: `18x275`), to take only those; default: every one"

[section.backend]
type    = "str|list"
items   = "str"
choices = ["root", "mpl"]
doc     = "whose drawn pages it takes; a list in order of preference (per page, the first that drew it; default: root, mpl)"

[section.layout]
type    = "str"
choices = ["pages", "sources"]
default = "pages"
doc     = "pages: each source's pages in turn, a grid per page cell; sources: side by side, a grid per page, a panel per source"

[section.columns]
type = "int"
min  = 1
doc  = "a grid's columns (default: 2 on an A4 page, 3 for a side-by-side grid of three or more)"

[section.label]
type    = "str"
choices = ["events", "folder"]
default = "folder"
doc     = "a side-by-side panel's label: folder, its source's folder name without the serial (with it, then with its errand, where two sources would share one); events, the events its points ran with (10M)"

[section.optional]
type    = "bool"
default = false
doc     = "a source that neither has the section's set drawn (or measured) nor can draw it for the report (no such set, no complete point in it) is passed over, and the section left out when none has it; false: refused, naming the sets it has"

[section.compare]
type  = "list"
items = "str"
doc   = "compare figures' names: their pages, from each source's errand's compare/<name>/"

[section.stats]
type  = "list"
items = "str"
doc   = "the statistics summary's sections, from each source's statistics/<set>/statistics.csv (else measured for the report): standings (each point's score, worst page, veto and categories), `category:<name>` (a category's section: what it asks and its metrics), marginals (a table per axis: the mean score of the points having each value), baseline (each point against `[score].baseline`), head-to-head (the pages `[score].head_to_head` names), or a metric's id (`chi2_sigma`) for its section, `<metric>:ranking`, `:crossed` or `:table` for one of its parts"

[section.bars]
type  = "list"
items = "str"
doc   = "globs of page names: each page's bar graph of its curves' numbers, drawn for the report from statistics.csv (else from the numbers measured for it)"

[section.files]
type  = "list"
items = "str"
doc   = "your own PDF or PNG files, globs relative to the recipe's folder (`extras/*.png`)"

[section.tools]
type  = "list"
items = "str"
doc   = "tool tags ([tools.<tag>]) or globs, \"*\" every tool given a card or options: what each was given, read from each source's records, over its complete points: the card's lines every point had (its baseline), then each point's other lines (a table when they are key = value or key: value lines), and its other options"

[section.hide]
type  = "list"
items = "str"
doc   = "a tools section's: globs of varied lines' keys (else of the lines) to leave out (\"Random:seed\", \"RANDOM_SEED\")"

[section.plot]
type = "table"
doc  = "a pages, stats or bars section's: [plot] keys over each source's own (its sets and figures added, its style laid over), its pages and numbers then drawn for the report into its cache, never into results/"
