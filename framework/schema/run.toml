# framework/schema/run.toml — every key a run TOML may hold (docs/04_Config_Reference.md), in one place
# (V55). The runner validates against it (runner/schema.py), the editor schema is generated from it
# (`make schema` → run.schema.json), and test_docs.py holds docs/04 to it.
#
# [<table>.<key>] fields:
#   type     "int" | "float" | "str" | "bool" | "list" | "table", or several joined by "|"
#   items    for a list: the type of its entries
#   item_choices  for a list: allowed string/boolean entries
#   length   for a list: its exact number of entries
#   ordered  for a numeric pair: its first entry must be smaller than its second
#   choices  the values allowed
#   min      the smallest number allowed
#   required true: the table must set it
#   default  the runner's value when the key is left out
#   inherit  true: a configuration ([run.cfgs.<cfg>]) inherits it from [run]
#   default_ok  true: the value "default" is accepted. "default" means "keep it as it is" (V55): in a
#            child it is the parent's value; at the top level nothing is set, and the tool decides.
#   page     a [plot] key a figure ([plot.figures.<figure>]) may override
#   path     a path key: its convention root (paths.ROOTS); an imported file of another project has
#            these made absolute against its own project (V94)
#   doc      one line, for `heimdall explain` and the editor
#   notes    what a line cannot say: the reference's text for the key (docs/04_Config_Reference.md is
#            generated from doc and notes, `make docs`), shown by `heimdall explain` and the editor too
#
# Tables: config, run, configuration ([run.cfgs.<cfg>]), prelim, quantity ([quantities.<q>]), tool
# ([tools.<tag>]: the keys every tool table may carry; a folder's [options] add its own), plot,
# figure ([plot.figures.<figure>]), data, across_from ([plot.across_from]), cluster (also a work dir's
# heimdall.toml [cluster], V114).

[sections]
order = ["config", "run", "prelim", "static", "tools", "quantities", "plot", "stats", "report", "cluster", "heimdall"]
# [heimdall] (V188): the commands' own flags, by their option names; the CLI checks them against its parser.
# [report] (V209): what its folders' reports show, a report's recipe (framework/schema/report.toml, 04 §15).

# ── [config]: how the file is read (V93) ──────────────────────────────────────────────────────────

[config.master]
path = "master"
type = "str"
doc  = "a project master overlaid on the tool folders' quantities.toml (configs/<Project>/…)"
notes = """\
  overlays the tool folders' mappings key by key (`[quantities.<tool>.compatible_quantities]`): an \
  entry for a (tool, quantity) pair replaces the framework's. The file must exist."""

[config.import]
type  = "str|list"
items = "str|table"
doc   = "run TOMLs whose tables this one starts from, in order; this file wins (V56, V93, V94)"
notes = """\
  run TOMLs this one starts from, in order, named as `heimdall run` names a config: `name` is this \
  project's (`configs/<project>/name.toml`), `<Project>/<name>` another project's, `./…` from the \
  work dir; `.toml` optional. **This file wins** (V56): a quantity, tool table or \
  configuration of the file replaces the imported one whole; `[plot]`, `[static]`, `[prelim]` and \
  `[run]`'s own keys merge key by key, tables recursively. Imports nest (V94): an imported file's own \
  imports come first, depth-first; a circle is refused. Another project's file keeps its bare paths \
  (cards, filters, styles, executables) its own project's, so its tools plan as they do in it. The \
  file that imports sets its own `[run].name` and `project`; no folder of its configurations may be \
  an imported run's (V100). \
  An entry may be `{ from = \"<config>\", only = [\"quantities\", \"cfgs.default\", …] }`: only those \
  sections or dotted keys of that file, each of which it must have (V95). `--show-config` says where \
  each quantity, tool and configuration came from."""

[config.drop]
type  = "list"
items = "str"
doc   = "dotted keys taken out of what the imports gave, before this file's tables (V95)"
notes = """\
  dotted keys (`cfgs.default4`, `plot.figures.statistics`, `quantities.radius`, `tools.jets`) taken \
  out of what the imports brought in, before this file's own tables are laid over them (V95). Each \
  must name something an import gave, so a misspelt drop is refused rather than keeping what it \
  meant to remove; a file that imports nothing has nothing to drop."""

[config.vars]
type  = "table"
doc   = "names said once and cited anywhere in the file as {var:name} (V96)"
notes = """\
  `name = value`, cited in any string of the file as `{var:name}` and replaced when the file is \
  read, after its imports and `--set`, so an identity sees only the result (V96). A string that is \
  exactly one var takes its value as it is: `event_count = \"{var:events}\"` is an integer, and a \
  list stays a list; inside a longer string a var must be a scalar (`\"rivet:{var:ana}\"`). An \
  unknown name is refused with the nearest. An imported file's `{var:…}` takes this file's value, \
  so a shared file can be written with parameters; its own `[config.vars]` come with whatever is \
  taken of it (`only` included, V101), under this file's. Imports are read before vars, so an import's \
  name cannot cite one; `--set config.vars.<name>=…` changes one for a run."""

[config.meta]
type  = "table"
doc   = "about the file, for people; versions: the stack it was run with, warned about, never enforced (V97)"
notes = """\
  descriptive: it never changes a run (V97). Any key is free text for people (`author`, \
  `references`, …) except `versions = { pythia8 = \"8.317\", rivet = \"4.1.3\" }`: the packages of \
  `env/stack.toml` the file was run with, each version a string. A version the stack does \
  not have (`6.5` matches 6.5.6) is a **warning** in `--plan`, at the run's start and in \
  `heimdall check`, which still passes: the run goes ahead, at your own risk. A package stack.toml does \
  not name is refused, since its warning could never come."""

# ── [run] ────────────────────────────────────────────────────────────────────────────────────

[run.name]
type     = "str"
required = true
doc      = "the run's folder: <project>/<name>/"
notes = """\
  the run's directory name"""

[run.project]
type     = "str"
required = true
doc      = "the project; a config under configs/<X>/ belongs to X"
notes = """\
  the subfolder of `configs/`, `modules/`, `records/`, `results/`; must equal the folder the file \
  is in, when it is under `configs/`"""

[run.cfgs]
type  = "table"
doc   = "the configurations: [run.cfgs.<cfg>], each a table of the keys below (V98)"
notes = """\
  the configurations, each `[run.cfgs.<cfg>]` (V98; they were `[run.<cfg>]`, which is refused \
  with the form to write, and `heimdall migrate` rewrites it). A configuration's key is its name for \
  `heimdall run <config> <cfg>`, `sweep_runs`, `extends` and compare figures, and its folder unless it \
  sets a `label`. Any name may be used, a [run] key's included."""

[run.configuration]
type = "str"
doc  = "the configuration heimdall run runs (required unless sweep_runs)"
notes = """\
  must name a `[run.cfgs.<cfg>]` table (C2). Under `sweep_runs` it may be left out; `heimdall run <config>` \
  then ignores it"""

[run.serial]
type    = "int"
inherit = true
doc     = "the NN_ before each configuration's folder"
notes = """\
  the prefix `NN_` of each configuration's folder, `<name>/NN_<label>`: **location, never \
  identity** (V12). A configuration's `serial` overrides it (V45). Changing it starts a fresh \
  location."""

[run.event_count]
type    = "int"
min     = 1
inherit = true
doc     = "events per point"
notes = """\
  default for configurations; one of the two must set it"""

[run.threads]
type    = "int"
min     = 0
default = 1
inherit = true
doc     = "threads per generator; 0 = every core"
notes = """\
  default for configurations. `0` means every core, **resolved to a number at plan time**"""

[run.parallelism]
type    = "int|str"
choices = ["auto"]
min     = 1
default = 1
inherit = true
doc     = "points run at once; \"auto\": as many as the cores hold, cores ÷ a point's cores (V75)"
notes = """\
  default for configurations: how many points run at once (V36); `\"auto\"` (V75): as many as the \
  cores hold, `os.cpu_count() // the costliest point's cores`. `threads` stays each point's; never \
  part of an identity or a seed, so changing it reruns nothing"""

[run.plot]
type    = "bool|list"
items   = "str"
default = true
inherit = true
doc     = "after the points: draw the run's pages (true: every set), none (false: its plot.toml is still written), or these sets (V167)"
notes = """\
  the plot follow-up (V167): `true` draws every set of the run's plot document (its `totality` and the \
  `[plot].sets`), `false` none (the document is written all the same, for `heimdall plot` later), a list \
  draws those sets (`["totality", "pdf_by_generator"]`) and is the document's `[plot].draw`. A \
  configuration may set its own; `heimdall run … --no-plot` turns it off for one run"""

[run.stats]
type    = "bool|list"
items   = "str"
default = true
inherit = true
doc     = "after the pages: their statistics (true: every set drawn), none (false), or these sets'; with plot = false, measured alone (V168)"
notes = """\
  the statistics follow-up (V168): `true` measures the sets the run draws (or, with `plot = false`, every \
  set, undrawn), `false` none, a list those sets (the document's `[stats].sets`). A configuration may set its \
  own; `heimdall run … --no-stats` turns it off for one run"""

[run.description]
type = "str"
doc  = "what the run is for"

[run.tag]
type    = "str"
inherit = true
doc     = "the tag each configuration's folder is given when it runs, unless it has one (letters, digits, . _ + -; at most 40)"
notes = """\
  default for configurations: a short name kept with the configuration's folder (its record's `tag` \
  file and its plot document's `[source].tag`), which `heimdall runs`, `heimdall status` and a report \
  show beside it. Never part of a point's identity: tagging reruns nothing. `heimdall run … --tag NAME` \
  gives one for a run; a folder that has a tag keeps it (`heimdall tag` changes it); `\"\"` is none"""

[run.sweep_runs]
type    = "bool|list"
items   = "str"
default = false
doc     = "heimdall run runs every configuration in turn (true), or these, in this order (V79: [\"a\", \"b\"])"
notes = """\
  `true`: `heimdall run <config>` runs every configuration, one after another, in the order of the \
  file; `[\"a\", \"b\"]` (V79): these, in this order (04 §4.1)"""

[run.notify]
type    = "str"
choices = ["none", "desktop"]
default = "none"
doc     = "\"desktop\": a notify-send when heimdall run ends, with its verdict (V76)"
notes = """\
  `\"desktop\"` (V76): a desktop notification (`notify-send`) when `heimdall run` ends, with its \
  verdict; never fails a run"""

[run.seed_type]
type    = "str"
choices = ["identity", "manual", "random"]
default = "identity"
inherit = true
doc     = "how seeds are chosen"
notes = """\
  default for configurations: how a point's seeds are chosen, `\"identity\"`, `\"manual\"` or \
  `\"random\"` (06 §8)"""

[run.manual_seed]
type    = "int"
min     = 1
inherit = true
doc     = "seed_type = manual: every point's seed"
notes = """\
  default for configurations: under `seed_type = \"manual\"`, every point's seed (from 1 to the \
  point's generators' `[card] seed_range`: 899,999,999 for Pythia, checked when the point is \
  planned, V54); ignored otherwise (`--plan` says so)"""

# ── [run.cfgs.<cfg>] ──────────────────────────────────────────────────────────────────────────────
# A configuration's value is its own, else the one it `extends` (and so on), else [run]'s (which takes
# every key here but label, title, extends, static and prelim: V99, it was [run.defaults]),
# else the default here. label, title and extends are each configuration's own.

[configuration.extends]
type = "str"
doc  = "another configuration this one starts from; its own keys win"
notes = """\
  another configuration this one starts from (chains are followed; a circle is refused)"""

[configuration.serial]
type       = "int"
default_ok = true
doc        = "this configuration's NN_ (else [run]'s)"
notes = """\
  overrides `[run].serial` for this configuration: its points go to `<P>/<run name>/NN_<label>/` \
  (V45)"""

[configuration.name]
type = "str"
doc  = "this configuration's run folder (else [run].name)"
notes = """\
  the run folder above this configuration's: `<P>/<name>/NN_<label>/` (V46)"""

[configuration.label]
type = "str"
doc  = "this configuration's folder: NN_<label> (else its table key)"
notes = """\
  the configuration's folder, after the serial: `NN_<label>`; empty means the table key (V45)"""

[configuration.title]
type = "str"
doc  = "the run NN - <title> - header of a sweep"
notes = """\
  the header line of the run under `[run].sweep_runs`: `run 02 - <title> -` (04 §4.1)"""

[configuration.description]
type = "str"
doc  = "what the configuration is for"

[configuration.tag]
type = "str"
doc  = "this configuration's folder's tag when a run gives none and it has none (else [run]'s); \"\": none"
notes = """\
  the tag a run gives this configuration's folder (letters, digits, `.`, `_`, `+`, `-`; at most 40), \
  unless `--tag` gives another or the folder already has one: a folder keeps its tag when it is run \
  again, and `heimdall tag <P>/<name>/<NN_label>` shows or changes it. `\"\"` gives none over \
  `[run]`'s. Never part of a point's identity"""

[configuration.event_count]
type       = "int"
min        = 1
default_ok = true
doc        = "events per point (else [run]'s)"
notes = """\
  required here if `[run]` has none"""

[configuration.threads]
type       = "int"
min        = 0
default_ok = true
doc        = "threads per generator (else [run]'s); 0 = every core"
notes = """\
  `0` = every core"""

[configuration.parallelism]
type       = "int|str"
choices    = ["auto"]
min        = 1
default_ok = true
doc        = "points run at once (else [run]'s); \"auto\": cores ÷ a point's cores (V75)"
notes = """\
  points at once (`\"auto\"`: cores ÷ a point's cores, V75); `--plan` and the run's title say \
  about how many cores that is, and warn past the machine's"""

[configuration.plot]
type       = "bool|list"
items      = "str"
default_ok = true
doc        = "as [run].plot, for this configuration: true, false, or the sets it draws (V167)"
notes = """\
  the plot follow-up for this configuration (V167): `true`, `false`, or the sets it draws, so that sets \
  defined once for the file are each drawn by the configurations they fit"""

[configuration.stats]
type       = "bool|list"
items      = "str"
default_ok = true
doc        = "as [run].stats, for this configuration: true, false, or the sets it measures (V168)"

[configuration.seed_type]
type       = "str"
choices    = ["identity", "manual", "random"]
default_ok = true
doc        = "how seeds are chosen (else [run]'s)"
notes = """\
  `\"identity\"`: from the generator's identity; `\"manual\"`: exactly the given seed; \
  `\"random\"`: drawn when the point runs (06 §8)"""

[configuration.manual_seed]
type       = "int"
min        = 1
default_ok = true
doc        = "seed_type = manual: every point's seed (else [run]'s)"
notes = """\
  the seed of every point under `\"manual\"`; a quantity targeting `<tool>/seed` gives a point its \
  own"""

[configuration.sweeps]
type = "list"
doc  = "swept quantities: a name is an axis, an inner list an entangled group, { points = [...] } listed combinations"
notes = """\
  04 §5.1; `[]` is one point"""

[configuration.plot_points]
type  = "list"
items = "str"
doc   = "swept quantities whose grid makes the pages"
notes = """\
  04 §5.2"""

[configuration.combine]
type  = "list"
items = "str"
doc   = "swept quantities whose points are merged into one (seed replicas)"
notes = """\
  swept quantities whose points are merged into one curve (04 §5.5)"""

[configuration.tools]
type     = "list"
required = true
doc      = "the chain: [A, [B, C], D]; an inner list runs together"
notes = """\
  04 §5.3"""

[configuration.generate_cards]
type  = "list"
items = "str"
doc   = "tools not in the chain whose cards and configs go into the point's context file"
notes = """\
  tool tables (tags) whose cards and configs are made for the point although they do not run in it, \
  for a program that runs them itself (an integrated program: Pythia and Rivet inside it); and \
  `"<tag>:<product>"` for a product made on demand (Herwig's `run`, Sherpa's `results`, MadGraph's \
  `process`). The chain's tools are always in the context file, which every tool finds through \
  `HEIMDALL_CONTEXT` (04 §9.4)"""

[configuration.pre]
type = "list"
doc  = "tools run once, before every point"
notes = """\
  the form of `tools` (04 §5.4)"""

[configuration.post]
type = "list"
doc  = "tools run once, after every point"
notes = """\
  the form of `tools` (04 §5.4)"""

[configuration.static]
type = "table"
doc  = "quantity = value for this configuration, over [static]"
notes = """\
  merged over `[static]` and the layers', key by key (04 §7); a `\"default\"` keeps the layer \
  below's"""

[configuration.prelim]
type = "table"
doc  = "this configuration's [prelim]"
notes = """\
  the nearest layer's **replaces** `[prelim]` whole for this configuration (its chain's \
  interfaces); `{}` means none"""

[configuration.vars]
type = "table"
doc  = "this configuration's [file.vars], over the file's: its own cards, analyses, outputs (V179)"
notes = """\
  merged over `[file.vars]` (V96) for this configuration alone, before any `{var:…}` is replaced: a \
  configuration may run other cards (`pythia_card = "../zeus/dis.cmnd"`), another analysis, another output, \
  in the same file as the others. Only the configuration run, planned or drawn reads them"""

[configuration.data]
type = "table"
doc  = "this configuration's reference data, in place of [plot.data]: file, legend, map (V179)"
notes = """\
  replaces `[plot.data]` (04 §11.1) for this configuration: its pages' data, its plot document's, its \
  statistics' reference, when it runs another analysis than the file's others"""

[configuration.cluster]
type = "table"
doc  = "this configuration's [cluster] keys, over the run's (heimdall cluster, V114)"
notes = """\
  merged over the run TOML's `[cluster]`, key by key, for this configuration's jobs (a longer \
  `time` for its many events, say); the same keys (04 §16)"""

# ── [prelim] ─────────────────────────────────────────────────────────────────────────────────

[prelim.fifo]
type  = "list"
items = "str"
doc   = "FIFOs made in the point's folder before the tools start"
notes = """\
  named pipes in the point's output directory. A FIFO connects tools **in one group** only, has \
  **one reader**, and never feeds a tool that is not `streamable` (C6)."""

[prelim.files]
type  = "list"
items = "str"
doc   = "files made (empty) before the tools start"
notes = """\
  regular files in the point's output directory, **kept**: the way to keep events for another \
  configuration"""

[prelim.commands]
type = "list"
doc  = "commands run in the point's folder before the tools"
notes = """\
  run in the point's output directory; output to the point's `prelim.log`; a nonzero exit fails the \
  point. Placeholders: `{work}`, `{heimdall}`, `{out}`, `{res}`, `{file:<name>}`"""

# ── [quantities.<q>] ─────────────────────────────────────────────────────────────────────────

[quantity.values]
type     = "list"
required = true
doc      = "the values"
notes = """\
  scalars or arrays (an energy pair)"""

[quantity.tags]
type  = "list"
doc   = "one per value: folder and point names"
notes = """\
  one per value. The default is the value with anything but `A–Za–z0–9.+-` replaced by `-`. Tags \
  name point directories: keep them short and unique."""

[quantity.labels]
type  = "list"
doc   = "one per value: legend text"
notes = """\
  legend text, in **LaTeX** (`$e^-$`, `$\\sqrt{s}$`), the one label language of every text a run \
  TOML gives a page (V65): math in `$…$`, the rest text, where a bare `_` or `^` is the character \
  (`\"PDF4LHC21_40\"`). A label written in ROOT's TLatex (`#sqrt{s}`, `p_{T}` with no `$`) is \
  refused, with its LaTeX as the hint; `heimdall migrate` rewrites it (V79). `\\_`, `\\^` and `\\#` \
  also give the character, even before a brace; in TOML write them in single quotes, \
  `'PDF4LHC21\\_40'`, since in `\"…\"` a backslash starts a TOML escape"""

[quantity.shape]
type = "str|list"
doc  = "a user quantity's value shape, as the vocabulary's: \"pdg\", \"float|int\", [\"float\", \"float\"] (V76)"
notes = """\
  the values' shape, in the vocabulary's grammar (V76): `\"pdg\"`, `\"float|int\"`, `[\"float\", \
  \"float\"]`; checked when the TOML is read. For a quantity of your own (one the vocabulary, \
  `framework/schema/quantities.toml`, does not name); a vocabulary quantity has its own shape"""

[quantity.styles]
type  = "list"
items = "table"
doc   = "one per value: its curves' look, { colour, line, width } (V67)"
notes = """\
  one per value (V67): its curves' look, `{ colour, line, width }`. `colour` is `\"#rrggbb\"`, a \
  ROOT name (`\"kBlue+1\"`) or number (the yoda backend draws `#rrggbb` only); `line` is `solid`, \
  `dashed`, `dotted` or `dashdot`; `width` is in points. A key left out, or `\"default\"`, is the \
  style's; curves with no colour take the palette in turn, as mkhtml's take its cycle. A value \
  keeps its look on every page, so a PDF is one colour throughout. With two curve axes, the later \
  one's keys win"""

[quantity.key]
type = "str|table"
doc  = "the native key, or { <tool or tag> = key }"
notes = """\
  the native key. A string needs a `target`. A table entry for a tool tag wins over one for its \
  type."""

[quantity.target]
type = "str|list"
doc  = "<tag>, <tag>/<analysis> or <tag>/seed"
notes = """\
  restricts the consumers (04 §8.1)"""

[quantity.format]
type = "str"
doc  = "how the value is written: a Python format, \"{}*GeV\""
notes = """\
  a Python format for the value: `\"{}*GeV\"`"""

[quantity.description]
type = "str"
doc  = "what the quantity is"

[quantity.exclude]
type  = "list"
doc   = "1-based value places a sweep leaves out"
notes = """\
  values a sweep leaves out, by their **1-based** place (as `static = \"#2\"` and `--points 2` \
  count): `exclude = [2]` sweeps the others. The remaining points keep their names and identities \
  and are numbered 1… over what is swept. In an entangled group, a value any member excludes \
  leaves the group. `static` may still pick an excluded value. Refused: a place outside \
  1…len(values), or none left (V42)"""

# ── [tools.<tag>] ────────────────────────────────────────────────────────────────────────────

[tool.tool]
type     = "str"
required = true
doc      = "a tool folder: shipped, the machine's or the work dir's (heimdall tools)"
notes = """\
  a tool folder's name (05 §3): Heimdall's `framework/tools/`, the machine root's or the work \
  dir's `tools/` (`heimdall tools` lists them); `\"exec\"` runs any executable, `\"module\"` a \
  `Module.hh` program"""

[tool.baseconfig]
path = "baseconfig"
type = "str|list"
doc  = "base card(s), configs/<Project>/…"
notes = """\
  native base card(s), read in order (root `configs/<project>/`). Tools with a card only."""

[tool.input]
type = "str|list"
doc  = "what it reads: an interface or a file"
notes = """\
  what it reads: `[prelim]` names, another tool's `output_file`, a pre product, (post) a product \
  of every point, or a path. The first input is `{input}`."""

[tool.output_file]
type = "str|list"
doc  = "what it writes: an interface or a product"
notes = """\
  what it writes. An array is fan-out: App_Pythia writes the same events to each (V16). Exactly \
  one writer per output (C6)."""

[tool.timeout]
type = "float"
min  = 0
doc  = "seconds before it is stopped (0: never)"
notes = """\
  the tool fails when it runs longer"""

[tool.stall_after]
type = "float"
min  = 0
doc  = "seconds of silence before it counts as stalled (default 300)"
notes = """\
  the tool fails when silent this long: no log line, status message or heartbeat (a prepare step \
  waits at least 3600)"""

[tool.status]
type    = "str"
choices = ["standard", "filters", "none"]
doc     = "how its progress is read: the status protocol, its log's filter rules, or not at all"
notes = """\
  `\"standard\"` (`$HEIMDALL_STATUS_FD`), `\"filters\"` (the folder's `filters.toml`), `\"none\"`"""

[tool.filters]
path = "filters"
type = "str"
doc  = "a filters.toml of your own (configs/<Project>/…), in place of its folder's"
notes = """\
  your own rules in place of the folder's, root `configs/<P>/`; implies `status = \"filters\"` \
  (V61)"""

[tool.executable]
path = "executable"
type = "str"
doc  = "custom/module: build/<project>/<name>, or path:<command>"
notes = """\
  exec and module: bare → `build/<project>/<name>` (must be built); `path:<command>` → `PATH`"""

[tool.arguments]
type = "list"
doc  = "custom: its arguments"
notes = """\
  exec and module: argv after the config; placeholders (04 §10). Not paths: the tool runs in the \
  point's folder, so a script of yours is `{work}/modules/…`"""

[tool.consumes]
type  = "list"
items = "str"
doc   = "custom/module: quantities it reads from its config"
notes = """\
  exec and module: quantities written into the config"""

[tool.config]
type = "table"
doc  = "custom/module: written to config/<tag>.toml"
notes = """\
  exec and module: `[tools.<tag>.config]`, extracted to a file (04 §9.2)"""

[tool.streamable]
type = "bool"
doc  = "it can read a FIFO"
notes = """\
  may it read a FIFO?"""

[tool.consumes_events]
type = "bool"
doc  = "its event count is checked against the producer's"
