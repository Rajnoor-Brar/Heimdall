  `\"area\"` (V68): every curve, and the data, scaled to unit area, Σ value × bin width over the \
  bins drawn (after voiding and the data's alignment), so pages compare shapes. Both backends \
  scale the same way. The y label stays the `.plot`'s: set `y_label` (e.g. \
  `\"$1/\\sigma\\,\\mathrm{d}\\sigma/\\mathrm{d}E_T$\"`) on the pages it applies to. A figure (04 \
