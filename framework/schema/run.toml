  `\"data\"` (the default): the mapped data where a page has it, else the page's first curve; `\"curves\"`: \
  each page's first curve, data or not; a filter, `{ generator = \"py8\", pdf = \"NNPDF23lo\" }`, names the \
  reference curve on every page (moved first), data or not"""

