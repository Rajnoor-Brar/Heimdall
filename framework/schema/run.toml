[plot.range_pad]
page       = true
type       = "int"
min        = 0
default    = 0
default_ok = true
doc        = "whole bins added around auto_range"
notes = """\
  whole bins kept either side of the filled ones"""

[plot.sets]
page  = true
type  = "list|table"
items = "int|str|list|table"
doc   = "page folders of chosen points: [[1, 4], \"py8\", \"all\"] (V159), or tables of page axes and curve groups, { name, pages = { … }, curves = [{ … }] } (V163)"
notes = """\
  the pages' cells, instead of the `plot_points` grid. An entry is a selector, a list of them \
  (`set<k>`, its place), or a table. A selector (V159) is a 1-based index (as `point i/n` counts), a \
  point's name, a glob of names (`"sh3_NNPDF40*"`), a tag of a quantity's (`"py8"`: every point with it), \
  `"quantity=tag"`, or `"all"`; a string entry names its folder (`"pdf=X"` → `pdf-X`); its points are its \
  curves, in the order named. A table (V163, `[[plot.sets]]`): `name` (its folder, default `set<k>`), \
  `points` (selectors), `pages` (a filter whose quantities are the page axes: a cell per combination of \
  their values among the set's points, `<set>/<cell>/<object>`), `curves` (a filter, or a list of them: \
  the union, in order), `reference` (a filter: the curve moved first on each page), `look` (`{ colour = \
  "<q>", line = "<q>" }`, or `"palette"`; with none, two varying curve axes: the one of at most 4 values \
  the line), and any page key of `[plot]`, `objects` and `style` for its pages. A filter is `{ quantity = \
  "all" | tag | glob | "!tag" | number | [those] }`: every combination of its quantities' values (an outer \
  product). In `curves`, a value may carry its curves' look: `{ tag = "…", colour, line, width }`, or \
  several values' in order, `{ tags = "all" | […] (or all = true), colours = […], lines = […], widths = […] }` \
  (`color`, `colors` accepted). A swept quantity a table names in neither pages nor curves, taking several values, pages \
  too, and the stage says so. A selector, tag or quantity no point has is refused at plan time. merged, \
  scan and compare figures page by `plot_points` only"""

[plot.looks]
type = "table"
doc  = "each value's look on every page, by quantity and tag: [plot.looks.pdf] NNPDF23lo = \"#0067A5\" (or { colour, line, width }) (V171)"
notes = """\
  [plot.looks.<quantity>] (V171): a value's look on every page and in every run, by its tag: a colour \
  (`\"#rrggbb\"`, a ROOT name or number) or `{ colour, line, width }`. A tag a run does not have is unused, so \
  a value commented out keeps its look. Over the quantity's own styles; a set's look, and a curves filter's \
  styled values, over it; a set's automatic look leaves an axis with looks alone"""

[plot.across]
type = "table"
doc  = "the run TOML's sets across its runs, [plot.across.<set>]: drawn at results/<P>/<name>/, by @run, @events, @configuration, @tag and the quantities (V169)"
notes = """\
  sets of the runs of this run TOML together (V169), as `[plot.sets.<name>]` are of one run's points, with \
  more axes: `@events` (each run's event count, tags like `10M`), `@run` (its folder), `@configuration` and, \
  when a run is tagged, `@tag` (each run's tag; an untagged run's labelled `untagged`). `@events` and `@tag` each \
  page a set that does not name it. Kept in `results/<P>/<name>/plot.toml`, drawn by `heimdall plot <P>/<name> --across` into \
  `results/<P>/<name>/plots/<set>/` and `statistics/<set>/`; which runs, and how, is `[plot.across_from]`"""

[plot.across_from]
type = "table"
doc  = "which runs the sets across them take and how (runs, prefer, ignore): the drawing's [from] (V224)"
notes = """\
  the runs together's `[from]`: written into `results/<P>/<name>/plot.toml` over its defaults (every run, \
  `prefer = \"last\"`) when a run writes that document, and by `heimdall plot … --across --style-sync`; \
  without this table a sync leaves the document's `[from]` as it is. Its keys are 04 §11.4"""

[plot.draw]
type  = "list"
items = "str"
doc   = "the sets a drawing draws (default: every one): their names, totality included (V167)"
notes = """\
  the names of the sets `heimdall plot` draws when it is given none (`--sets`), every set by default; a run \
  writes `[run].plot`'s list here. A name no set has is refused"""

[plot.split]
page = true
type = "int"
min  = 1
doc  = "at most this many points a page: each cell (or set) cut in order, <cell>-1, <cell>-2, … (V159)"
notes = """\
  at most this many points on a page (V159): each cell (a `plot_points` cell, or a set) cut into pages in \
  point order, `<cell>-<k>` (`part<k>` with no cell): 24 points, `split = 3`, 8 pages. A curve is \
  labelled by the quantities that differ on its page"""

[plot.statistics]
type       = "bool"
default    = true
default_ok = true
doc        = "write results/…/statistics/<set>/statistics.csv and its bar graphs: each page's curves' area, area against the reference, χ² (V160, V162, V164)"
notes = """\
  each page's statistics, as Paint draws it (after voiding, alignment and normalisation, over the x span \
  auto-range and the gutters give: `x_range` and `y_range` only show), into each set's `results/…/statistics/<set>/statistics.csv` (V160, V164): per curve `area` (Σ y·Δx) and its error; \
  against the reference (the data, else the page's first curve), on the reference's bins the curve covers, \
  `ref_area` and the curve's `cmp_area` there, `abs_area` (Σ |y − y_ref|·Δx), `rel_abs_area` (abs_area / \
  ref_area), `area_ratio` (cmp_area / ref_area: MC over data, V175), `ratio_mean` (the ratio pad's mean, \
  Σ y/y_ref·Δx / Σ Δx, Δx in log x on a log-x page, V175), `ratio_dev` (its area about one over the width \
  compared, Σ |y/y_ref − 1|·Δx / Σ Δx), `chi2`, `ndf`, `chi2_ndf`. false: no table"""

[plot.legend_statistic]
page    = true
type    = "str"
choices = ["none", "area", "abs_area", "rel_abs_area", "area_ratio", "ratio_mean", "ratio_dev", "chi2", "chi2_ndf"]
default = "none"
doc     = "a statistic after each curve's legend entry, against the page's reference (V160)"
notes = """\
  one of the statistics (see `statistics`) after each curve's legend entry: `chi2_ndf` → `(χ²/ndf 1.31)`; \
  the reference's own entry gets none"""

[plot.root_style]
path = "root_style"
