# ── [plot.figures.<figure>]: a recipe for pages ─────────────────────────────────────────────
# A figure takes every [plot] key marked `page = true`, meaning the same for its pages ("default":
# [plot]'s value), and these, which only a figure sets (schema.keys("figure") joins the two).

[figure.class]
type    = "str"
choices = ["defined", "overlay", "merged", "compare", "derived", "scan", "sheet", "statistic"]
default = "defined"
doc     = "how its pages are built: defined (an analysis object's own), overlay (several objects of each point), merged (the objects' pages with the points merged over `over`), compare (the objects' pages across configurations), derived (a new object from the objects, per point), scan (one number per point against a swept quantity), sheet (drawn pages in a grid)"
notes = """\
  how the pages are built. `defined`: an analysis object's own pages, `<cell>/<object>`, its \
  curves the cell's points (and option variants). `overlay`: several objects of each point on one \
  page, `<cell>/<name>`; a curve per object and point, labelled by `labels` (plus the point's, \
  when the page has several); a ratio divides by the first curve. `merged` (V82): the objects' \
  pages, `<cell>/<name>/<object>`, with the points merged over the `over` axes: per value of the \
  other axes, their YODAs merged by the combine folder's command (`rivet-merge -e`: statistics \
  add, σ averaged), once per change of a member's YODA, into `.cache/…/merged/<name>/`. The \
  run keeps its points apart; the figure alone merges them (`combine` merges them for the whole \
  configuration). `sheet` (V89): drawn pages laid out in a grid (`pages`, `columns`; below). \
  `compare` (V83): the objects' pages across configurations, \
  `<run>/compare/<name>/<cell>/<object>` beside the configurations' own folders (in `records/` and \
  `results/`, a folder per backend). A curve per configuration and point (or combined group), \
  labelled by the configuration (`labels`, else its `label`) and then the point's curve axes. The \
  configurations must have the same page and curve axes (checked at plan time); the figure is \
  drawn by the plot stage of each of them once all have complete points, and says what it waits \
  for otherwise (`heimdall plot` draws it too). `derived` (V84): a new object per point, \
  `/FIGURES/<name>` (`/FIGURES:R=0.4/<name>` per analysis-option variant): `op = \"ratio\"`, \
  `\"difference\"` or `\"sum\"` of its two objects (histograms made estimates first; the same \
  binning, else an error naming both), or `\"projection-x\"`/`\"projection-y\"` of its one 2D \
  object (summed over the other axis: a histogram's weights, an estimate's values × widths, as a \
  Scatter2D whose x ranges are the bins). It is appended to a copy of each point's YODA \
  (`.cache/…/derived/`, remade when the product or the figures change, by \
  `framework/plot/figures/derive.py`: YODA's Python, so `gjallarhorn`), and is then an object like any: \
  its pages `<cell>/<name>` (labels from its first object's `.plot`; set `y_label`), an overlay or \
  a merged or compare figure may name it (`\"r15\"`). `scan` (V85): one number per point against a \
  swept quantity: `x` a curve axis whose values are numbers, `y` = `sigma` (the point's `/_XSEC`), \
  `entries` (its events, or its object's raw entries), or `integral`, `mean`, `bin:N` of its one \
  object. A page per cell, `<cell>/<name>`, a curve per value of the other curve axes: a \
  Scatter2D, a point per x value with an x range halfway to its neighbours centred on it (so every \
  backend can draw it as a bin; it is drawn as markers, `type = \"Scatter2D\"`). Axis titles: the \
  quantity's name and the y read, until set. A quantity of names (PDF sets) cannot be an x yet"""

[figure.type]
type    = "str"
choices = ["Hist1D", "Scatter2D", "HeatMap"]
doc     = "what is drawn: Hist1D (steps), Scatter2D (a marker per bin, as data: V86), HeatMap (a 2D object coloured, a page per point: V87); default: from the objects (2D: HeatMap), a scan's Scatter2D"
notes = """\
  what is drawn: `Hist1D`, steps per curve; `Scatter2D` (V86), a marker per bin at its centre with \
  its y error, in the curve's colour (`data.marker`, `data.marker_size` of the style), as Paint \
  draws data; the legend shows the marker. The page TOML says `markers = true`; mkhtml and mpl \
  draw the curves as they draw points (`ConnectBins=0`, with their x bars). `HeatMap` (V87): a 2D \
  object (a YODA `Histo2D` or `Estimate2D`), the default for one: a page per point of the cell, \
  `<cell>/<object>/<point>`, coloured by value with its scale on the right (labels from the \
  `.plot`, `ZLabel` and `LogZ` too; no ratio, data or voiding). Paint draws heat maps; mkhtml and \
  mpl draw the 1D pages only, and the plot stage says so. A 1D object cannot be a HeatMap, a 2D \
  object neither a Hist1D nor a Scatter2D, nor in an overlay"""

[figure.name]
type = "str"
doc  = "its pages' file stem (default: the figure's key; a defined figure's pages keep the object's name)"
notes = """\
  an overlay's page file stem, a merged figure's folder. A defined figure takes none: its pages \
  are the objects' own"""

[figure.objects]
type  = "list"
items = "str"
doc   = "the objects: YODA path globs, matched against the short name (d01-x01-y01) or the full path"
notes = """\
  matched against the short name (`d04-x01-y01`), the option-free path or a variant's path. A glob \
  matching no object of the points is an error, at the plot stage"""

[figure.statistic]
type    = "str"
choices = ["area", "abs_area", "rel_abs_area", "area_ratio", "ratio_mean", "ratio_dev", "chi2", "chi2_ndf"]
doc     = "a statistic figure's number: one of the plot stage's statistics, a bin per point (V160)"
notes = """\
  a statistic figure's number (V160), as `statistics.csv` has it: per cell (or set) and object, a page \
  whose x axis is the page's curves by their labels, a bin each, and y that number of each against the \
  page's reference (its own reference curve left out), drawn as markers; `area` with its error. Its \
  pages: `<cell>/<name>/<object>`"""

[figure.sort]
type    = "bool"
default = false
doc     = "a statistic figure's: its points best first (the smallest number), instead of in curve order (V160)"

[figure.op]
type    = "str"
choices = ["ratio", "difference", "sum", "projection-x", "projection-y"]
doc     = "a derived figure's: of its two objects (ratio, difference, sum), or of its 2D histogram (projection-x, -y) (V84)"
notes = """\
  a derived figure's: `ratio`, `difference`, `sum` (two objects), `projection-x`, `projection-y` \
  (one)"""

[figure.x]
type = "str"
doc  = "a scan figure's x: a swept quantity with numeric values, a curve axis (V85)"
notes = """\
  a scan figure's quantity (a numeric curve axis) and number (`sigma`, `entries`, `integral`, \
  `mean`, `bin:N`); `sigma` and `entries` need no object"""

[figure.y]
type = "str"
doc  = "a scan figure's y: sigma, entries, or integral, mean, bin:N of its object (V85)"
notes = """\
  a scan figure's quantity (a numeric curve axis) and number (`sigma`, `entries`, `integral`, \
  `mean`, `bin:N`); `sigma` and `entries` need no object"""

[figure.pages]
type  = "list"
items = "str"
doc   = "a sheet's pages: globs of page names (18x275/d02-x01-y01, */eta_algorithms), in this order (V89)"
notes = """\
  a sheet's (V89): the drawn pages whose names (`18x275/d02-x01-y01`, `*/eta_algorithms`) the \
  globs match (by their names in each set), in the globs' order, tiled `columns` wide into `plots/<set>/<backend>/sheets/<name>.pdf` \
  and `.png`, each pad the page as it was drawn alone (pdflatex places the PDFs as vectors, a PNG \
  where a page has no PDF; the `.png` is that PDF rendered by pdftoppm, V102). For Paint's and \
  mpl's pages. A sheet takes no page keys (its pages' figures set those); a glob naming no page \
  fails the sheet"""

[figure.columns]
type = "int"
min  = 1
doc  = "a sheet's columns (default: up to 3)"
notes = """\
  a sheet's (V89): the drawn pages whose names (`18x275/d02-x01-y01`, `*/eta_algorithms`) the \
  globs match (by their names in each set), in the globs' order, tiled `columns` wide into `plots/<set>/<backend>/sheets/<name>.pdf` \
  and `.png`, each pad the page as it was drawn alone (pdflatex places the PDFs as vectors, a PNG \
  where a page has no PDF; the `.png` is that PDF rendered by pdftoppm, V102). For Paint's and \
  mpl's pages. A sheet takes no page keys (its pages' figures set those); a glob naming no page \
  fails the sheet"""

[figure.over]
type  = "list"
items = "str"
doc   = "a merged figure's: the curve axes whose points it merges, by the combine folder's command (V82)"
notes = """\
  a merged figure's: curve axes of the configuration (swept, not `plot_points`, not combined), \
  checked at plan time; it may not also `band` them"""

[figure.configurations]
type  = "list"
items = "str"
doc   = "a compare figure's configurations (default: the sweep_runs ones), each a curve per point (V83)"
notes = """\
  a compare figure's, two or more, in curve order; one at least of this file. \
  `\"<Project>/<config>:<cfg>\"` (V88) names a configuration of another run TOML: its points (as \
  its last run left them) are curves beside this run's, labelled `<its run> <its label>` by \
  default and by its own quantities; its page axes must have this run's tags. The pages are this \
  run's (`<run>/compare/<name>/`), drawn by this run's plot stage or `heimdall plot`"""

[figure.labels]
type  = "list"
items = "str"
doc   = "an overlay's legend label per object; a compare figure's per configuration"
notes = """\
  an overlay's: one legend label per object; a compare figure's: one per configuration (default: \
  each configuration's `label`)"""

[figure.x_label]
type       = "str"
default_ok = true
doc        = "the x axis title (default: the .plot's)"
notes = """\
  the axis titles (LaTeX)"""

[figure.y_label]
type       = "str"
default_ok = true
doc        = "the y axis title (default: the .plot's)"
notes = """\
  the axis titles (LaTeX)"""

[figure.style]
type = "table"
doc  = "a style layer for these pages"
notes = """\
  a style layer for these pages (04 §12)"""

# ── [plot.across_from]: the runs together's [from] (V224) ───────────────────────────────────

[across_from.runs]
type    = "list"
items   = "str"
default = ["*"]
doc     = "the runs drawn together: globs of their folders (04_*, 0[5-7]_*)"
notes = """\
  the runs drawn together, by globs of their folders beside the document (`[\"04_*\", \"0[5-7]_*\"]`); \
  every run by default"""

[across_from.prefer]
type    = "str"
choices = ["last", "all"]
default = "last"
doc     = "a point two runs of one tag have: drawn from the later (last) or from both (all)"
notes = """\
  a point two runs have (every quantity's tag, the event count and the run's tag the same, the ignored \
  quantities aside): `\"last\"` draws it from the later run that completed it, and says so; `\"all\"` keeps \
  both. Runs of different tags never stand for each other"""

[across_from.ignore]
type  = "list"
items = "str"
doc   = "quantities (or \"@events\") that are no axis across the runs: one value within each run (V224)"
notes = """\
  quantities of the runs (or `\"@events\"`) that are no axis across them: an ignored quantity never pages \
  a set or tells its curves apart, and never keeps two runs' points apart (with `prefer = \"last\"` the \
  later stands for both, unless their tags differ). It must hold one value within each run, else the \
  drawing is refused, naming the run and its values; its value stays each point's, so a page text that \
  cites it (`{q:generator}`) shows it when the page's curves share it. A name no run has is refused"""

# ── [plot.data] ──────────────────────────────────────────────────────────────────────────────

[data.file]
type = "str"
doc  = "a YODA under datasets/, or rivet:<Analysis>"
notes = """\
  `rivet:<Analysis>`: Rivet's own reference file (`build/Rivet/`, then `rivet-config --datadir`, \
  `.yoda` or `.yoda.gz`); otherwise a path under `datasets/` (not in git)"""

[data.legend]
type    = "str"
default = "Data"
doc     = "the data's legend entry"
notes = """\
  the data's legend entry"""

[data.map]
type = "table"
doc  = "object = reference path, explicitly"
notes = """\
  MC object name (`d01-x01-y01`) → reference path. **Explicit only**, never matched by name (L18). \
  A file without a map, or a map without a file, is an error."""

# ── [cluster]: heimdall cluster, a run as Slurm jobs (V114) ───────────────────────────────────────────
# Also the machine root's machine.toml [cluster] and a work dir's heimdall.toml [cluster] (the defaults, in
# that order); the run TOML's is over them, a configuration's ([run.cfgs.<cfg>].cluster) over that,
# --set cluster.<key>=… over all (04 §16).

[cluster.scheduler]
type    = "str"
choices = ["slurm"]
default = "slurm"
doc     = "the batch system: slurm (sbatch)"
notes = """\
  the batch system `heimdall cluster` submits to: `\"slurm\"` (`sbatch`, `squeue`, `sacct`, `scancel`), \
  the only one so far"""

[cluster.time]
type = "str"
doc  = "each job's time limit (--time), required in some layer"
notes = """\
  each job's wall-time limit, as `sbatch --time` takes it (`\"02:00:00\"`, `\"1-00:00:00\"`): one \
  point's, for the points; **required** in one of the layers, because a site's default limit is a \
  surprise `TIMEOUT`"""

[cluster.partition]
type = "str"
doc  = "the partition (--partition); unset: the site's default"
notes = """\
  `sbatch --partition`; unset: the site's default"""

[cluster.account]
type = "str"
doc  = "the account to charge (--account)"
notes = """\
  `sbatch --account`; unset: the user's default"""

[cluster.qos]
type = "str"
doc  = "the quality of service (--qos)"
notes = """\
  `sbatch --qos`"""

[cluster.constraint]
type = "str"
doc  = "node features (--constraint)"
notes = """\
  `sbatch --constraint`, the nodes' features (`\"avx2\"`)"""

[cluster.gres]
type = "str"
doc  = "generic resources (--gres)"
notes = """\
  `sbatch --gres` (`\"gpu:1\"`)"""

[cluster.memory]
type = "str"
doc  = "memory per job (--mem); unset: the partition's default"
notes = """\
  `sbatch --mem` per job (`\"8G\"`); unset: the partition's default"""

[cluster.cpus]
type    = "int"
min     = 0
default = 0
doc     = "cores per job (--cpus-per-task); 0: the costliest point's"
notes = """\
  `sbatch --cpus-per-task`; `0`: the costliest point's cores, as `--plan` counts them (its \
  generator's `threads`, a sharded tool's shards, an integrated program's threads and one more)"""

[cluster.max_running]
type    = "int"
min     = 0
default = 0
doc     = "at most this many points at once (the array's %K); 0: no limit"
notes = """\
  the points array's throttle, `--array=1-N%K`; `0`: as many as the scheduler gives. `parallelism` \
  is not used: each job is one point"""

[cluster.mail]
type = "str"
doc  = "mail this address when a job ends or fails"
notes = """\
  `sbatch --mail-user`, with `--mail-type=END,FAIL`"""

[cluster.setup]
type    = "list"
items   = "str"
default = []
doc     = "shell lines each job runs before Heimdall's gjallarhorn.sh (module loads)"
notes = """\
  shell lines each job runs first, before it sources Heimdall's `gjallarhorn.sh` (`\"module load \
  gcc/13\"`): what the nodes need that the login shell had"""

[cluster.image]
type = "str"
doc  = "run each job in this Apptainer image: a name of <machine root>/images, or a .sif's path"
notes = """\
  the image's own Heimdall and stack run the job (`apptainer exec --cleanenv`, or `singularity`), with the \
  work dir bound at its own path; `setup` still runs first, on the node (`\"module load apptainer\"`). \
  `heimdall image build` makes one (V150)"""

[cluster.sbatch]
type    = "list"
items   = "str"
default = []
doc     = "any other sbatch options, as written"
notes = """\
  any other `sbatch` options, each as written (`\"--exclusive\"`, `\"--export=NONE\"`, \
  `\"--reservation=r\"`), after the ones the keys above give"""

[cluster.pre]
type = "table"
doc  = "time, memory, cpus, … for the pre job only"
notes = """\
  the resource keys (`time`, `partition`, `account`, `qos`, `constraint`, `gres`, `memory`, `cpus`, \
  `sbatch`) for the pre job only, over the others"""

[cluster.finish]
type = "table"
doc  = "time, memory, cpus, … for the finish job only (combine, post, plots)"
notes = """\
  the resource keys for the finish job only (the combined groups, the post tools and the plots), \
  over the others; its `cpus` default to 1"""
