  is its event count checked against the producer's sidecar?"""

[tool.settings]
type = "table"
doc  = "native card settings, as written: \"HeavyIon:mode\" = 1 (over the base card, under quantities)"
notes = """\
  native card settings as written, `\"HeavyIon:mode\" = 1`, with no base card needed: over the \
  base card, refused when a quantity sets the same key (one source per key, C8); a tool with no \
  card refuses them (V59)"""

[tool.cores]
type = "int"
min  = 1
doc  = "cores it keeps busy, for --plan's note (default: estimated)"
notes = """\
  how many cores it keeps busy, for `--plan`'s note and the crowded warning (V60); an integrated \
  program is estimated as the generator's threads and one more"""

[tool.shards]
type    = "int"
min     = 1
default = 1
doc     = "K processes on a share of the events each"
notes = """\
  K > 1: K processes of this tool, each on a share of the events, merged into its `output_file` by \
  the folder's merge tool (V31; rivet, 05 §5.1). The chain is unchanged."""

# ── [plot] ───────────────────────────────────────────────────────────────────────────────────

[plot.backend]
type       = "str|list"
items      = "str"
choices    = ["root", "yoda", "mpl", "both"]
default    = "root"
default_ok = true
doc        = "root (Paint), yoda (deprecated, rivet-mkhtml), mpl (matplotlib, V71), a list of them, or both (root and yoda)"
notes = """\
  `\"root\"` (Paint), `\"yoda\"` (deprecated, rivet-mkhtml; frozen, V71), `\"mpl\"` (matplotlib, \
  mkhtml's pages drawn in-process: V71), `\"both\"` (root and yoda, V28) or an array of them, from \
  the same pages"""

[plot.formats]
type       = "list"
items      = "str"
choices    = ["pdf", "png", "svg", "eps"]
default    = ["pdf"]
default_ok = true
doc        = "the pages' formats"
notes = """\
  `pdf`, `png`, `svg`, `eps`. mkhtml writes pdf and png always. The root backend writes \
  `plots/<set>/root/index.html` (V70, V164): a section per cell, each page by its PNG or SVG, \
  else an embedded PDF, linked to every format; add `png` for thumbnails a browser shows at once"""

[plot.band]
page       = true
type  = "list"
items = "str"
doc   = "curve-axis quantities drawn as one curve, their first value, with the min–max envelope of all their values (V69)"
notes = """\
  curve axes drawn as an envelope (V69): per value of the other curve axes, one curve, the band \
  quantity's first value, with the min–max of all its values shaded around it in the curve's \
  colour (the usual PDF or scale band). Its legend entry ends `(<q> envelope)`; its own \
  statistical errors are not drawn. A name that is not a curve axis of the configuration (swept, \
  not `plot_points`, not combined) is refused at plan time. The yoda backend draws the same \
  envelope as mkhtml's error band"""

[plot.objects]
type       = "list"
items      = "str"
default_ok = true
doc        = "YODA path globs that get pages (default: every 1D object)"
notes = """\
  matched against the option-free YODA path (`/photo_eic/d01-x01-y01`) or any variant's path. No \
  object matching is an error."""

[plot.ratio]
page       = true
type       = "bool"
default    = false
default_ok = true
doc        = "a ratio pad"
notes = """\
  a ratio pad: each curve over the data, or over the first curve when there are no data"""

[plot.y_gutter]
page       = true
type       = "float"
min        = 0
default    = 0.5
default_ok = true
doc        = "the top of the y axis at (1 + g) × the largest value"
notes = """\
  the top of the y axis at (1 + g) × the largest drawn value (on a log axis, g of the decades \
  shown); `0`: no headroom. `\"native\"`: no gutter, the tool's own range (V29, V55; a v2 file's \
  [plot] says `\"default\"`)"""

[plot.x_gutter]
page       = true
type       = "float"
min        = 0
default_ok = true
doc        = "x widened by g of its span"
notes = """\
  widens x by g of its span, symmetrically (in decades on a log axis). `\"default\"`: the range \
  the bins give"""

[plot.x_range]
page        = true
type        = "list"
items       = "float|str"
item_choices = ["default"]
length      = 2
ordered     = true
doc         = "the x axis limits"
notes = """\
  the x axis limits, `[minimum, maximum]`, each end a number or `\"default\"`: the layer below's end \
  (a figure's `[\"default\", 10]` keeps `[plot]`'s minimum), and in `[plot]` the range the page \
  calculates. They only show: the statistics are taken over the calculated range. A heat map and a \
  statistic figure take them from their own figure alone; a heat map's are kept within its \
  histogram and widened to whole bins, and a range that misses the histogram is refused"""

[plot.y_range]
page        = true
type        = "list"
items       = "float|str"
item_choices = ["default"]
length      = 2
ordered     = true
doc         = "the y axis limits"
notes = """\
  the y axis limits, `[minimum, maximum]`, each end as in `x_range`. A numeric end holds when a \
  curve passes it: Paint and mpl clip the curve at the frame and mark each bin past it with a thin \
  line in the curve's colour, 2 px outside the frame (inside where a joined ratio pad leaves no \
  room); curves past it in one bin share its width. The data are never marked, nor a value <= 0 on \
  a log axis"""

[plot.logy]
page       = true
type       = "bool"
default_ok = true
doc        = "log y (default: the .plot's)"

[plot.logx]
