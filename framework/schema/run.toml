# ── [plot.figures.<figure>]: a recipe for pages ─────────────────────────────────────────────
# A figure takes every [plot] key marked `page = true`, meaning the same for its pages ("default":
# [plot]'s value), and these, which only a figure sets (schema.keys("figure") joins the two).

[figure.class]
type    = "str"
choices = ["defined", "overlay", "merged", "compare", "derived", "scan", "sheet"]
default = "defined"
doc     = "how its pages are built: defined (an analysis object's own), overlay (several objects of each point), merged (the objects' pages with the points merged over `over`), compare (the objects' pages across configurations), derived (a new object from the objects, per point), scan (one number per point against a swept quantity), sheet (drawn pages in a grid)"
notes = """\
  how the pages are built. `defined`: an analysis object's own pages, `<cell>/<object>`, its \
  curves the cell's points (and option variants). `overlay`: several objects of each point on one \
  page, `<cell>/<name>`; a curve per object and point, labelled by `labels` (plus the point's, \
  when the page has several); a ratio divides by the first curve. `merged` (V82): the objects' \
  pages, `<cell>/<name>/<object>`, with the points merged over the `over` axes: per value of the \
  other axes, their YODAs merged by the combine folder's command (`rivet-merge -e`: statistics \
  add, σ averaged), once per change of a member's YODA, into `output/…/plots/merged/<name>/`. The \
  run keeps its points apart; the figure alone merges them (`combine` merges them for the whole \
  configuration). `sheet` (V89): drawn pages laid out in a grid (`pages`, `columns`; below). \
  `compare` (V83): the objects' pages across configurations, \
  `<run>/compare/<name>/<cell>/<object>` beside the configurations' own folders (in `output/` and \
  `results/`, a folder per backend). A curve per configuration and point (or combined group), \
  labelled by the configuration (`labels`, else its `label`) and then the point's curve axes. The \
  configurations must have the same page and curve axes (checked at plan time); the figure is \
  drawn by the plot stage of each of them once all have complete points, and says what it waits \
  for otherwise (`hep plot` draws it too). `derived` (V84): a new object per point, \
  `/FIGURES/<name>` (`/FIGURES:R=0.4/<name>` per analysis-option variant): `op = \"ratio\"`, \
  `\"difference\"` or `\"sum\"` of its two objects (histograms made estimates first; the same \
  binning, else an error naming both), or `\"projection-x\"`/`\"projection-y\"` of its one 2D \
  object (summed over the other axis: a histogram's weights, an estimate's values × widths, as a \
  Scatter2D whose x ranges are the bins). It is appended to a copy of each point's YODA \
  (`output/…/plots/derived/`, remade when the product or the figures change, by \
  `utils/Env/figures/derive.py`: YODA's Python, so `load_hep`), and is then an object like any: \
  its pages `<cell>/<name>` (labels from its first object's `.plot`; set `y_label`), an overlay or \
  a merged or compare figure may name it (`\"r15\"`). `scan` (V85): one number per point against a \
  swept quantity: `x` a curve axis whose values are numbers, `y` = `sigma` (the point's `/_XSEC`), \
  `entries` (its events, or its object's raw entries), or `integral`, `mean`, `bin:N` of its one \
  object. A page per cell, `<cell>/<name>`, a curve per value of the other curve axes: a \
  Scatter2D, a point per x value with an x range halfway to its neighbours centred on it (so every \
  backend can draw it as a bin; it is drawn as markers, `type = \"Scatter2D\"`). Axis titles: the \
  quantity's name and the y read, until set. A quantity of names (PDF sets) cannot be an x yet"""

[figure.type]
type    = "str"
choices = ["Hist1D", "Scatter2D", "HeatMap"]
doc     = "what is drawn: Hist1D (steps), Scatter2D (a marker per bin, as data: V86), HeatMap (a 2D object coloured, a page per point: V87); default: from the objects (2D: HeatMap), a scan's Scatter2D"
notes = """\
  what is drawn: `Hist1D`, steps per curve; `Scatter2D` (V86), a marker per bin at its centre with \
  its y error, in the curve's colour (`data.marker`, `data.marker_size` of the style), as Paint \
  draws data; the legend shows the marker. The page TOML says `markers = true`; mkhtml and mpl \
  draw the curves as they draw points (`ConnectBins=0`, with their x bars). `HeatMap` (V87): a 2D \
  object (a YODA `Histo2D` or `Estimate2D`), the default for one: a page per point of the cell, \
  `<cell>/<object>/<point>`, coloured by value with its scale on the right (labels from the \
  `.plot`, `ZLabel` and `LogZ` too; no ratio, data or voiding). Paint draws heat maps; mkhtml and \
  mpl draw the 1D pages only, and the plot stage says so. A 1D object cannot be a HeatMap, a 2D \
  object neither a Hist1D nor a Scatter2D, nor in an overlay"""

[figure.name]
type = "str"
doc  = "its pages' file stem (default: the figure's key; a defined figure's pages keep the object's name)"
notes = """\
  an overlay's page file stem, a merged figure's folder. A defined figure takes none: its pages \
  are the objects' own"""

[figure.objects]
type  = "list"
items = "str"
doc   = "the objects: YODA path globs, matched against the short name (d01-x01-y01) or the full path"
notes = """\
  matched against the short name (`d04-x01-y01`), the option-free path or a variant's path. A glob \
  matching no object of the points is an error, at the plot stage"""

[figure.op]
type    = "str"
choices = ["ratio", "difference", "sum", "projection-x", "projection-y"]
doc     = "a derived figure's: of its two objects (ratio, difference, sum), or of its 2D histogram (projection-x, -y) (V84)"
notes = """\
  a derived figure's: `ratio`, `difference`, `sum` (two objects), `projection-x`, `projection-y` \
  (one)"""

[figure.x]
type = "str"
doc  = "a scan figure's x: a swept quantity with numeric values, a curve axis (V85)"
notes = """\
  a scan figure's quantity (a numeric curve axis) and number (`sigma`, `entries`, `integral`, \
  `mean`, `bin:N`); `sigma` and `entries` need no object"""

[figure.y]
type = "str"
doc  = "a scan figure's y: sigma, entries, or integral, mean, bin:N of its object (V85)"
notes = """\
  a scan figure's quantity (a numeric curve axis) and number (`sigma`, `entries`, `integral`, \
  `mean`, `bin:N`); `sigma` and `entries` need no object"""

[figure.pages]
type  = "list"
items = "str"
doc   = "a sheet's pages: globs of page names (18x275/d02-x01-y01, */eta_algorithms), in this order (V89)"
notes = """\
  a sheet's (V89): the drawn pages whose names (`18x275/d02-x01-y01`, `*/eta_algorithms`) the \
  globs match, in the globs' order, tiled `columns` wide into `plots/<backend>/sheets/<name>.pdf` \
  and `.png`, each pad the page as it was drawn alone (pdflatex places the PDFs as vectors, a PNG \
  where a page has no PDF; the `.png` is that PDF rendered by pdftoppm, V102). For Paint's and \
  mpl's pages. A sheet takes no page keys (its pages' figures set those); a glob naming no page \
  fails the sheet"""

[figure.columns]
type = "int"
min  = 1
doc  = "a sheet's columns (default: up to 3)"
notes = """\
  a sheet's (V89): the drawn pages whose names (`18x275/d02-x01-y01`, `*/eta_algorithms`) the \
  globs match, in the globs' order, tiled `columns` wide into `plots/<backend>/sheets/<name>.pdf` \
  and `.png`, each pad the page as it was drawn alone (pdflatex places the PDFs as vectors, a PNG \
  where a page has no PDF; the `.png` is that PDF rendered by pdftoppm, V102). For Paint's and \
  mpl's pages. A sheet takes no page keys (its pages' figures set those); a glob naming no page \
  fails the sheet"""

[figure.over]
type  = "list"
items = "str"
doc   = "a merged figure's: the curve axes whose points it merges, by the combine folder's command (V82)"
notes = """\
  a merged figure's: curve axes of the configuration (swept, not `plot_points`, not combined), \
  checked at plan time; it may not also `band` them"""

[figure.configurations]
type  = "list"
items = "str"
doc   = "a compare figure's configurations (default: the sweep_runs ones), each a curve per point (V83)"
notes = """\
  a compare figure's, two or more, in curve order; one at least of this file. \
  `\"<Project>/<config>:<cfg>\"` (V88) names a configuration of another run TOML: its points (as \
  its last run left them) are curves beside this run's, labelled `<its run> <its label>` by \
  default and by its own quantities; its page axes must have this run's tags. The pages are this \
  run's (`<run>/compare/<name>/`), drawn by this run's plot stage or `hep plot`"""

[figure.labels]
type  = "list"
items = "str"
doc   = "an overlay's legend label per object; a compare figure's per configuration"
notes = """\
  an overlay's: one legend label per object; a compare figure's: one per configuration (default: \
  each configuration's `label`)"""

[figure.x_label]
type       = "str"
default_ok = true
doc        = "the x axis title (default: the .plot's)"
notes = """\
  the axis titles (LaTeX)"""

[figure.y_label]
type       = "str"
default_ok = true
doc        = "the y axis title (default: the .plot's)"
notes = """\
  the axis titles (LaTeX)"""

[figure.style]
type = "table"
doc  = "a style layer for these pages"
notes = """\
  a style layer for these pages (04 §12)"""

