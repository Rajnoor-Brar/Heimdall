# framework/schema/v3.toml — the errand file's third form, as the reference shows it (runner/v3.py reads the form).
# Per table: `reads` the v2 schema table it is read as (run.toml); `renamed` v2 name → v3 name; `gone` v2's keys it does
# not have; `own` keys it has of its own; `words` its words for a key, where v2's would mislead.

[file]
reads = "config"
gone = []

[file.renamed]

[file.own.schema]
type = "int"
doc = "`3`, or `2` to keep a v2 file v2 for one release; a file with `[file]` is v3 without it"

[file.words]
import = "errand files this one starts from, in order, named as `heimdall run` names a config: `name` is this assignment's (`configs/<A>/name.toml`), `<A>/<E>` another assignment's, `./…` from the work dir; `.toml` optional. **This file wins**: a quantity or configuration of the file replaces the imported one whole; a tool table, `[plot]`, `[cluster]` and `[errand]`'s own keys merge key by key, tables recursively. Imports nest, depth-first; a circle is refused. Another assignment's file keeps its bare paths its own assignment's. The file that imports sets its own `[errand].name` and `assignment`. An entry may be `{ from = \"<config>\", only = [\"quantities\", \"cfgs.default\", …] }`: only those tables or dotted keys, each of which the file must have"
vars = "`name = value`, cited in any string of the file as `{var:name}` and replaced when the file is read, after its imports and `--set`, so an identity sees only the result. A string that is exactly one var takes its value as it is: `events = \"{var:events}\"` is an integer, and a list stays a list; inside a longer string a var must be a scalar (`\"rivet:{var:ana}\"`). An unknown name is refused with the nearest. An imported file's `{var:…}` takes this file's value; its own `[file.vars]` come with whatever is taken of it, under this file's. `--set file.vars.<name>=…` changes one for a job"

[errand]
reads = "errand"
gone = [
    "seed_type",
    "manual_seed",
    "cfgs",
]

[errand.renamed]
configuration = "run"
event_count = "events"
tools = "chain"
sweeps = "vary"

[errand.own.seed]
type = "str|int"
default = "identity"
doc = "`\"identity\"`: from the generator's identity; `\"random\"`: drawn when the point runs; an integer: exactly that seed for every point (a replica, `to = { \"pythia/seed\" = true }`, gives a point its own)"

[errand.own.commands]
type = "list"
doc = "argv arrays run in each point's output folder before its tools, in order; output to the point's `prelim.log`; a nonzero exit fails the point. Placeholders: `{work}`, `{heimdall}`, `{out}`, `{res}`, `{file:<name>}`"

[errand.words]
run = "the configuration `heimdall run <file>` runs, a `[cfgs.<name>]` (C2). Under `sweep_runs` it may be left out"
events = "every configuration's event count, unless it gives its own"
chain = "every configuration's tools, unless it gives its own"
vary = "A string is an independent axis, and the points are the grid of the axes. An array is an entangled group: its quantities move together, value i with value i, so they need equal point counts. `{ points = [...] }` lists combinations by hand, one row a point. The order decides point names and running order. `[]` is one point"
serial = "the prefix `NN_` of each Run's folder, `<E>/NN_<folder>`: **location, never identity**. Left out, the runner numbers it: the newest folder made from these inputs, else a new one. Set, a changed configuration is refused there rather than overwrite what it made (`--rerun` overwrites)"

[cfgs]
reads = "configuration"
gone = [
    "seed_type",
    "manual_seed",
    "prelim",
]

[cfgs.renamed]
label = "folder"
event_count = "events"
tools = "chain"
sweeps = "vary"
static = "fixed"

[cfgs.own.seed]
type = "str|int"
default = "identity"
doc = "`\"identity\"`: from the generator's identity; `\"random\"`: drawn when the point runs; an integer: exactly that seed for every point (a replica, `to = { \"pythia/seed\" = true }`, gives a point its own)"

[cfgs.words]
serial = "this configuration's `NN_`, over `[errand]`'s; left out in both, the runner numbers it"
folder = "the Run's folder name, after the serial: `NN_<folder>`; empty means the table key"
events = "required here if `[errand]` has none. A list is one configuration per count, `<name>_<count>` (`pdf_10k`), run in turn as `<name>`"
chain = "Each entry is a tool table's name, or an array of names that run together as one group (one level only). Groups run in order: one starts when the previous succeeded and its products passed their checks. What a tool writes for a reader in its own group is a FIFO; for a later group, a file. `\"@<quantity>\"` is replaced, per point, by that quantity's value: a tool table's name or a piece of chain. `[errand]`'s when left out"
vary = "A string is an independent axis, and the points are the grid of the axes. An array is an entangled group: its quantities move together, value i with value i, so they need equal point counts. `{ points = [...] }` lists combinations by hand, one row a point. The order decides point names and running order. `[]` is one point"
fixed = "`{ quantity = \"tag\" }`: this configuration's fixed points, over each quantity's own `fixed`"

[tools]
reads = "tool"
gone = []

[tools.renamed]
tool = "uses"
baseconfig = "card"
output_file = "output"

[tools.own.keep]
type = "bool"
default = true
doc = "`false`: what it writes for a later group is a scratch file of the point (`records/…/logs/<point>/`), not a product (`results/`)"

[tools.words]
uses = "the tool folder, when it is not the table's name: a second table of one tool, `[tools.<name>] uses = \"<folder>\"` (`heimdall tools` lists the folders)"
card = "native base card(s), read in order (root `configs/<A>/`). Tools with a card only."
input = "what it reads: a producer's table name (`input = \"pythia\"`: what that tool writes), another tool's output by name, a pre product, (post) a product of every point, or a path. The first input is `{input}`"
output = "what it writes. Read in its own group, a FIFO; in a later group, a file: a product in `results/`, or with `keep = false` a scratch file in the point's working folder. An array is fan-out; one writer per output (C6)"
shards = "K > 1: K processes of this tool, each on a share of the events, merged into its `output` by the folder's merge tool (rivet). The chain is unchanged."

[quantities]
reads = "quantity"
gone = [
    "values",
    "tags",
    "labels",
    "styles",
    "target",
]

[quantities.renamed]
key = "to"

[quantities.own.points]
type = "list"
doc = "the points, one row each: `{ tag, value, label, style }`; `value` is required, `tag` names the point's folder"

[quantities.own.fixed]
type = "str|int|float"
doc = "the point a configuration that does not vary the quantity takes: a tag, a value or `\"#N\"`"

[quantities.own.fields]
type = "table"
doc = "a compound quantity: `{ <field> = <its binding> }`, each field a quantity of its own, its rows' values set together"

[quantities.words]
to = "where the value goes: `{ pythia = \"PDF:pSet\" }` a native key per tool table or tool; `{ \"rivet/photo_eic\" = \"R\" }` an analysis option; `{ \"pythia/seed\" = true }` a replica. An entry with a `/` or `true` makes the entries the only consumers"
exclude = "points a vary leaves out, by their **1-based** place (as `fixed = \"#2\"` and `--points 2` count): `exclude = [2]` varies the others. The remaining points keep their names and identities and are numbered 1… over what is varied. In an entangled group, a point any member excludes leaves the group. `fixed` may still pick an excluded point. Refused: a place outside the points, or none left"
