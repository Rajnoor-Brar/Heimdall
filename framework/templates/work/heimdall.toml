# heimdall.toml — this folder is a Heimdall work dir (made by `heimdall setup`, {{date}}).
# [work] marks it; [framework] expects is the Heimdall it was made by: a Heimdall without that
# revision warns (docs/framework/01_Target.md §4.2). [run] and [cluster] are optional; any other table is refused.
[work]
name = "{{name}}"

[framework]
expects = "{{revision}}"

# On a Slurm cluster, this work dir's defaults for `heimdall cluster` (docs/04_Config_Reference.md §16), over
# the machine root's machine.toml [cluster]; an errand file's [cluster] is over them. Uncomment what the
# site needs:
# [cluster]
# account   = "my-group"
# partition = "standard"
# setup     = ["module load gcc/13"]

# What every run here keeps beyond records/ and results/ (with machine.toml's [run] keep and heimdall run
# --keep): logs (every tool's whole output), journal (status.jsonl), work (a finished point's whole working
# folder: by default only its cards/ and config/ stay), cache (card checks). By default none: each tool's
# digest (its first and last lines and what its rules matched) and the prepare caches only.
# `log` sets the digest's first and last lines, how many earlier attempts keep their digests and cards
# (history/<n>/) and their whole logs, and a detached run's progress line every so many seconds.
# [run]
# keep = ["logs"]
# log  = { head = 100, tail = 200, digests = 9, full = 3, worker_every = 600 }
