# {{a}}.toml — the starter: Pythia's dijets through Rivet's MC_JETS, for two proton PDFs.
#
#   heimdall check {{A}}/{{a}}             is it valid? (plans every configuration, runs nothing)
#   heimdall run {{A}}/{{a}} --plan        what would run, and where it would go
#   heimdall run {{A}}/{{a}}               two points of 500 events, and a page per histogram
#
# Pythia writes events and Rivet reads them in the same group (a FIFO, inferred), writing jets.yoda;
# yd2rt converts that to ROOT. Physics lives in the card ({{a}}.cmnd); this file says what varies and
# what runs. The errand file's keys: docs/04_Config_Reference.md, or `heimdall explain <key>`.

[errand]
assignment = "{{A}}"
name       = "{{a}}"
run        = "pdf"                     # the configuration `heimdall run` picks
events     = 500
threads    = 2
chain      = [["pythia", "rivet"], "yd2rt"]

[tools.pythia]                         # the table's name is the tool
card   = "{{a}}.cmnd"
output = "events.hepmc"

[tools.rivet]
input    = "pythia"                    # its producer
analyses = ["MC_JETS"]
output   = "jets.yoda"

[tools.yd2rt]
input  = "rivet"
output = "jets.root"

[quantities.sqrts]
fixed  = "13tev"
points = [{ tag = "13tev", value = 13000.0, label = "13 TeV" }]

[quantities.pdf]                       # Pythia's own sets: nothing to install (LHAPDF6:<set> also works)
fixed  = "nnpdf23"
points = [
  { tag = "nnpdf23", value = 13, label = "NNPDF 2.3 QCD+QED LO" },
  { tag = "cteq6l1", value = 8,  label = "CTEQ6L1" },
]

[cfgs.single]
description = "One run at the fixed point"

[cfgs.pdf]
description = "Two proton PDFs: a curve each on every page"
vary        = ["pdf"]

[plot]
formats = ["png"]
objects = ["/MC_JETS/[!_]*"]           # not the _ ones: Rivet's intermediates, as rivet-mkhtml skips them
