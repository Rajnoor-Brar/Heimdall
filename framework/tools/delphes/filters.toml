# utils/Env/delphes/filters.toml — DelphesHepMC3 only prints (docs/06_Internals.md §23). Its progress bar
# gives a percentage, not an event count, so only the phase is followed. A rule never fails a run.
[[rule]]
match = '^\*\* Reading '
emit  = "phase"
phase = "simulating"

[[rule]]
match = '^\*\* INFO: initializing module'
emit  = "phase"
phase = "init"

[[rule]]
match = '(?:\*\* ERROR|ERROR:|Error in)'
emit  = "error"
