# framework/tools/exec/tool.toml — any executable (doc:tools-exec). Its table gives
# executable and arguments; its [tools.<tag>.config] and consumed quantities are written to
# config/<tag>.toml and passed as the first argument. Like every tool it finds the point's context file
# (every tool's card and config) through $HEIMDALL_CONTEXT, or {context} in its arguments.
# `heimdall tools new <name> --from exec` copies this folder into the work dir's tools/, to make it your own.
[tool]
config_file     = true             # its table's config and consumed quantities, written to config/<tag>.toml
category = "custom"
status   = "none"
template = true                     # heimdall tools new <name> --from exec copies it: a tool of your own
formerly = ["custom"]               # its name before: heimdall migrate rewrites tool = "custom"

[card]
style = "none"

[command]
argv = ["{exe}", "{config}", "{arguments}"]
