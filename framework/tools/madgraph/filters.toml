# framework/tools/madgraph/filters.toml — MadGraph only prints (doc:events). A rule never fails a run.
[[rule]]
match = '^INFO: (?:Running Survey|Refine results|Combining Events|Idle:)'
emit  = "phase"

[[rule]]
match = '(?:Error|ERROR|Command .* failed)'
emit  = "error"

[[rule]]
match = '^WARNING'
emit  = "warn"
