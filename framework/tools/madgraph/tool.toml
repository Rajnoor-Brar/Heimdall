# utils/Env/madgraph/tool.toml — MadGraph5_aMC@NLO, a process generator (docs/05_Commands_and_Tools.md §15, L14).
#
# The process directory is a [prepare] step keyed on the proc card only (key = "base"). Each point
# launches a run named r<seed> in it and unpacks the LHE to its output (a file from an earlier
# group: a `pythia` tool showers it with Beams:frameType = 4). MadGraph writes exactly nevents or
# fails, so the runner writes the sidecar.
[tool]
category        = "process-generator"
executable      = "mg5_aMC"
status          = "filters"
produces_events = true

[card]
style   = "render"
ext     = "mg5"
comment = "#"

[render.lpp]                        # PDG id → MadGraph's lpp (the beam type): 1 proton, -1 antiproton, 0 lepton
2212  = 1
-2212 = -1
11    = 0
-11   = 0
13    = 0
-13   = 0

[command]
# $0 = mg5_aMC, $1 = the launch script, $2 = the run's LHE, $3 = the output: launch, then unpack
argv = ["/bin/sh", "-c", "\"$0\" \"$1\" && gunzip -c \"$2\" > \"$3\"",
        "{exe}", "{card}", "{prepared}/process/Events/r{seed}/unweighted_events.lhe.gz", "{output}"]

[prepare]
argv   = ["{exe}", "{prepare_card}"]
key    = "base"
marker = "process/bin/generate_events"

[outputs]
sidecar = "{output}.json"
written = "requested"

[exports.proc]
alias = "card"                      # madgraph_proc: the launch script and proc card, as rendered

[exports.process]                   # madgraph_process = true: the process directory, built on demand
path          = "{prepared}/process"
needs_prepare = true

[identity]
version = "stack:madgraph"               # utils/Env/stack.toml's (V78): its VERSION file
