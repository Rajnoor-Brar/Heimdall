# framework/tools/merge/tool.toml — rivet-merge, in `post`: one YODA product of every point, merged
# (docs/05_Commands_and_Tools.md §7). `input` names the points' product; {inputs} is that product of every point.
[tool]
category   = "analysis-application"
executable = "rivet-merge"
status     = "none"

[card]
style = "none"

[command]
argv = ["{exe}", "{equivalent}", "-o", "{partial:output}", "{inputs}"]
env  = { RIVET_ANALYSIS_PATH = "{work}/build/Rivet" }   # it re-runs the analyses' finalize()

[options]
# Seed replicas are statistically independent runs of one process (-e): their statistics add and the
# cross section is averaged. false merges different processes into their sum.
equivalent = { kind = "flag", flag = "-e", default = true, doc = "the inputs are replicas of one process (-e): averaged σ" }

[outputs]
products = ["yoda"]
combines = ["yoda"]                  # combine (V35) merges the points' YODA products with this folder (V60)

[identity]
version = "stack:rivet"                # env/stack.toml's (V78)
