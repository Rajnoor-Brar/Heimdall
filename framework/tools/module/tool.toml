# utils/Env/module/tool.toml — a module program built with utils/Module.hh (docs/06_Internals.md §21).
# The table names it: executable = "Decay.exe" → build/<project>/Decay.exe. It always gets its
# extracted config as the first argument; an empty --input means an integrated program.
[tool]
config_file     = true
config_always   = true             # a Module.hh program takes its config even when it is empty             # its table's config, consumed quantities and standard configurations are
                                   # written to config/<tag>.toml, its first argument; it may ask for exports (V60)
category        = "analysis-application"
streamable      = true
status          = "standard"
consumes_events = true

[card]
style = "none"

[command]
argv = ["{exe}", "{config}", "--input={input}", "--output={partial:output}", "--events={events}",
        "--sidecar={input_sidecar}", "{arguments}"]

[outputs]
event_count = "json:events"         # the kit's report, <output>.json, against the producer's sidecar
