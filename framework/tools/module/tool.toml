# framework/tools/module/tool.toml — a module program built with src/Module.hh (docs/06_Internals.md §21).
# The table names it: executable = "Decay.exe" → build/<project>/Decay.exe. It always gets its
# extracted config as the first argument; an empty --input means an integrated program.
[tool]
config_file     = true             # its table's config and consumed quantities, written to config/<tag>.toml (its
                                   # first argument); the context file comes through $HEP_CONTEXT (Module::Job::tool)
config_always   = true             # a Module.hh program takes its config even when it is empty
template        = true             # hep tools new <name> --from module copies it
category        = "analysis-application"
streamable      = true
status          = "standard"
consumes_events = true

[card]
style = "none"

[command]
argv = ["{exe}", "{config}", "--input={input}", "--output={partial:output}", "--events={events}",
        "--sidecar={input_sidecar}", "{arguments}"]

[outputs]
event_count = "json:events"         # the kit's report, <output>.json, against the producer's sidecar
