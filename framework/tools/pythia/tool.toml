# framework/tools/pythia/tool.toml — the standard Pythia tool: App_Pythia.exe in Himinbjorg's apps/ ({apps}) (doc:tools-pythia).
[tool]
category        = "event-generator"
executable      = "{apps}/App_Pythia.exe"
packages        = ["pythia8", "hepmc3"] # the recipes it runs (bifrost -b|-c, heimdall tools)
status          = "standard"
produces_events = true

[card]
style   = "append"                  # the base cards and the point's settings, merged into one final config
ext     = "cmnd"
comment = "!"
drop    = '^\s*[^A-Za-z0-9\s]'   # Pythia reads a line only when it starts with a letter or digit
trailing = '\s+!.*$'
# The final config (doc:tool-contract): settings commute, so each is written once, sorted, and a key twice
# in one card is refused. A tune resets its parameters when read, so tunes lead. A particle's commands
# act in order (onMode = off, then onIfMatch), so each particle's stay together as written. These
# particle-data commands add up instead of replacing (three 23:onIfMatch lines all apply): every one is
# kept.
order      = "free"
leading    = ["Tune:ee", "Tune:pp"]
group      = '^(\d+):'
repeatable = ["onIfAny", "onIfAll", "onIfMatch", "offIfAny", "offIfAll", "offIfMatch", "addChannel",
              "oneChannel", "all", "new", "rescaleBR"]
# What the runner sets: a base card's value of these is never used (--plan says so, V59)
owned      = ["Main:numberOfEvents", "Parallelism:numThreads", "Random:setSeed", "Random:seed",
              "Parallelism:seeds", "Beams:LHEF"]
bools   = ["on", "off"]
# Seeds from the point's identity (doc:identity). Random:seed is always written, so a serial Pythia in an
# integrated program is seeded too; PythiaParallel reads Parallelism:seeds (L4).
seed          = ["Random:setSeed = on", "Random:seed = {seed}"]
seed_parallel = ["Parallelism:seeds = {{{seeds}}}"]
seed_range    = [1, 900_000_000]  # Pythia's Random:seed and Parallelism:seeds (L4)
# A shower of an LHE file from an earlier group (MadGraph): the base card sets Beams:frameType = 4.
# Without an input the line is left out, so a generation card is unchanged.
footer        = ["Beams:LHEF = {input}"]

[command]
# App_Pythia reads the final config (cards/pythia.cmnd), never a base card: no base path is in the identity
argv = ["{exe}", "{outputs}", "{card}"]

[outputs]
sidecar = "{output}.json"           # App_Pythia writes it next to its first output
deal    = true                      # it can deal events among a sharded tool's inputs (A+B+C, V31)

[checks]
card = ["{apps}/App_PythiaCheck.exe", "{card}"]   # Pythia reads the card and names what it rejects (V59)

# After Kit's Init fails (exit 3) App_Pythia says no more: PythiaParallel keeps its instances' messages to itself.
# The runner then reads the same cards into one plain Pythia (diagnose.py, through Pythia's Python module), its
# messages on, initialises it with no events, and quotes what Pythia says (V203): "PYTHIA Error in
# ProcessLevel::init: all processes have vanishing cross sections". Nothing is rebuilt: no identity moves.
[diagnose]
exits   = [3]
program = ["python3", "{heimdall}/framework/tools/pythia/diagnose.py"]
card    = ["Print:quiet = off", "Print:errors = on", "Init:showProcesses = on", "Main:numberOfEvents = 0"]
ext     = "cmnd"
quote   = 'PYTHIA (?:Error|Abort) (?:from|in) '
timeout = 300

[identity]
files   = ["{exe}"]
version = "stack:pythia8"                # env/stack.toml's (V78)
