# utils/Env/pythia/tool.toml — the standard Pythia tool: build/App_Pythia.exe (docs/05_Commands_and_Tools.md §16).
[tool]
category        = "event-generator"
executable      = "{repo}/build/App_Pythia.exe"
status          = "standard"
produces_events = true

[card]
style   = "append"                  # the point card is read after the base cards: last wins
ext     = "cmnd"
comment = "!"
drop    = '^\s*[^A-Za-z0-9\s]'   # Pythia reads a line only when it starts with a letter or digit
trailing = '\s+!.*$'
# The combined card holds each key once (V59): a base setting the point card sets is left out of it.
# These particle-data commands add up instead of replacing (three 23:onIfMatch lines all apply), so
# every one is kept, in order.
merge      = true
repeatable = ["onIfAny", "onIfAll", "onIfMatch", "offIfAny", "offIfAll", "offIfMatch", "addChannel",
              "oneChannel", "all", "new", "rescaleBR"]
# What the runner sets: a base card's value of these is never used (--plan says so, V59)
owned      = ["Main:numberOfEvents", "Parallelism:numThreads", "Random:setSeed", "Random:seed",
              "Parallelism:seeds", "Beams:LHEF"]
bools   = ["on", "off"]
# Seeds from the point's identity (06 §8). Random:seed is always written, so a serial Pythia in an
# integrated program is seeded too; PythiaParallel reads Parallelism:seeds (L4).
seed          = ["Random:setSeed = on", "Random:seed = {seed}"]
seed_parallel = ["Parallelism:seeds = {{{seeds}}}"]
seed_range    = [1, 900_000_000]  # Pythia's Random:seed and Parallelism:seeds (L4)
# A shower of an LHE file from an earlier group (MadGraph): the base card sets Beams:frameType = 4.
# Without an input the line is left out, so a generation card is unchanged.
footer        = ["Beams:LHEF = {input}"]

[command]
argv = ["{exe}", "{outputs}", "{cards}"]

[outputs]
sidecar = "{output}.json"           # App_Pythia writes it next to its first output
deal    = true                      # it can deal events among a sharded tool's inputs (A+B+C, V31)

[exports.cmnd]
alias = "card"                      # pythia_cmnd = pythia_card

[checks]
card = ["{repo}/build/App_PythiaCheck.exe", "{card}"]   # Pythia reads the card and names what it rejects (V59)

[identity]
files   = ["{exe}"]
version = "stack:pythia8"                # utils/Env/stack.toml's (V78)
