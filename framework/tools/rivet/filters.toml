# utils/Env/rivet/filters.toml — Rivet only prints (docs/06_Internals.md §23). A rule never fails a run.
[[rule]]
match = '^Event (?P<done>\d+) \('
emit  = "progress"

[[rule]]
match = '^Reading events from'
emit  = "phase"
phase = "analysing"

[[rule]]
match = '(?:ERROR|Error in|Exception)'
emit  = "error"

[[rule]]
match = 'WARN .*unvalidated'
emit  = "ignore"

[[rule]]
match = '\bWARN\b'
emit  = "warn"
