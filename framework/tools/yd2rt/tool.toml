# framework/tools/yd2rt/tool.toml — YODA → ROOT: framework/Apps/App_yd2rt.exe (docs/05_Commands_and_Tools.md §17).
# The ROOT file is a product (results/), non-temporary, as the brief asks (§Plotting).
[tool]
category = "visualisation"
executable = "{hep}/framework/Apps/App_yd2rt.exe"
status     = "standard"

[card]
style = "none"

[command]
argv = ["{exe}", "{input}", "{partial:output}", "{select}"]

[options]
select = { kind = "list" }          # YODA path globs to convert (default: everything except /RAW, /TMP)

[outputs]
products = ["root"]

[identity]
files = ["{exe}"]
