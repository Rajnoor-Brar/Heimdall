# framework/tools/yd2rt/tool.toml — YODA → ROOT: App_yd2rt.exe in Himinbjorg's apps/ ({apps}) (doc:tools-yd2rt).
# The ROOT file is a product (results/), non-temporary, as the brief asks (§Plotting).
[tool]
category = "visualisation"
executable = "{apps}/App_yd2rt.exe"
packages        = ["root", "yoda"]  # the recipes it runs (bifrost -b|-c, heimdall tools)
status     = "standard"

[card]
style = "none"

[command]
argv = ["{exe}", "{input}", "{partial:output}", "{select}"]

[options]
select = { kind = "list", doc = "YODA path globs to convert (default: everything but /RAW, /TMP)" }

[outputs]
products = ["root"]

[identity]
files = ["{exe}"]
