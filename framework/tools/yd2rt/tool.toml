# framework/tools/yd2rt/tool.toml — YODA → ROOT: App_yd2rt.exe in the machine root's apps/ ({apps}) (docs/05_Commands_and_Tools.md §17).
# The ROOT file is a product (results/), non-temporary, as the brief asks (§Plotting).
[tool]
category = "visualisation"
executable = "{apps}/App_yd2rt.exe"
status     = "standard"

[card]
style = "none"

[command]
argv = ["{exe}", "{input}", "{partial:output}", "{select}"]

[options]
select = { kind = "list", doc = "YODA path globs to convert (default: everything but /RAW, /TMP)" }

[outputs]
products = ["root"]

[identity]
files = ["{exe}"]
