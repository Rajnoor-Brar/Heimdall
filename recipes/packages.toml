# recipes/packages.toml — the stack's packages, in build order: where each one's source is and how
# it is built (the lab PC's versions and fixes; README.md §3 says why each flag is there).
#
#   release   its version: the stamp's, {release} below, and {series} (it without its last ".x")
#   url       its tarball, or a list of mirrors tried in order (a web page or a cut-off file is refused)
#   sha256    the tarball's checksum, checked when given (`build_stack.py --sha256` prints the archives')
#   kind      autotools  ./configure --prefix={install} ARGS, make, make install, in {src}
#             cmake      {src} built in {build} and installed into {install} (Release, C++{cxx_std})
#             unpack     the tarball unpacked into {install}; nothing built
#             none       only its pre and post commands
#   needs     the packages it builds against: added to a run when they are not installed
#   group     "core" (the default) or "extra": packages = "core" builds the first, "all" both
#   install   its directory under stack/ (default: its name): the names env/hep_env.sh expects
#   probe     the file that shows it installed (default: {install})
#   args      configure or cmake arguments
#   extra     more of them, after args: for an overlay or the command line (root.extra="-Droofit=OFF"),
#             without repeating args (CMake and configure take the last of a repeated option)
#   optional  { package = [args] }: added when that package is installed or in the run
#   patch     a patch (-p0) for the unpacked source; a path from Heimdall's root
#   strip     the folder levels a tarball's paths carry before the source (default 1)
#   env       environment for its commands
#   pre, post commands run before configuring and after installing (in {src}; shell words, no shell)
#   cores     how many compilers it runs at once, its make -j (default {cores})
#
# Placeholders: any setting ({cores}, {graphics}, …), and {prefix} (the machine root) {inst} {venv} {src} {build}
# {install} {release} {series} {py} {pyxy} {pyinc} {cxxflags} {arch} {machine} {dylib} {repo}, and any
# environment variable ({HOMEBREW_PREFIX}). A word that is only a list setting ({pdf_sets}) becomes its
# words.

[python]
kind  = "none"
probe = "{venv}/bin/python"
pre   = ["{python} -m venv --prompt {venv_prompt} {venv}",
         "{venv}/bin/python -m pip install --timeout 60 --retries 10 --upgrade pip",
         "{venv}/bin/python -m pip install --timeout 60 --retries 10 {python_packages}",
         "{venv}/bin/python {repo}/recipes/pth.py {repo}"]       # heimdall.pth: $HEP/framework on the venv's path

[lhapdf]
release = "6.5.6"
url     = "https://lhapdf.hepforge.org/downloads/?f=LHAPDF-{release}.tar.gz"
kind    = "autotools"
needs   = ["python"]
install = "LHAPDF"

[hepmc3]
release = "3.3.1"
url     = "https://hepmc.web.cern.ch/hepmc/releases/HepMC3-{release}.tar.gz"
kind    = "cmake"
needs   = ["python"]
# The Python directory is HEPMC3_Python_SITEARCH<XY> (HEPMC3_PYTHON_INSTALL_DIR is ignored); LTO strips
# the pybind11 symbols.
args = [
  "-DHEPMC3_ENABLE_PYTHON=ON", "-DHEPMC3_PYTHON_VERSIONS={py}",
  "-DHEPMC3_Python_SITEARCH{pyxy}={venv}/lib/python{py}/site-packages",
  "-DHEPMC3_ENABLE_ROOTIO=OFF", "-DHEPMC3_ENABLE_SEARCH=ON", "-DHEPMC3_BUILD_EXAMPLES=OFF",
  "-DCMAKE_CXX_FLAGS={cxxflags} -fno-lto", "-DCMAKE_SHARED_LINKER_FLAGS=-fno-lto",
]

[fastjet]
release = "3.5.0"
url     = "https://fastjet.fr/repo/fastjet-{release}.tar.gz"
kind    = "autotools"
# SISCone's random-number state is one per process: threads clustering at once get other jets (L29).
# The patch makes it per thread. fastjet.patch="" builds without it.
patch   = "recipes/patches/fastjet-3.5.0-siscone-thread-local-ranlux.patch"
args    = ["--enable-shared", "--enable-allcxxplugins"]

[fjcontrib]
release = "1.104"
url     = "https://fastjet.hepforge.org/contrib/downloads/fjcontrib-{release}.tar.gz"
kind    = "autotools"
needs   = ["fastjet"]
install = "fastjet"                                   # into FastJet's prefix, as the lab PC has it
probe   = "{install}/lib/libfastjetcontribfragile.{dylib}"
args    = ["--fastjet-config={inst}/fastjet/bin/fastjet-config", "CXXFLAGS={cxxflags} -fPIC"]
post    = ["make fragile-shared-install"]             # libfastjetcontribfragile.so (.dylib), which Rivet links

[root]
release = "6.40.04"                                   # not 6.40.00: its rootcling_stage1 does not link
url     = "https://root.cern/download/root_v{release}.source.tar.gz"
kind    = "cmake"
needs   = ["python"]
cores   = "{root_cores}"
args = [
  "-DPython3_EXECUTABLE={venv}/bin/python", "-Dpyroot=ON",
  "-Dmathmore=ON", "-Droofit=ON", "-Dtmva=ON", "-Dfftw3=ON", "-Dsqlite=ON", "-Dxml=ON", "-Dgdml=ON",
  "-Dhttp=ON", "-Dimt=ON", "-Dssl=ON", "-Dvdt=ON",
  "-Dx11={graphics}", "-Dopengl={graphics}", "-Dwebgui={graphics}", "-Dasimage={graphics}",
  "-Dbuiltin_freetype=ON", "-Dbuiltin_pcre=ON", "-Dxrootd=ON", "-Dbuiltin_xrootd=ON", "-Ddavix=OFF",
]

[hdf5]
release = "2.2.0"                                     # 2.x builds with CMake only
url     = "https://github.com/HDFGroup/hdf5/releases/download/{release}/hdf5-{release}.tar.gz"
kind    = "cmake"
group   = "extra"
strip   = 2                                           # its paths start with ./hdf5-<release>/
args = [
  "-DBUILD_SHARED_LIBS=ON", "-DBUILD_STATIC_LIBS=OFF", "-DHDF5_BUILD_CPP_LIB=ON", "-DHDF5_BUILD_HL_LIB=ON",
  "-DHDF5_BUILD_FORTRAN=OFF", "-DHDF5_BUILD_JAVA=OFF", "-DHDF5_BUILD_EXAMPLES=OFF", "-DBUILD_TESTING=OFF",
  "-DHDF5_ENABLE_ZLIB_SUPPORT=ON", "-DHDF5_ENABLE_SZIP_SUPPORT=OFF", "-DCMAKE_INSTALL_NAME_DIR={install}/lib",
]
# h5cc-plain: the one-line h5cc YODA's configure can read (HDF5 2.x's broke its link line on the Mac)
post = ["{python} {repo}/recipes/helpers/h5cc_plain.py {install} {release}"]

[yoda]
release = "2.1.4"
url     = ["https://cedar-tools.web.cern.ch/downloads/YODA-{release}.tar.gz",     # CEDAR: the releases' home now
           "https://yoda.hepforge.org/downloads?f=YODA-{release}.tar.gz"]
kind    = "autotools"
needs   = ["python"]
# HDF5 support (.yoda.h5) only with the stack's HDF5: never one the system happens to have (the Mac's
# Homebrew HDF5 broke the link, docs/audit_3/01_Process.md §5). The later --enable-h5 wins.
args     = ["--disable-h5"]
optional = { hdf5 = ["--enable-h5", "--with-hdf5={inst}/hdf5/bin/h5cc-plain", "--enable-h5-rpath"] }

[rivet]
release = "4.1.4"
url     = "https://cedar-tools.web.cern.ch/downloads/Rivet-{release}.tar.gz"      # HepForge stops at 4.1.3
kind    = "autotools"
needs   = ["python", "hepmc3", "yoda", "fastjet", "fjcontrib"]
args    = ["--with-hepmc3={inst}/hepmc3", "--with-yoda={inst}/yoda", "--with-fastjet={inst}/fastjet"]

[pythia8]
release = "8318"
url     = "https://pythia.org/releases/pythia83/pythia{release}.tgz"     # /download/ is gone (404) since 2026
kind    = "autotools"
needs   = ["python", "lhapdf", "hepmc3", "fastjet"]
args = [
  "--with-lhapdf6={inst}/LHAPDF", "--with-hepmc3={inst}/hepmc3", "--with-fastjet3={inst}/fastjet",
  "--with-python-bin={venv}/bin/", "--with-python-lib={venv}/lib/python{py}",
  "--with-python-include={pyinc}", "--cxx-common={cxxflags} -fPIC",
]
# Its ROOT and Rivet plugins (Pythia8Plugins/RivetHooks.h) exist only when built after them.
optional = { root = ["--with-root={inst}/root"], rivet = ["--with-rivet={inst}/rivet"] }

[thepeg]
release = "2.3.0"
url     = "https://thepeg.hepforge.org/downloads/?f=ThePEG-{release}.tar.bz2"
kind    = "autotools"
needs   = ["lhapdf", "hepmc3", "fastjet"]
install = "herwig7"
probe   = "{install}/bin/setupThePEG"
# --with-hepmcversion=3: else ThePEG looks for HepMC2 under the HepMC3 prefix.
args    = ["--with-hepmc={inst}/hepmc3", "--with-hepmcversion=3", "--with-fastjet={inst}/fastjet",
           "--with-lhapdf={inst}/LHAPDF"]

[herwig]
release = "7.3.0"
url     = "https://herwig.hepforge.org/downloads/?f=Herwig-{release}.tar.bz2"
kind    = "autotools"
needs   = ["thepeg", "lhapdf", "fastjet"]
install = "herwig7"
probe   = "{install}/bin/Herwig"
pre     = ["lhapdf install CT14lo CT14nlo"]           # its defaults read them: make install needs them (L15)
# Looptools needs 8-byte default integers; Herwig's m4/herwig.m4 adds -fdefault-integer-8 only for x86_64
# and old Intel Macs, so an arm64 machine (an M-series Mac, an ARM Linux) fails at D0funcC.F. Given here
# for every platform (x86_64 Linux gets the same flags from its configure anyway).
args    = ["--with-thepeg={inst}/herwig7", "--with-fastjet={inst}/fastjet", "--with-lhapdf={inst}/LHAPDF",
           "FFLAGS=-O2 -std=legacy -ffixed-line-length-none -fdefault-integer-8",
           "FCFLAGS=-O2 -std=legacy -ffixed-line-length-none -fdefault-integer-8"]

[delphes]
release = "3.5.1"
url     = "https://github.com/delphes/delphes/archive/refs/tags/{release}.tar.gz"
kind    = "cmake"
needs   = ["root"]
env     = { PYTHIA8 = "{inst}/pythia8" }              # DelphesPythia8 too, when Pythia8 is there
args    = ["-DROOT_DIR={inst}/root/cmake"]

[pdfsets]
kind  = "none"
needs = ["lhapdf"]
post  = ["lhapdf install {pdf_sets}"]                 # a set already there is skipped

[sherpa]
release = "3.0.5"
url     = "https://gitlab.com/sherpa-team/sherpa/-/archive/v{release}/sherpa-v{release}.tar.gz"
kind    = "cmake"
group   = "extra"
needs   = ["hepmc3", "lhapdf", "rivet", "fastjet"]
# The _DIR spellings are Sherpa's own; HepMC3_DIR is the CMake config directory.
args = [
  "-DSHERPA_ENABLE_HEPMC3=ON", "-DHepMC3_DIR={inst}/hepmc3/share/HepMC3/cmake",
  "-DSHERPA_ENABLE_RIVET=ON", "-DRIVET_DIR={inst}/rivet",
  "-DSHERPA_ENABLE_FASTJET=ON", "-DFASTJET_DIR={inst}/fastjet",
  "-DSHERPA_ENABLE_LHAPDF=ON", "-DLHAPDF_DIR={inst}/LHAPDF",
  "-DSHERPA_ENABLE_INTERNAL_PDFS=ON", "-DSHERPA_ENABLE_EXAMPLES=ON",
]

[madgraph]
release = "3.8.1"                                     # Launchpad renames releases: set madgraph.url when it 404s
url     = "https://launchpad.net/mg5amcnlo/3.0/{series}.x/+download/MG5_aMC_v{release}.tar.gz"
kind    = "unpack"                                    # a Python/Fortran tree, pointed at the stack
group   = "extra"
needs   = ["lhapdf", "pythia8"]
post = ["""sed -i.orig
  -e 's|^#* *lhapdf *=.*|lhapdf = {inst}/LHAPDF/bin/lhapdf-config|'
  -e 's|^#* *pythia8_path *=.*|pythia8_path = {inst}/pythia8|'
  -e 's|^#* *automatic_html_opening *=.*|automatic_html_opening = False|'
  {install}/input/mg5_configuration.txt"""]

[whizard]
release = "3.1.8"
url     = "https://whizard.hepforge.org/downloads/?f=whizard-{release}.tar.gz"
kind    = "autotools"
group   = "extra"
needs   = ["hepmc3", "fastjet", "lhapdf", "pythia8", "pdfsets"]
# pdfsets first: Whizard's configure turns LHAPDF off unless CT10 and cteq6l1 are installed (m4/lhapdf.m4),
# silently (it was built without LHAPDF on both machines before this). --enable-hepmc takes HepMC3 (there are no *hepmc3 options); O'Mega needs OCaml.
args = [
  "--enable-lhapdf", "--enable-hepmc", "--with-hepmc={inst}/hepmc3", "--enable-fastjet",
  "--with-fastjet={inst}/fastjet", "--enable-pythia8", "--with-pythia8={inst}/pythia8",
  "--disable-dependency-tracking", "FC=gfortran",
]

[onnxruntime]
release = "1.29.0"
url     = "https://github.com/microsoft/onnxruntime/releases/download/v{release}/onnxruntime-linux-{arch}-{release}.tgz"
kind    = "unpack"                                    # a released binary: no ABI to match
group   = "extra"

[geant4]
release = "11.4.2"
url     = "https://github.com/Geant4/geant4/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "extra"
args = [
  "-DGEANT4_BUILD_MULTITHREADED=ON", "-DGEANT4_INSTALL_DATA={geant4_data}", "-DGEANT4_USE_GDML=ON",
  "-DGEANT4_USE_OPENGL_X11={graphics}", "-DGEANT4_USE_SYSTEM_CLHEP=OFF", "-DGEANT4_USE_SYSTEM_EXPAT=OFF",
  "-DGEANT4_USE_SYSTEM_ZLIB=OFF", "-DGEANT4_INSTALL_DATA_TIMEOUT=1500",
]

# ── Toolkit packages (group "toolkit"): only by name or through a toolkit (toolkits.toml) ───────────
# status = "new": the recipe follows the project's own build instructions, but no build has proven it
# here yet. build_stack.py says so, and a failure is a gate (docs/framework/02_Agents.md §6). Releases
# were checked against the projects' pages on 2026-10-10. kind = "external": never built here; `how`
# says where it comes from. Why each is in, and what was left out, is README.md §6.

[photospp]
release = "3.64"                                      # HepMC3 support since 3.64 (EvtGen's minimum)
url     = "https://photospp.web.cern.ch/photospp/resources/PHOTOS.{release}/PHOTOS.{release}.tar.gz"
kind    = "autotools"
group   = "toolkit"
status  = "new"
needs   = ["hepmc3"]
args    = ["--with-hepmc3={inst}/hepmc3"]

[tauolapp]
release = "1.1.8"                                     # HepMC3 support since 1.1.8 (EvtGen's minimum)
url     = "https://tauolapp.web.cern.ch/tauolapp/resources/TAUOLA.{release}/TAUOLA.{release}.tar.gz"
kind    = "autotools"
group   = "toolkit"
status  = "new"
needs   = ["hepmc3", "lhapdf"]
args    = ["--with-hepmc3={inst}/hepmc3", "--with-lhapdf={inst}/LHAPDF"]

[evtgen]
release = "R03-00-01"
url     = "https://gitlab.cern.ch/evtgen/evtgen/-/archive/{release}/evtgen-{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["hepmc3", "pythia8", "photospp", "tauolapp"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args = [
  "-DEVTGEN_HEPMC3=ON", "-DEVTGEN_PYTHIA=ON", "-DEVTGEN_PHOTOS=ON", "-DEVTGEN_TAUOLA=ON",
  "-DHEPMC3_ROOT_DIR={inst}/hepmc3", "-DPYTHIA8_ROOT_DIR={inst}/pythia8",
  "-DPHOTOSPP_ROOT_DIR={inst}/photospp", "-DTAUOLAPP_ROOT_DIR={inst}/tauolapp",
]

[superchic]
release = "5.6.2"                                     # central exclusive production (LHAPDF for its PDFs)
url     = "https://github.com/LucianHL/SuperChic/archive/refs/tags/{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["lhapdf", "hepmc3"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }

[mcfm]
release = "10.3"                                      # fixed order (NLO, NNLO, N3LO); its own LHAPDF off
url     = "https://mcfm.fnal.gov/downloads/MCFM-{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["lhapdf"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-Duse_internal_lhapdf=OFF", "-Duse_external_lhapdf=ON"]

[jetscape]
release = "4.0.2"                                     # heavy-ion framework; HDF5 for its hydro modules
url     = "https://github.com/JETSCAPE/JETSCAPE/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["pythia8", "hepmc3", "root", "hdf5"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}", HDF5_ROOT = "{inst}/hdf5" }

[madanalysis5]
release = "1.11.1"                                    # recasting; it finds ROOT, FastJet, Delphes at first start
url     = "https://github.com/MadAnalysis/madanalysis5/archive/refs/tags/v{release}.tar.gz"
kind    = "unpack"                                    # a Python tree, run in place: stack/madanalysis5/bin/ma5
group   = "toolkit"
status  = "new"
needs   = ["root", "fastjet", "delphes"]
probe   = "{install}/bin/ma5"

[contur]
release = "3.1.3"                                     # model interpretation on Rivet's measurements (Rivet 4)
kind    = "none"
group   = "toolkit"
status  = "new"
needs   = ["rivet", "yoda"]
probe   = "{venv}/bin/contur"
pre     = ["{venv}/bin/pip install contur=={release}"]

[professor]
release = "2.5.2"                                     # tuning: parametrise, then fit (Eigen, iminuit)
url     = "https://professor.hepforge.org/downloads/?f=Professor-{release}.tar.gz"
kind    = "unpack"
group   = "toolkit"
status  = "new"
needs   = ["yoda"]
apt     = ["libeigen3-dev"]
post    = ["{venv}/bin/pip install cython iminuit", "{venv}/bin/pip install {install}"]

[hepdata]
kind    = "none"                                      # the HEPData clients: make and fetch submissions
group   = "toolkit"
status  = "new"
needs   = ["python"]
probe   = "{venv}/bin/hepdata-cli"
pre     = ["{venv}/bin/pip install hepdata-lib hepdata-cli"]

[highfive]
release = "3.3.0"                                     # header-only C++ for HDF5 (the stack's)
url     = "https://github.com/highfive-devs/highfive/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["hdf5"]
args    = ["-DHIGHFIVE_UNIT_TESTS=OFF", "-DHIGHFIVE_EXAMPLES=OFF", "-DHDF5_ROOT={inst}/hdf5"]
env     = { HDF5_DIR = "{inst}/hdf5" }                # h5py built against the stack's HDF5
post    = ["{venv}/bin/python -m pip install --no-binary=h5py h5py"]

[dd4hep]
release = "01-38"                                     # C++17 since v01-35: the stack's standard
url     = "https://github.com/AIDASoft/DD4hep/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["root", "geant4", "hepmc3"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DDD4HEP_USE_GEANT4=ON", "-DDD4HEP_USE_XERCESC=ON", "-DDD4HEP_USE_HEPMC3=ON", "-DBUILD_TESTING=OFF"]

[geomodel]
release = "6.27.0"                                    # with ATLAS FullSimLight (now part of GeoModel)
url     = "https://gitlab.cern.ch/GeoModelDev/GeoModel/-/archive/{release}/GeoModel-{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["geant4"]
apt     = ["libeigen3-dev", "nlohmann-json3-dev"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DGEOMODEL_BUILD_FULLSIMLIGHT=ON", "-DGEOMODEL_BUILD_TOOLS=ON"]

[garfieldpp]
release = "2025.12"                                   # gaseous and semiconductor detectors (ROOT, GSL)
url     = "https://gitlab.cern.ch/garfield/garfieldpp/-/archive/{release}/garfieldpp-{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["root"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DWITH_EXAMPLES=OFF"]

[feynrules]
release = "2.3.49"                                    # a Mathematica package: unusable without Mathematica
url     = "https://feynrules.irmp.ucl.ac.be/downloads/feynrules-current.tar.gz"   # the site serves only "current"
kind    = "unpack"
group   = "toolkit"
status  = "new"
needs   = ["mathematica"]

[sarah]
release = "4.15.4"                                    # a Mathematica package: unusable without Mathematica
url     = "https://sarah.hepforge.org/downloads/?f=SARAH-{release}.tar.gz"
kind    = "unpack"
group   = "toolkit"
status  = "new"
needs   = ["mathematica"]

[ufo-models]
kind    = "none"                                      # settings.toml's ufo_models (URLs), into MadGraph's models/
group   = "toolkit"
status  = "new"
needs   = ["madgraph"]
probe   = ""
pre     = ["""bash -c 'for u in {ufo_models}; do f={stash}/$(basename "$u"); [ -s "$f" ] || curl -fL -o "$f" "$u";
  case "$f" in *.zip) unzip -oq "$f" -d {inst}/madgraph/models ;; *) tar xf "$f" -C {inst}/madgraph/models ;; esac; done'"""]

[mathematica]
kind    = "external"
group   = "toolkit"
probe   = ""
how     = "a Mathematica (Wolfram) licence and installation, on PATH as `math` or `wolframscript`; FeynRules, SARAH and NLOCT run inside it"

[key4hep]
kind    = "external"
group   = "toolkit"
probe   = "/cvmfs/sw.hsf.org/key4hep"
how     = "CVMFS (https://cvmfs.readthedocs.io; sudo) with sw.hsf.org, then `source /cvmfs/sw.hsf.org/key4hep/setup.sh` in a shell of its own (an AlmaLinux 9 container on other systems). It brings EDM4hep, podio, DD4hep, Gaudi and k4FWCore, built with C++20: never in the same shell as setup.sh"

[cmssw]
kind    = "external"
group   = "toolkit"
probe   = "/cvmfs/cms.cern.ch"
how     = "CVMFS with cms.cern.ch, then `/cvmfs/cms.cern.ch/common/cmssw-el9` (an el9 container) and `cmsrel CMSSW_<release>` inside it: never in the same shell as setup.sh"

[fluka]
kind    = "external"
group   = "toolkit"
probe   = "{inst}/fluka"
how     = "FLUKA from https://fluka.cern after registering and accepting its licence (it cannot be fetched for you); install it into {inst}/fluka by its manual, with the system's gfortran"

# ── C++20 packages: for isolated toolkits only (@key4hep-src, @gpu-sim): they need cxx_std = 20, so
# they never share an install with the C++17 stack (README.md §6). Releases checked 2026-10-10.

[podio]
release = "01-07"                                     # the EDM toolkit EDM4hep is generated with
url     = "https://github.com/AIDASoft/podio/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["root", "python"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
pre     = ["{venv}/bin/pip install jinja2 pyyaml"]
args    = ["-DBUILD_TESTING=OFF", "-DENABLE_SIO=OFF"]

[edm4hep]
release = "01-01"                                     # needs podio >= 1.7 and C++20
url     = "https://github.com/key4hep/EDM4hep/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["podio", "hepmc3"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DBUILD_TESTING=OFF"]

[gaudi]
release = "v40r6"                                     # C++20 since v39r0
url     = "https://gitlab.cern.ch/gaudi/Gaudi/-/archive/{release}/Gaudi-{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["root", "python"]
apt     = ["libtbb-dev", "librange-v3-dev", "libfmt-dev", "libmsgsl-dev", "nlohmann-json3-dev", "libunwind-dev"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args = [
  "-DBUILD_TESTING=OFF", "-DGAUDI_USE_AIDA=OFF", "-DGAUDI_USE_CPPUNIT=OFF", "-DGAUDI_USE_GPERFTOOLS=OFF",
  "-DGAUDI_USE_JEMALLOC=OFF", "-DGAUDI_USE_CLHEP=OFF", "-DGAUDI_USE_HEPPDT=OFF", "-DGAUDI_USE_DOXYGEN=OFF",
]

[cuda]
kind    = "external"
group   = "toolkit"
probe   = "/usr/local/cuda/bin/nvcc"
how     = "NVIDIA's CUDA Toolkit (12 or newer) and a CUDA GPU with its driver, nvcc on PATH (developer.nvidia.com/cuda-downloads; sudo)"

[veccore]
release = "0.8.2"                                     # SIMD abstraction under VecGeom
url     = "https://github.com/root-project/veccore/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
args    = ["-DBUILD_TESTING=OFF"]

[vecgeom]
release = "v2.1.1"                                    # the 2.x line AdePT needs (>= 2.0.0-rc.4)
url     = "https://gitlab.cern.ch/VecGeom/VecGeom/-/archive/{release}/VecGeom-{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["veccore", "cuda"]
apt     = ["libxerces-c-dev"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DVECGEOM_ENABLE_CUDA=ON", "-DVECGEOM_GDML=ON", "-DVECGEOM_USE_NAVINDEX=ON", "-DBUILD_TESTING=OFF",
           "-DCMAKE_CUDA_ARCHITECTURES={cuda_arch}"]

[g4hepem]
release = "20251114"                                  # Geant4's EM physics for GPUs (AdePT needs >= 20250610)
url     = "https://github.com/mnovak42/g4hepem/archive/refs/tags/{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["geant4", "cuda"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DG4HepEm_CUDA_BUILD=ON", "-DCMAKE_CUDA_ARCHITECTURES={cuda_arch}"]

[adept]
release = "0.4.1"                                     # Geant4 EM showers on the GPU
url     = "https://github.com/apt-sim/AdePT/archive/refs/tags/v{release}.tar.gz"
kind    = "cmake"
group   = "toolkit"
status  = "new"
needs   = ["geant4", "vecgeom", "g4hepem", "hepmc3", "cuda"]
env     = { CMAKE_PREFIX_PATH = "{cmake_prefix}" }
args    = ["-DCMAKE_CUDA_ARCHITECTURES={cuda_arch}", "-DBUILD_TESTING=OFF"]

# ── What each package must be able to do: its checks (recipes/verify.py) ─────────────────────────────
# build_stack.py runs a package's checks right after installing it (a failed check fails the build);
# `hep doctor` runs them all, with a scan for libraries that no longer resolve. Each [[<pkg>.verify]]:
# name, and one of command (+ expect, has), python (+ expect, has), files (globs), links (globs + has);
# slow = true for a run of minutes (hep doctor only; --quick skips it).

[[python.verify]]
name   = "venv packages"
python = "import importlib.metadata as m; print(' '.join({v for d in m.distributions() for n in [d.metadata['Name'].lower()] for v in (n, n.replace('-', '_'), n.replace('_', '-'))}))"
has    = ["{python_packages}"]

[[lhapdf.verify]]
name    = "version"
command = "lhapdf-config --version"

[[lhapdf.verify]]
name   = "python: import lhapdf"
python = "import lhapdf"

[[hepmc3.verify]]
name    = "version"
command = "HepMC3-config --version"

[[hepmc3.verify]]
name  = "search library"
files = ["{install}/lib*/libHepMC3search.*"]

[[hepmc3.verify]]
name   = "python: import pyHepMC3"
python = "import pyHepMC3"

[[fastjet.verify]]
name    = "version"
command = "fastjet-config --version"

[[fastjet.verify]]
name    = "plugins"
command = "fastjet-config --list-plugins"
has     = ["SISCone"]

[[fjcontrib.verify]]
name  = "contribs"
files = ["{install}/lib/libRecursiveTools.*", "{install}/lib/libNsubjettiness.*", "{install}/lib/libLundPlane.*",
         "{install}/lib/libfastjetcontribfragile.{dylib}"]

[[root.verify]]
name    = "version"
command = "root-config --version"

[[root.verify]]
name    = "features"
command = "root-config --features"
has     = ["pyroot", "mathmore", "roofit", "tmva", "fftw3", "imt", "xrootd", "ssl", "gdml", "http", "sqlite"]

[[root.verify]]
name   = "python: import ROOT"
python = "import ROOT"

[[root.verify]]
name    = "fill and fit"
command = '''root -b -q -l -e 'TH1D h("h","",60,-4,4); gRandom->SetSeed(1); h.FillRandom("gaus",20000); h.Fit("gaus","Q0"); printf("sigma=%.2f\n", h.GetFunction("gaus")->GetParameter(2)); gSystem->Exit(0);' '''
expect  = 'sigma=(0\.9|1\.0)'

[[pdfsets.verify]]
name    = "the sets"
command = "lhapdf list --installed"
has     = ["{pdf_sets}"]

[[pdfsets.verify]]
name   = "a set reads"
python = "import lhapdf; lhapdf.setVerbosity(0); print('xg', round(lhapdf.mkPDF('CT14lo', 0).xfxQ(21, 0.1, 10.0), 3))"
expect = '^xg [0-9]'

[[hdf5.verify]]
name    = "version"
command = "{install}/bin/h5dump --version"

[[hdf5.verify]]
name  = "h5cc-plain"
files = ["{install}/bin/h5cc-plain"]

[[yoda.verify]]
name    = "version"
command = "yoda-config --version"

[[yoda.verify]]
name   = "python: write and read"
python = "import yoda; h = yoda.Histo1D(10, 0, 1, '/t/h'); [h.fill(0.05 + 0.1 * i) for i in range(10)]; yoda.write([h], 't.yoda'); print('entries', int(yoda.read('t.yoda')['/t/h'].numEntries()))"
expect = 'entries 10'

[[rivet.verify]]
name    = "version"
command = "rivet --version"

[[rivet.verify]]
name    = "linked"
command = "rivet-config --libs --ldflags"
has     = ["-lHepMC3", "-lYODA", "-lfastjet"]

[[rivet.verify]]
name   = "python: import rivet"
python = "import rivet"

[[rivet.verify]]
name    = "an analysis"
command = "rivet --show-analysis MC_JETS"

[[pythia8.verify]]
name    = "version"
command = "pythia8-config --version"

[[pythia8.verify]]
name    = "built with LHAPDF 6, HepMC3, FastJet 3, Python"
command = "pythia8-config --with-lhapdf6 --with-hepmc3 --with-fastjet3 --with-python"
expect  = '^(true\s*){4}$'

[[pythia8.verify]]
name   = "100 events with an LHAPDF set"
python = "import pythia8; p = pythia8.Pythia('', False); [p.readString(s) for s in ('Beams:eCM = 13000', 'SoftQCD:inelastic = on', 'PDF:pSet = LHAPDF6:CT14lo', 'Random:setSeed = on', 'Random:seed = 1')]; p.init(); print('events', sum(1 for _ in range(100) if p.next()), flush=True)"
expect = '^events 100'

[[thepeg.verify]]
name  = "installed"
files = ["{install}/bin/setupThePEG", "{install}/lib/ThePEG/libThePEG.*"]

[[herwig.verify]]
name    = "version"
command = "Herwig --version"

[[herwig.verify]]
name    = "LHC.in: read, then 10 events"
command = '''sh -c 'Herwig read {install}/share/Herwig/LHC.in > read.log 2>&1 && Herwig run LHC.run -N 10 > run.log 2>&1 && echo HERWIG-OK || { tail -n 3 read.log run.log 2>/dev/null; exit 1; }' '''
expect  = 'HERWIG-OK'
slow    = true

[[delphes.verify]]
name  = "programs"
files = ["{install}/bin/DelphesHepMC3", "{install}/bin/DelphesPythia8", "{install}/bin/DelphesROOT"]

[[sherpa.verify]]
name    = "version"
command = "Sherpa --version"

[[sherpa.verify]]
name  = "HepMC3, Rivet and LHAPDF interfaces"
files = ["{install}/lib/SHERPA-MC/libSherpaHepMC3Output.*", "{install}/lib/SHERPA-MC/libSherpaRivetAnalysis.*",
         "{install}/lib/SHERPA-MC/libLHAPDFSherpa.*"]

[[madgraph.verify]]
name   = "its Python imports"
python = "import sys; sys.path.insert(0, '{install}'); import madgraph.interface.master_interface; print('imported')"
expect = 'imported'

[[whizard.verify]]
name    = "version"
command = "whizard --version"

[[whizard.verify]]
name  = "linked: LHAPDF, HepMC3, FastJet, Pythia 8"
links = ["{install}/lib/libwhizard*.{dylib}*", "{install}/bin/whizard"]
has   = ["LHAPDF", "HepMC3", "fastjet", "pythia8"]

[[onnxruntime.verify]]
name  = "library"
files = ["{install}/lib/libonnxruntime.*", "{install}/VERSION_NUMBER"]

[[geant4.verify]]
name    = "version"
command = "geant4-config --version"

[[geant4.verify]]
name    = "multithreading"
command = "geant4-config --has-feature multithreading"
expect  = 'yes'

[[geant4.verify]]
name    = "GDML"
command = "geant4-config --has-feature gdml"
expect  = 'yes'

[[madanalysis5.verify]]
name  = "installed"
files = ["{install}/bin/ma5"]
