# recipes/platforms/mac/mac.toml — what build_stack.py does differently on macOS (Apple's libc++).
# A platform's fixes: build_stack.py lays it on macOS by itself, under every toolkit (--platform mac shows
# it anywhere, for a dry run), then this folder's file for the base: system.toml (Homebrew, a venv) or
# conda.toml (the conda base, docs/conda/). The recipes are recipes/toolkits/standard.toml's; this changes
# them as a toolkit would: a list appends to the recipe's (so root's extra comes after its args), a table
# merges.

[settings]
graphics = "OFF"                  # no X11 on macOS: Geant4 without its OpenGL/X11 viewer; ROOT: Cocoa below

# The machine root's machine.sh, which setup.sh sources after hep_env.sh: the libraries on
# DYLD_LIBRARY_PATH too (hep_env.sh sets LD_LIBRARY_PATH, which macOS ignores).
setup_extra = ["export DYLD_LIBRARY_PATH=$LD_LIBRARY_PATH"]

# ROOT's graphics through Cocoa (after standard.toml's -Dx11=OFF …: CMake takes the last of an option).
[packages.root]
extra = ["-Dcocoa=ON", "-Dopengl=ON", "-Dwebgui=ON", "-Dasimage=ON"]

# Absolute install names for the CMake-built libraries whose *-config gives no rpath: a program linked
# against them finds them without DYLD_LIBRARY_PATH, which macOS drops for its own programs (/usr/bin/env,
# /bin/sh). Not Sherpa: its libraries are in lib/SHERPA-MC, and only its own programs use them.
[packages.hepmc3]
extra = ["-DCMAKE_INSTALL_NAME_DIR={install}/lib"]

[packages.delphes]
extra = ["-DCMAKE_INSTALL_NAME_DIR={install}/lib"]

[packages.geant4]
extra = ["-DCMAKE_INSTALL_NAME_DIR={install}/lib"]

[packages.onnxruntime]                     # the macOS release: onnxruntime-osx-arm64 / -x86_64
url = "https://github.com/microsoft/onnxruntime/releases/download/v{release}/onnxruntime-osx-{machine}-{release}.tgz"

# ── ThePEG and Herwig on Apple clang and libc++ (the first Mac build, 2026-10-12; docs/audit_3/01_Process.md D)
# ThePEG 2.3.0 and Herwig 7.3.0, proven on macOS 27 (arm64), AppleClang 21, Homebrew GCC 16:
#   _LIBCPP_ENABLE_CXX17_REMOVED_*  libc++ drops C++17's removals (std::mem_fun …), which they use;
#                                   libstdc++ keeps them, so Linux needs none
#   THEPEG_DYNAMIC_TYPE_INFO_BUG    ThePEG keys class descriptions by type_info address, which is not
#                                   one object across its plugin libraries on arm64 macOS: a class lost
#                                   its base's interfaces ("AlphaQCDISR:ScaleFactor was not found")
# (system.toml and conda.toml give each the GSL and the -lc++ link line: libtool links them
# -flat_namespace, so libThePEG recorded no libc++ dependency and its static initialisers ran before
# libc++'s; macOS 27 aborted: "typed operator new … before its static initializer".)
[packages.thepeg]
env   = { CXXFLAGS = "{cxxflags} -D_LIBCPP_ENABLE_CXX17_REMOVED_BINDERS -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -D_LIBCPP_ENABLE_CXX17_REMOVED_RANDOM_SHUFFLE -D_LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR -DTHEPEG_DYNAMIC_TYPE_INFO_BUG" }

[packages.herwig]
env   = { CXXFLAGS = "{cxxflags} -D_LIBCPP_ENABLE_CXX17_REMOVED_BINDERS -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -D_LIBCPP_ENABLE_CXX17_REMOVED_RANDOM_SHUFFLE -D_LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR -DTHEPEG_DYNAMIC_TYPE_INFO_BUG" }

# Whizard 3.1.8: its configure copies clang++'s link line into CXXLIBS and keeps a bare -lto_library;
# it filters that only when it can read Xcode's version, which the Command Line Tools alone don't give.
[packages.whizard]
extra = ["CXXLIBS=-lc++"]
