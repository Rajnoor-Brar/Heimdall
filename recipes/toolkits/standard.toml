# recipes/toolkits/standard.toml — every recipe of the stack, in build order: where each package's source
# is and how it is built (README.md §3 says why each flag is there). A toolkit (README.md §6) borrows
# from here by its [standard] table; this file is itself a toolkit, @standard, which builds the core.
#
# A toolkit file (this one, the others in this folder, your own in the machine root's toolkits/):
#   description, note   what it is for (--toolkits prints them)
#   extends             another toolkit (or a list) whose set and changes it starts from
#   isolated            true: a whole stack of its own in the machine root's stacks/<toolkit>/ (another
#                       C++ standard); a toolkit that changes cxx_std or opt_flags must be
#   [standard]          which recipes it borrows: a group ("core", "extra", "all": both) or a package,
#                       = true to take it, = false to leave it out of what `extends` brought
#   [settings] [env]    settings.toml's keys, and the build's environment, for this toolkit's builds
#   [packages.<name>]   a recipe's keys changed (a list appends, unless replace = ["key"] names it), or
#                       a recipe of its own, which joins its set
# What a package needs is added to any set. The layers, lowest first: this file, then the machine root's
# recipes.toml (the machine's own recipes, as this file's), and settings.toml; the platform's fixes (platforms/<platform>/<platform>.toml); the toolkits asked for, each after what
# it extends; the machine root's machine.toml; --config files; the command line.
#
# A recipe, [packages.<name>]:
#   release   its version: the stamp's, {release} below, and {series} (it without its last ".x")
#   url       its tarball, or a list of mirrors tried in order (a web page or a cut-off file is refused)
#   sha256    the tarball's checksum, checked when given (`build_stack.py --sha256` prints the archives')
#   kind      autotools  ./configure --prefix={install} ARGS, make, make install, in {src}
#             cmake      {src} built in {build} and installed into {install} (Release, C++{cxx_std})
#             unpack     the tarball unpacked into {install}; nothing built
#             none       only its pre and post commands
#             external   never built here: `how` says where it comes from
#   needs     the packages it builds against: added to a run when they are not installed
#   group     "core" or "extra" ("all" is both); without one, a package joins a build only by name
#   install   its directory under stack/ (default: its name); env/packages.sh lists them for the shell
#   probe     the file that shows it installed (default: {install})
#   args      configure or cmake arguments
#   extra     more of them, after args: for a toolkit or the command line (root.extra="-Droofit=OFF"),
#             without repeating args (CMake and configure take the last of a repeated option)
#   optional  { "package [version spec]" = [args] }: added when that package is installed or in the run, at
#             a version meeting the spec (">=6.30,<7", "6.40.*"; none: any): its release, or the base's
#             installed version when it is ready-made
#   patch     a patch (-p0) for the unpacked source; a path from Heimdall's root
#   strip     the folder levels a tarball's paths carry before the source (default 1)
#   env       environment for its commands
#   pre, post commands run before configuring and after installing (in {src}; shell words, no shell)
#   cores     how many compilers it runs at once, its make -j (default {cores})
#   status    "new": a recipe no build has proven yet
#   verify    [[packages.<name>.verify]]: what it must be able to do, checked after it installs and by
#             `heimdall doctor` (recipes/verify.py says how)
#   apt       base = "system": the system packages it needs besides apt_packages
#   base      base = "conda": the conda-forge packages it needs in the base besides recipes/base.toml's
#   conda     its conda-forge package, when it is taken ready-made ("fastjet-cxx"; a version spec may follow),
#             or a list: the package, then specs that pin its build ("root_base * cxx{cxx_std}*")
#   conda_std the C++ standards conda-forge builds it for, when only some: taken ready-made, it sets the
#             stack's (cxx_std; the first, unless a layer set one of them)
#   from      "source" (the default: built here), or "conda-forge": installed ready-made into the base
#             instead (base = "conda" only; the @…-conda toolkits). What it needs must then be ready-made
#             too, or there would be two of it: conda-forge's and the stack's.
#
# Placeholders: any setting ({cores}, {graphics}, …), and {prefix} (the machine root) {inst} {venv} {src} {build}
# {install} {release} {series} {py} {pyxy} {pyinc} {cxxflags} {cflags} {ldflags} {arch} {machine} {dylib}
# {repo}; {base}, the base's prefix (base = "conda"; {venv} is the same there); {dir_<package>}, where a
# package is installed: stack/<its install>, or the base when it is ready-made ({dir_lhapdf}); {bin_<package>},
# its programs' folder; {version_<package>}, its version (as optional's specs read it); and any
# environment variable ({HOMEBREW_PREFIX}). A word that is only a list setting ({pdf_sets}) becomes its
# words.

description = "every recipe; @standard builds the core: generators, Rivet, ROOT, LHAPDF, Delphes"

[standard]
core = true

[packages.python]
kind  = "none"
group = "core"
probe = "{venv}/bin/python"
pre   = ["{python} -m venv --prompt {venv_prompt} {venv}",
         "{venv}/bin/python -m pip install --timeout 60 --retries 10 --upgrade pip",
         "{venv}/bin/python -m pip install --timeout 60 --retries 10 {python_packages}",
         "{venv}/bin/python {repo}/recipes/pth.py {repo}"]       # heimdall.pth: $HEIMDALL/framework on the venv's path

[packages.lhapdf]
release = "6.5.6"
url     = "https://lhapdf.hepforge.org/downloads/?f=LHAPDF-{release}.tar.gz"
sha256  = "6b8b7e38dc26a977a24f5a321215b7054c14a4469d04134d70cb93a860eeeea7"
kind    = "autotools"
conda   = "lhapdf"
group   = "core"
needs   = ["python"]
install = "LHAPDF"

[packages.pdfsets]
kind  = "none"
group = "core"
needs = ["lhapdf"]
post  = ["lhapdf install {pdf_sets}"]                 # a set already there is skipped; right after
                                                     # LHAPDF: Pythia8's check reads CT14lo

[packages.hepmc3]
release = "3.3.1"
url     = "https://hepmc.web.cern.ch/hepmc/releases/HepMC3-{release}.tar.gz"
sha256  = "08240160b0f28dc3293aa4d61ce65e2d67cd597acf6faca439f2e46625f7e793"
kind    = "cmake"
conda   = "hepmc3"
group   = "core"
needs   = ["python"]
# The Python directory is HEPMC3_Python_SITEARCH<XY> (HEPMC3_PYTHON_INSTALL_DIR is ignored); LTO strips
# the pybind11 symbols.
args = [
  "-DHEPMC3_ENABLE_PYTHON=ON", "-DHEPMC3_PYTHON_VERSIONS={py}",
  "-DHEPMC3_Python_SITEARCH{pyxy}={venv}/lib/python{py}/site-packages",
  "-DHEPMC3_ENABLE_ROOTIO=OFF", "-DHEPMC3_ENABLE_SEARCH=ON", "-DHEPMC3_BUILD_EXAMPLES=OFF",
  "-DCMAKE_CXX_FLAGS={cxxflags} -fno-lto", "-DCMAKE_SHARED_LINKER_FLAGS=-fno-lto",
]

[packages.hepmc2]
release = "2.06.11"                                   # the older event format: aMC@NLO's Pythia8 shower and
url     = "https://hepmc.web.cern.ch/hepmc/releases/HepMC-{release}.tar.gz"   # MadGraph's Delphes step read it
sha256  = "ceaced62d39e4e2a1469fa2f20662d4d370279b3209930250766db02f44ae8de"
kind    = "cmake"
conda   = "hepmc2"
# Its units must be named; its CMakeLists asks for CMake 2.6, which CMake 4 refuses without a policy floor.
args    = ["-Dmomentum:STRING=GEV", "-Dlength:STRING=MM", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
           "-DCMAKE_CXX_FLAGS={cxxflags} -fPIC"]

[packages.fastjet]
release = "3.5.0"
url     = "https://fastjet.fr/repo/fastjet-{release}.tar.gz"
sha256  = "42d0cacffb204b1160591d507489ee50375a279efb173f8da426ca1bde9d4c29"
kind    = "autotools"
conda   = "fastjet-cxx"
group   = "core"
# SISCone's random-number state is one per process: threads clustering at once get other jets (L29).
# The patch makes it per thread. fastjet.patch="" builds without it.
patch   = "recipes/patches/fastjet-3.5.0-siscone-thread-local-ranlux.patch"
args    = ["--enable-shared", "--enable-allcxxplugins"]

[packages.fjcontrib]
release = "1.104"
url     = "https://fastjet.hepforge.org/contrib/downloads/fjcontrib-{release}.tar.gz"
sha256  = "c4b1f675f02787003c42c600051c0e23f23680ee454f9f8e34875755563dbb77"
kind    = "autotools"
conda   = "fastjet-contrib"
group   = "core"
needs   = ["fastjet"]
install = "fastjet"                                   # into FastJet's prefix, as the lab PC has it
probe   = "{install}/lib/libfastjetcontribfragile.{dylib}"
args    = ["--fastjet-config={dir_fastjet}/bin/fastjet-config", "CXXFLAGS={cxxflags} -fPIC"]
post    = ["make fragile-shared-install"]             # libfastjetcontribfragile.so (.dylib), which Rivet links

[packages.root]
release = "6.40.04"                                   # not 6.40.00: its rootcling_stage1 does not link
url     = "https://root.cern/download/root_v{release}.source.tar.gz"
sha256  = "44ada253b1935d34b6801222232d50731fe7c5e3cbcfab47734c85031cfbe4d3"
kind    = "cmake"
conda   = ["root", "root_base * cxx{cxx_std}*"]       # conda-forge builds it for C++20 and 23 only:
conda_std = [20, 23]                                   # ready-made, the stack follows it (README.md §3)
group   = "core"
needs   = ["python"]
cores   = "{root_cores}"
args = [
  "-DPython3_EXECUTABLE={venv}/bin/python", "-Dpyroot=ON",
  "-Dmathmore=ON", "-Droofit=ON", "-Dtmva=ON", "-Dfftw3=ON", "-Dsqlite=ON", "-Dxml=ON", "-Dgdml=ON",
  "-Dhttp=ON", "-Dimt=ON", "-Dssl=ON", "-Dvdt=ON",
  "-Dx11={graphics}", "-Dopengl={graphics}", "-Dwebgui={graphics}", "-Dasimage={graphics}",
  "-Dbuiltin_freetype=ON", "-Dbuiltin_pcre=ON", "-Dxrootd=ON", "-Dbuiltin_xrootd=ON", "-Ddavix=OFF",
]

[packages.hdf5]
release = "2.2.0"                                     # 2.x builds with CMake only
url     = "https://github.com/HDFGroup/hdf5/releases/download/{release}/hdf5-{release}.tar.gz"
sha256  = "1a1ab8209b35586fbc1aa279ba76d102130b95badcb20ca329587219112d8c16"
kind    = "cmake"
conda   = "hdf5"
group   = "extra"
strip   = 2                                           # its paths start with ./hdf5-<release>/
args = [
  "-DBUILD_SHARED_LIBS=ON", "-DBUILD_STATIC_LIBS=OFF", "-DHDF5_BUILD_CPP_LIB=ON", "-DHDF5_BUILD_HL_LIB=ON",
  "-DHDF5_BUILD_FORTRAN=OFF", "-DHDF5_BUILD_JAVA=OFF", "-DHDF5_BUILD_EXAMPLES=OFF", "-DBUILD_TESTING=OFF",
  "-DHDF5_ENABLE_ZLIB_SUPPORT=ON", "-DHDF5_ENABLE_SZIP_SUPPORT=OFF", "-DCMAKE_INSTALL_NAME_DIR={install}/lib",
]
# plain-h5cc: the one-line h5cc YODA's configure can read (HDF5 2.x's broke its link line on the Mac); its name
# ends in h5cc because YODA's m4/ax_lib_hdf5.m4 takes the type from it ("*h5cc": serial; else "neither", and
# .yoda.h5 is switched off while the headers still include HDF5's: the build fails, 2026-10-15)
post = ["{python} {repo}/recipes/helpers/h5cc_plain.py {install} {release}"]

[packages.yoda]
release = "2.1.4"
url     = ["https://cedar-tools.web.cern.ch/downloads/YODA-{release}.tar.gz",     # CEDAR: the releases' home now
           "https://yoda.hepforge.org/downloads?f=YODA-{release}.tar.gz"]
sha256  = "1a13aabdfe8d230cfb4a1107ed856608928bb3131e6ce0adf46b5b43934f17f7"
kind    = "autotools"
conda   = "yoda"
group   = "core"
needs   = ["python"]
# HDF5 support (.yoda.h5) only with the stack's HDF5: never one the system happens to have (the Mac's
# Homebrew HDF5 broke the link, docs/audit_3/01_Process.md §5). The later --enable-h5 wins.
args     = ["--disable-h5"]
optional = { hdf5 = ["--enable-h5", "--with-hdf5={dir_hdf5}/bin/plain-h5cc", "--enable-h5-rpath"] }

[packages.rivet]
release = "4.1.4"
url     = "https://cedar-tools.web.cern.ch/downloads/Rivet-{release}.tar.gz"      # HepForge stops at 4.1.3
sha256  = "ccf710efd401ef42cc9d4bece53376aebbec670488ae303f30a2baca07898742"
kind    = "autotools"
conda   = "rivet"
group   = "core"
needs   = ["python", "hepmc3", "yoda", "fastjet", "fjcontrib"]
cores   = "{root_cores}"                              # an experiment's analyses are one compiler run of several GB:
                                                      # at every core, 14 GB of RAM ran out (2026-10-14)
args    = ["--with-hepmc3={dir_hepmc3}", "--with-yoda={dir_yoda}", "--with-fastjet={dir_fastjet}"]

[packages.pythia8]
release = "8318"
url     = "https://pythia.org/releases/pythia83/pythia{release}.tgz"     # /download/ is gone (404) since 2026
sha256  = "85dce1e623f91499b2973e3f939bf760b0f745ad4f4eb1bd0fbce2074e2e8f5c"
kind    = "autotools"
conda   = "pythia8"
group   = "core"
needs   = ["python", "lhapdf", "hepmc3", "fastjet", "pdfsets"]   # pdfsets: its check reads CT14lo (on a fresh
                                                          # root the sets came after it, and the check failed)
args = [
  "--with-lhapdf6={dir_lhapdf}", "--with-hepmc3={dir_hepmc3}", "--with-fastjet3={dir_fastjet}",
  "--with-python-bin={venv}/bin/", "--with-python-lib={venv}/lib/python{py}",
  "--with-python-include={pyinc}", "--cxx-common={cxxflags} -fPIC",
  "--with-gzip",                                      # gzipped Les Houches files: MadGraph hands it .lhe.gz
]
# Its ROOT and Rivet plugins (Pythia8Plugins/RivetHooks.h) exist only when built after them; HepMC2 beside
# HepMC3 (@primary), for MadGraph: aMC@NLO's Pythia8 shower reads `pythia8-config --hepmc2`.
optional = { root = ["--with-root={dir_root}"], rivet = ["--with-rivet={dir_rivet}"], hepmc2 = ["--with-hepmc2={dir_hepmc2}"] }
# MadGraph showers LO events with examples/main164, which it does not build: built here, writing HepMC2
# when Pythia has it (MadGraph's Delphes step runs DelphesHepMC2), else HepMC3.
post = ['''sh -c 'cd {install}/share/Pythia8/examples && if [ "$({install}/bin/pythia8-config --with-hepmc2)" = true ];
  then make main164 HEPMC3_USE=false; else make main164; fi' ''']

[packages.thepeg]
release = "2.3.0"
url     = "https://thepeg.hepforge.org/downloads/?f=ThePEG-{release}.tar.bz2"
sha256  = "ac35979ae89c29608ca92c156a49ff68aace7a5a12a0c92f0a01a833d2d34572"
kind    = "autotools"
conda   = "thepeg"
group   = "core"
needs   = ["lhapdf", "hepmc3", "fastjet"]
install = "herwig7"
probe   = "{install}/bin/setupThePEG"
# --with-hepmcversion=3: else ThePEG looks for HepMC2 under the HepMC3 prefix.
args    = ["--with-hepmc={dir_hepmc3}", "--with-hepmcversion=3", "--with-fastjet={dir_fastjet}",
           "--with-lhapdf={dir_lhapdf}"]

[packages.herwig]
release = "7.3.0"
url     = "https://herwig.hepforge.org/downloads/?f=Herwig-{release}.tar.bz2"
sha256  = "2624819d2dff105ba952ea1b5cf12eb6f4926d4951774a41907699e2f567686c"
kind    = "autotools"
conda   = "herwig"
group   = "core"
needs   = ["thepeg", "lhapdf", "fastjet"]
install = "herwig7"
probe   = "{install}/bin/Herwig"
pre     = ["lhapdf install CT14lo CT14nlo"]           # its defaults read them: make install needs them (L15)
# Looptools needs 8-byte default integers; Herwig's m4/herwig.m4 adds -fdefault-integer-8 only for x86_64
# and old Intel Macs, so an arm64 machine (an M-series Mac, an ARM Linux) fails at D0funcC.F. Given here
# for every platform (x86_64 Linux gets the same flags from its configure anyway).
args    = ["--with-thepeg={dir_thepeg}", "--with-fastjet={dir_fastjet}", "--with-lhapdf={dir_lhapdf}",
           "FFLAGS=-O2 -std=legacy -ffixed-line-length-none -fdefault-integer-8",
           "FCFLAGS=-O2 -std=legacy -ffixed-line-length-none -fdefault-integer-8"]

[packages.delphes]
release = "3.5.1"
url     = "https://github.com/delphes/delphes/archive/refs/tags/{release}.tar.gz"
sha256  = "b60d26d2ee2c84b58fbf2cf397fabd0ef3e89d3a0546d843c4ada82cc802d787"
kind    = "cmake"
conda   = "delphes"
group   = "core"
needs   = ["root"]
env     = { PYTHIA8 = "{dir_pythia8}" }              # DelphesPythia8 too, when Pythia8 is there
args    = ["-DROOT_DIR={dir_root}/cmake"]

# One-loop amplitudes for NLO (toolkit @loops): Sherpa builds its interface to each that is installed
# (its `optional`). Sherpa carries only the interfaces; each provider is a library of its own.
[packages.qd]
release = "2.3.24"                                    # double-double and quad-double arithmetic, for BlackHat
url     = "https://www.davidhbailey.com/dhbsoftware/qd-{release}.tar.gz"
sha256  = "a47b6c73f86e6421e86a883568dd08e299b20e36c11a99bdfbe50e01bde60e38"
kind    = "autotools"
probe   = "{install}/lib/libqd.{dylib}"
pre     = ["autoreconf -fi"]                          # its libtool misreads the conda compiler's link line (a
args    = ["--enable-shared"]                         # bare -L before crtendS.o): regenerated

[packages.blackhat]
release = "0.9.9"                                     # one-loop QCD amplitudes, 2013: HepForge's tarball with
# CMS's fixes for GCC 4.8, 6 and 10 (cms-externals/blackhat, branch cms/v0.9.9), and the patch's for GCC 15
url     = "https://github.com/cms-externals/blackhat/archive/3e8ac1f06ef3612088505de448c8e127157076a7.tar.gz"
sha256  = "fa8f5f96c92087d94d4d187362cfb46d7357a0252659eef4b7c15fa9b46b4c1d"
kind    = "autotools"
needs   = ["qd"]
probe   = "{install}/lib/blackhat/libBH.{dylib}"
patch   = "recipes/patches/blackhat-0.9.9-gcc15.patch"
cores   = "{root_cores}"                              # its amplitude files: up to ~1 GB a compiler
pre     = ["autoreconf -fi"]                          # as QD's: its libtool misreads the link line
args    = ["--with-QDpath={dir_qd}"]

[packages.openloops]
release = "2.1.5"                                     # one-loop amplitudes from process libraries fetched by
url     = "https://gitlab.com/openloops/OpenLoops/-/archive/OpenLoops-{release}/OpenLoops-OpenLoops-{release}.tar.gz"
sha256  = "dbb2bdf160725dca4e80d85403ce6d1f55a15754ba863fcc62febc42efc34bc2"
kind    = "unpack"                                    # name; built and used in place, stack/openloops
probe   = "{install}/proclib/channels_public.rinfo"   # the process list: Sherpa's CMake looks for it, and only
# a libinstall fetches it, so settings.toml's openloops_processes needs one process at least. Both commands
# run from the folder (its scons reads ./SConstruct); a process library already there is kept.
post    = ["./scons num_jobs={cores}", "./openloops libinstall {openloops_processes} num_jobs={cores}"]

[packages.collier]
release = "1.2.10"                                    # one-loop tensor integrals, for Recola
url     = "https://collier.hepforge.org/downloads/?f=collier-{release}.tar.gz"
sha256  = "460624ea709211506b642343a7f6be41d3883ccb52598b14950f8e07c0262713"
kind    = "cmake"
probe   = "{install}/lib/libcollier.{dylib}"

[packages.recola]
release = "1.5.1"                                     # Recola 1 (the SM): the calls Sherpa's interface makes
url     = "https://gitlab.com/recola/recola1/-/archive/{release}/recola1-{release}.tar.gz"
sha256  = "4aaa5940c8894ce4432e47f5b93627ff1a0132bde7c9be8311928c32597ac3c1"
kind    = "cmake"
needs   = ["collier"]
probe   = "{install}/lib/librecola.{dylib}"
# COLLIER by its CMake config; and by rpath, which goes before LD_LIBRARY_PATH: MadGraph's HEPTools/lib
# (on it, first) holds a libcollier.so of its own (1.2.9).
args    = ["-Dcollier_path={dir_collier}/lib/cmake", "-Dwith_smtests=OFF", "-DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON"]

[packages.openmpi]
release = "5.0.11"                                    # MPI, the Message Passing Interface: Sherpa integrates
url     = "https://download.open-mpi.org/release/open-mpi/v{series}/openmpi-{release}.tar.bz2"
sha256  = "e668a3c4acd50c41dc204c8a6dd98a611e0f26af89cf677577fa9be8a2698003"
kind    = "autotools"                                 # (and generates) across `mpirun -n N` ranks
conda   = "openmpi"
probe   = "{install}/bin/mpicxx"
# Its own hwloc, libevent, PMIx and PRRTE, not whichever the base happens to hold. This one is for the ranks
# of one machine; across a cluster's nodes, the site's MPI (`module load`) knows its network and scheduler.
args    = ["--with-hwloc=internal", "--with-libevent=internal", "--with-pmix=internal", "--with-prrte=internal"]

[packages.sherpa]
release = "3.0.5"
url     = "https://gitlab.com/sherpa-team/sherpa/-/archive/v{release}/sherpa-v{release}.tar.gz"
sha256  = "6c3804d48e1955ee82f713b3d3ffd16b013a9912752f488aab0ba6c1b1634288"
kind    = "cmake"
conda   = "sherpa"
group   = "extra"
needs   = ["hepmc3", "lhapdf", "rivet", "fastjet"]
# The _DIR spellings are Sherpa's own; HepMC3_DIR is the CMake config directory.
args = [
  "-DSHERPA_ENABLE_HEPMC3=ON", "-DHepMC3_DIR={dir_hepmc3}/share/HepMC3/cmake",
  "-DSHERPA_ENABLE_RIVET=ON", "-DRIVET_DIR={dir_rivet}",
  "-DSHERPA_ENABLE_FASTJET=ON", "-DFASTJET_DIR={dir_fastjet}",
  "-DSHERPA_ENABLE_LHAPDF=ON", "-DLHAPDF_DIR={dir_lhapdf}",
  "-DSHERPA_ENABLE_INTERNAL_PDFS=ON", "-DSHERPA_ENABLE_EXAMPLES=ON",
]
# The one-loop providers (@loops), each when it is installed; `--rebuild sherpa` after adding one.
optional.blackhat  = ["-DSHERPA_ENABLE_BLACKHAT=ON", "-DBLACKHAT_DIR={dir_blackhat}"]
optional.openloops = ["-DSHERPA_ENABLE_OPENLOOPS=ON", "-DOPENLOOPS_DIR={dir_openloops}"]
optional.recola    = ["-DSHERPA_ENABLE_RECOLA=ON", "-DRECOLA_DIR={dir_recola}"]
optional.openmpi   = ["-DSHERPA_ENABLE_MPI=ON", "-DMPI_HOME={dir_openmpi}"]   # a plain `Sherpa` still runs, as one rank

[packages.madanalysis5]                               # before MadGraph, which is pointed at it when both build
release = "1.11.1"                                    # recasting
url     = "https://github.com/MadAnalysis/madanalysis5/archive/refs/tags/v{release}.tar.gz"
sha256  = "2b1921f07c7aa1d20fc7581cbd76c067ceca930ceb1f2931befcf57e66a5888b"
kind    = "unpack"                                    # a Python tree, run in place: stack/madanalysis5/bin/ma5
needs   = ["root", "fastjet", "delphes"]
probe   = "{install}/bin/ma5"
# Made ready as MadGraph's `install MadAnalysis5` would: its version file, SampleAnalyzer compiled (zlib from
# the base when there is one); its Delphes interface off, as MadGraph's installer has it (it wants a Delphes
# source tree, external/ExRootAnalysis). Then MadGraph, when built, is pointed at it.
post = ["{venv}/bin/python {repo}/recipes/madanalysis5.py {install} {release} {cores} zlib_includes={base}/include zlib_libs={base}/lib root_bin_path={bin_root} fastjet_bin_path={bin_fastjet} delphes_veto=1",
        "{venv}/bin/python {repo}/recipes/madgraph.py configure {dir_madgraph} madanalysis5_path={install}"]

[packages.qcdloop]
release = "1.9.0"                                     # one-loop scalar integrals, MadGraph's `install QCDLoop`
url     = ["https://madgraph.mi.infn.it/Downloads/qcdloop1-{release}.tar.gz",
           "http://madgraph.phys.ucl.ac.be/Downloads/qcdloop1-{release}.tar.gz"]
sha256  = "9d76b4d28d1684d2ed9043dcca6e7fce11c8f57efc3fe87f288bd42917843217"
kind    = "autotools"
group   = "extra"                                     # with MadGraph
pre     = ["make distclean"]                          # the tarball carries a macOS build: objects, a configure's
args    = ["FC=gfortran", "F77=gfortran", "FFLAGS=-O2 -fPIC -std=legacy"]   # Makefile; its ff/ calls
                                                      # mismatch their arguments, which gfortran 10+ refuses

[packages.madgraph]
release = "3.8.1"                                     # Launchpad renames releases: set madgraph.url when it 404s
url     = "https://launchpad.net/mg5amcnlo/3.0/{series}.x/+download/MG5_aMC_v{release}.tar.gz"
sha256  = "281b9055af99f45217dc99378c520215f3129e65a9ab2fde6636e274aa6cd692"
kind    = "unpack"                                    # a Python/Fortran tree, pointed at the stack
group   = "extra"
needs   = ["lhapdf", "pythia8", "qcdloop"]
# Its options (recipes/madgraph.py: a path not built here is left alone), then its loop libraries as the
# prompt's `install` would make them, from the tarballs it ships: Ninja and OneLOop, COLLIER into HEPTools/,
# CutTools and IREGI in vendor/, QCDLoop linked as MadGraph/QCDLoop. A first loop process asks nothing then.
post = [
  """{venv}/bin/python {repo}/recipes/madgraph.py configure {install} automatic_html_opening=False
  lhapdf_py3={bin_lhapdf}/lhapdf-config fastjet={bin_fastjet}/fastjet-config pythia8_path={dir_pythia8}
  hepmc_path={dir_hepmc2} delphes_path={bin_delphes} rivet_path={dir_rivet} yoda_path={dir_yoda}
  madanalysis5_path={dir_madanalysis5}""",
  "{venv}/bin/python {repo}/recipes/madgraph.py loop-tools {install} {dir_qcdloop}",
  "{venv}/bin/python {repo}/recipes/madgraph.py noplugin {install}/Template/NLO/MCatNLO",   # aMC@NLO's Pythia 8.3 driver
]

[packages.whizard]
release = "3.1.8"
url     = "https://whizard.hepforge.org/downloads/?f=whizard-{release}.tar.gz"
sha256  = "96bfdf2ec4476ab7945e50550a3294634af6bc0f472cf7848b5903887629ce55"
kind    = "autotools"
group   = "extra"
needs   = ["hepmc3", "fastjet", "lhapdf", "pythia8", "pdfsets"]
# pdfsets first: Whizard's configure turns LHAPDF off unless CT10 and cteq6l1 are installed (m4/lhapdf.m4),
# silently (it was built without LHAPDF on both machines before this). --enable-hepmc takes HepMC3 (there are no *hepmc3 options); O'Mega needs OCaml.
args = [
  "--enable-lhapdf", "--enable-hepmc", "--with-hepmc={dir_hepmc3}", "--enable-fastjet",
  "--with-fastjet={dir_fastjet}", "--enable-pythia8", "--with-pythia8={dir_pythia8}",
  "--disable-dependency-tracking", "FC=gfortran",
]
# Its LHAPDF test compiles with `lhapdf-config --cxxflags` and links with `--ldflags`, which LHAPDF 6.5 answers
# with its build flags (no -I) and -L alone (no -lLHAPDF): the test failed and Whizard built a dummy (2026-10-15).
# CPATH gives the headers (GCC reads it), LIBS the library, for the test and Whizard's link alike.
env = { CPATH = "{dir_lhapdf}/include", LIBS = "-L{dir_lhapdf}/lib -Wl,-rpath,{dir_lhapdf}/lib -lLHAPDF" }

