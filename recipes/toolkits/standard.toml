sha256  = "c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba"
kind    = "unpack"                                    # a released binary: no ABI to match
conda   = "onnxruntime-cpp"
group   = "extra"

