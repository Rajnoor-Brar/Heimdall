# herwig.toml — Herwig 7 through the chain (rework v2 schema, docs/rework_v2/04_Config.md).
#
#   hep run Demo/herwig             ep NC DIS at 18x275 → rivet: a chain check (P4 S2)
#   hep run Demo/herwig export      an exec tool given Herwig's run file, Herwig not run
#
# dis_ep.herwig.in is DIS, not photoproduction: it checks the tool folder (read cached as a
# prepare step, run into the FIFO, the count check), not physics against jets.toml.

[run]
serial        = 5
name          = "herwig"
project       = "Demo"
configuration = "single"
event_count   = 2_000
threads       = 1

[run.cfgs.single]
description = "Herwig ep DIS at 18x275, analysed by Rivet"
sweeps      = []
tools       = [["herwig", "rivet"], "yd2rt"]

[run.cfgs.export]
description = "An exec tool asks for herwig:run: Herwig's read runs once (cached), the tool gets the path"
sweeps      = []
tools       = ["probe"]
prelim      = {}
generate_cards = ["herwig:run"]   # Herwig's run file, made for probe (HEP_CONTEXT)

[prelim]
fifo = ["events.hepmc"]

[static]
energies = "18x275"

[tools.herwig]
tool        = "herwig"
baseconfig  = "dis_ep.herwig.in"
output_file = "events.hepmc"

[tools.rivet]
tool        = "rivet"
input       = "events.hepmc"
analyses    = ["photo_eic"]
output_file = "jets.yoda"

[tools.yd2rt]
tool        = "yd2rt"
input       = "jets.yoda"
output_file = "jets.root"

[tools.probe]                     # stands in for an integrated program that runs Herwig itself
tool        = "exec"
executable  = "/bin/ls"
arguments   = ["-l", "{context:herwig.run}"]

[quantities.energies]
values = [[275, 18], [920, 27.5]]   # [E_p, E_e]
tags   = ["18x275", "27x920"]
labels = ["18x275 GeV", "27x920 GeV"]

[plot]
formats = ["png"]
