# inproc_jets.toml — jets.toml with Pythia and Rivet in one process (InprocJets, V33).
#
#   hep run Demo/inproc_jets                the configuration named in [run] (pdf)
#   hep run Demo/inproc_jets energy_pdf     another one
#   hep run Demo/inproc_jets radius --plan  look before running
#
# The same physics set-up as jets.toml: base card ep.cmnd, the same quantities, statics and
# configurations, photo_eic. Instead of App_Pythia → FIFO → rivet, one program
# (modules/Demo/InprocJets.cc) runs PythiaParallel and its Rivets, and hands each event to
# Rivet as an in-memory HepMC3::GenEvent: no HepMC text, no FIFO. It gets the pythia table's point
# card (seeds included) and the rivet table's analyses with their options (radius's R) as standard
# configurations (04 §9.4); those two tables are configured here but never run.
#
# Left out: jets's `inproc` (this whole file is that) and `delphes` (a file chain: it needs the events
# outside the process).
#
# Seeds follow the generator's card, base card, binary, threads and event count (V22): with the same
# event_count and threads as jets.toml, a point here and the same point there are the same events.
#
# Speed: `rivet_threads` Rivets, each on its own thread, merged at the end (V34); they need the
# SISCone patch (L29, utils/Env/patches/), without which the program refuses more than one.
# Measured, 200k events of `single` with start-up: 12 + 1 Rivet 112 s, 12 + 12 Rivets 20.7 s,
# 10 + 14 19.3 s; jets.toml's chain with 12 + 10 shards 29.0 s.
#
# Physics notes carried over from jets.toml:
#   * Photon:ProcessType 0 and 1 give identical events with this card; the direct contribution needs
#     its own card (00/B13), so the `process` configuration is a null comparison.
#   * The base card's pTHatMin = 6 GeV sits above photo_eic's lowest jet ET bins, which biases them
#     (00/B27). The `pthatmin` configuration measures that.
#   * photo_eic's ETMIN/ETMIN2 defaults are 17/21 GeV in the source (its .info still says 5/10).

[run]
serial        = 1
name          = "inproc_jets"
project       = "Demo"
run           = "pdf"
events        = 1_000_000
threads       = 12            # Pythia's; as jets.toml, so the same seeds (10 + 14 Rivets is 7% faster)
generate_cards = ["pythia", "rivet"]   # not run: their cards, for inproc (HEP_CONTEXT)
chain         = ["inproc", "yd2rt"]   # every configuration's, unless it says its own

[cfgs.single]
description = "One run at the static point (27x920 e+p), in one process"

[cfgs.pdf]
serial      = 1
description = "Proton-PDF comparison at the static beams, in one process"
vary        = ["pdf"]

[cfgs.energies]
serial      = 2
description = "Beam-energy comparison at the static PDF, in one process"
vary        = ["energies"]

[cfgs.energy_pdf]
serial      = 3
description = "Beams x PDF grid: one page per energy, PDF curves on each, in one process"
vary        = ["energies", "pdf"]
plot_points = ["energies"]

[cfgs.mpi]
serial      = 4
description = "MPI pT0Ref scan at 18x275 with MPI on, in one process"
vary        = ["pt0ref"]
fixed       = { energies = "18x275" }

[cfgs.mpi_onoff]
serial      = 5
description = "MPI on vs off at 18x275, in one process"
vary        = ["mpi"]
fixed       = { energies = "18x275" }

[cfgs.mpi_grid]
serial      = 6
description = "pT0Ref x MPI grid: one page per MPI setting, pT0Ref curves on each, in one process"
vary        = ["pt0ref", "mpi"]
plot_points = ["mpi"]
fixed       = { energies = "18x275" }

[cfgs.pthatmin]
serial      = 7
description = "Generation-cut stability at the static beams (00/B27), in one process"
vary        = ["pthatmin"]

[cfgs.process]
serial      = 8
description = "Photon:ProcessType 0 vs 1 at 18x275: a null comparison with this card (00/B13), in one process"
vary        = ["process"]
fixed       = { energies = "18x275" }

[cfgs.radius]
serial      = 9
description = "Jet radius R at 18x275, in one process (the option reaches Rivet through the context file)"
vary        = ["radius"]
fixed       = { energies = "18x275" }

[cfgs.replicas]
serial      = 10
description = "Three seed replicas at the static point, merged after them by rivet-merge (post), in one process"
vary        = ["replica"]
chain       = ["inproc"]
post        = ["merge"]

# No [prelim]: the events never leave the process.

[tools.inproc]                # the integrated program (V21, V33)
uses           = "module"
executable     = "InprocJets.exe"
output         = "jets.yoda"

[tools.inproc.config]
engine        = "parallel"    # PythiaParallel as App_Pythia runs it; "serial": one Pythia8::Pythia
rivet_threads = 12            # Rivets on threads of their own, merged at the end (V34, L29)

[tools.pythia]                # configured, not run: its point card goes to inproc (generate_cards)
card        = "ep.cmnd"
output      = "events.hepmc"

[tools.rivet]                 # configured, not run: its analyses go to inproc (generate_cards)
input       = "pythia"
analyses    = ["photo_eic"]
output      = "jets.yoda"

[tools.yd2rt]
input       = "jets.yoda"
output      = "jets.root"

[tools.merge]                 # post: jets.yoda of every point → one YODA with their statistics
input       = "jets.yoda"
output      = "merged.yoda"

# ── quantities (as jets.toml) ───────────────────────────────────────────────────────────────────────

[quantities.energies]
fixed  = "27x920"
points = [
  { tag = "5x41", value = [41, 5], label = '5x41 GeV ($\sqrt{s}$ = 28.6 GeV)' },
  { tag = "10x100", value = [100, 10], label = '10x100 GeV ($\sqrt{s}$ = 63.2 GeV)' },
  { tag = "18x275", value = [275, 18], label = '18x275 GeV ($\sqrt{s}$ = 140.7 GeV)' },
  { tag = "27x920", value = [920, 27.5], label = '27x920 GeV ($\sqrt{s}$ = 318.1 GeV)' },
]

[quantities.lepton]
to     = { pythia = "Beams:idB" }
fixed  = "ep"
points = [
  { tag = "em", value = 11, label = "$e^{-}$" },
  { tag = "ep", value = -11, label = "$e^{+}$" },
]

[quantities.pdf]
fixed  = "NNPDF23lo"
points = [
  { tag = "MSTW08lo", value = "LHAPDF6:MSTW2008lo68cl", label = "MSTW 2008 LO" },
  { tag = "NNPDF23lo", value = "LHAPDF6:NNPDF23_lo_as_0130_qed", label = "NNPDF 2.3 QCD+QED LO" },
  { tag = "NNPDF23nlo", value = "LHAPDF6:NNPDF23_nlo_as_0119_qed", label = "NNPDF 2.3 QCD+QED NLO" },
  { tag = "PDF4LHC21", value = "LHAPDF6:PDF4LHC21_40", label = "PDF4LHC21" },
]

[quantities.pt0ref]
to     = { pythia = "MultipartonInteractions:pT0Ref" }
fixed  = "pt32"
points = [
  { tag = "pt30", value = 3.0, label = '$p_{T0}^{\mathrm{ref}}$ = 3.0 GeV' },
  { tag = "pt32", value = 3.2, label = '$p_{T0}^{\mathrm{ref}}$ = 3.2 GeV' },
  { tag = "pt34", value = 3.4, label = '$p_{T0}^{\mathrm{ref}}$ = 3.4 GeV' },
]

[quantities.mpi]
to     = { pythia = "PartonLevel:MPI" }
fixed  = "mpi"
points = [
  { tag = "mpi", value = true, label = "MPI on" },
  { tag = "nompi", value = false, label = "MPI off" },
]

[quantities.pthatmin]
to     = { pythia = "PhaseSpace:pTHatMin" }
points = [
  { tag = "pth2", value = 2.0, label = '$\hat{p}_{T}$ > 2 GeV' },
  { tag = "pth3", value = 3.0, label = '$\hat{p}_{T}$ > 3 GeV' },
  { tag = "pth4", value = 4.0, label = '$\hat{p}_{T}$ > 4 GeV' },
  { tag = "pth6", value = 6.0, label = '$\hat{p}_{T}$ > 6 GeV' },
]

[quantities.process]
to     = { pythia = "Photon:ProcessType" }
points = [
  { tag = "allproc", value = 0, label = "resolved + direct" },
  { tag = "resolved", value = 1, label = "resolved" },
]

[quantities.radius]
to     = { "rivet/photo_eic" = "R" }
points = [
  { tag = "r04", value = 0.4, label = "R = 0.4" },
  { tag = "r07", value = 0.7, label = "R = 0.7" },
  { tag = "r10", value = 1.0, label = "R = 1.0" },
]

[quantities.replica]

# ── plot (as jets.toml) ─────────────────────────────────────────────────────────────────────────────
to     = { "pythia/seed" = true }
points = [
  { tag = "s1", value = 1, label = "seed 1" },
  { tag = "s2", value = 2, label = "seed 2" },
  { tag = "s3", value = 3, label = "seed 3" },
]

[plot]
backend     = "root"
formats     = ["pdf", "png"]
ratio       = true
y_gutter    = 0.5
auto_range  = true
void_empty  = false
min_entries = 1

[plot.data]
file   = "rivet:ZEUS_2012_I1116258"     # Rivet's own ZEUS 2012 tables (the same numbers as datasets/jets_data.yoda)
legend = "ZEUS 2012"

# Explicit, never matched by name (00/B5, L18). A physics match, not a numbering coincidence:
# photo_eic books the same d-numbers as ZEUS_2012_I1116258 because it was written against that
# measurement. Meaningful at 27x920, which IS HERA kinematics; at EIC energies the ratio becomes a
# statement about beam energy. d13–d17 have no ZEUS counterpart.
[plot.data.map]
"d01-x01-y01" = "/REF/ZEUS_2012_I1116258/d01-x01-y01"   # ET, kT, all eta
"d02-x01-y01" = "/REF/ZEUS_2012_I1116258/d02-x01-y01"   # eta, kT, ET > ETMIN
"d03-x01-y01" = "/REF/ZEUS_2012_I1116258/d03-x01-y01"   # eta, kT, ET > ETMIN2
"d04-x01-y01" = "/REF/ZEUS_2012_I1116258/d04-x01-y01"   # ET, kT, eta < 0
"d05-x01-y01" = "/REF/ZEUS_2012_I1116258/d05-x01-y01"   # ET, kT, 0 < eta < 1
"d06-x01-y01" = "/REF/ZEUS_2012_I1116258/d06-x01-y01"   # ET, kT, 1 < eta < 1.5
"d07-x01-y01" = "/REF/ZEUS_2012_I1116258/d07-x01-y01"   # ET, kT, 1.5 < eta < 2
"d08-x01-y01" = "/REF/ZEUS_2012_I1116258/d08-x01-y01"   # ET, kT, eta > 3
"d09-x01-y01" = "/REF/ZEUS_2012_I1116258/d09-x01-y01"   # ET, anti-kT, all eta
"d10-x01-y01" = "/REF/ZEUS_2012_I1116258/d10-x01-y01"   # ET, SISCone, all eta
"d11-x01-y01" = "/REF/ZEUS_2012_I1116258/d11-x01-y01"   # eta, anti-kT
"d12-x01-y01" = "/REF/ZEUS_2012_I1116258/d12-x01-y01"   # eta, SISCone
