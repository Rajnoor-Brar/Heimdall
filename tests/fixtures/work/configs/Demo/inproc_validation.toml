# inproc_validation.toml — validation.toml with Pythia and Rivet in one process (InprocJets, V33).
#
#   hep run Demo/inproc_validation               PDF comparison at HERA kinematics
#   hep run Demo/inproc_validation ptref         MPI pT0Ref scan, 2.8–3.4 GeV
#   hep run Demo/inproc_validation mpi           MPI on vs off
#
# The same physics set-up as validation.toml: base card ep_validation.cmnd, the same quantities and
# statics, ZEUS_2012_I1116258. Instead of App_Pythia → FIFO → rivet, one program
# (modules/Demo/InprocJets.cc) runs PythiaParallel and its Rivets, and hands each event to
# Rivet as an in-memory HepMC3::GenEvent: no HepMC text, no FIFO. It gets the pythia table's point
# card (seeds included) and the rivet table's analyses from the point's context file (generate_cards,
# 04 §9.4); those two tables are configured here but never run.
#
# Seeds follow the generator's card, base card, binary, threads and event count (V22): with the same
# event_count and threads as validation.toml, a point here and the same point there get the
# same seeds, so the same events, comparable bin for bin (`--set run.threads=20 --set
# run.event_count=10000000` matches it as it is now).
#
# Speed: `rivet_threads` Rivets, each on its own thread, merged at the end (V34); they need the
# SISCone patch (L29, utils/Env/patches/), without which the program refuses more than one.
# Measured, 200k events of `single` with start-up: 10 + 14 Rivets 17.3 s; validation.toml's
# chain with 12 + 10 shards 27.1 s.

[run]
serial        = 1
name          = "inproc_validation"
project       = "Demo"
configuration = "default"
event_count   = 1_000_000
threads       = 12            # Pythia's; 12 + 12 Rivets fill the 24 hardware threads
generate_cards = ["pythia", "rivet"]   # not run: their cards, for inproc (HEP_CONTEXT)

[run.cfgs.default]
description = "Proton-PDF comparison at 27.5x920 GeV e+p against ZEUS 2012, in one process"
sweeps      = ["pdf"]
tools       = ["inproc", "yd2rt"]

[run.cfgs.ptref]
description = "MPI pT0Ref scan, 2.8–3.4 GeV, at 27.5x920 GeV e+p, in one process"
sweeps      = ["pt0ref"]
tools       = ["inproc", "yd2rt"]

[run.cfgs.mpi]
description = "Multiparton interactions on vs off, at the static pT0Ref, in one process"
sweeps      = ["mpi"]
tools       = ["inproc", "yd2rt"]

[run.cfgs.single]
description = "One run at the static point, in one process"
sweeps      = []
tools       = ["inproc", "yd2rt"]

# No [prelim]: the events never leave the process.

[static]
energies = "27x920"
lepton   = "ep"
pt0ref   = "pt34"

# ── tools ──────────────────────────────────────────────────────────────────────────────────────────

[tools.inproc]                # the integrated program (V21, V33)
tool           = "module"
executable     = "InprocJets.exe"
output_file    = "validation.yoda"

[tools.inproc.config]
engine        = "parallel"    # PythiaParallel as App_Pythia runs it; "serial": one Pythia8::Pythia
rivet_threads = 12            # Rivets on threads of their own, merged at the end (V34, L29)

[tools.pythia]                # configured, not run: its point card goes to inproc (generate_cards)
tool        = "pythia"
baseconfig  = "ep_validation.cmnd"
output_file = "events.hepmc"

[tools.rivet]                 # configured, not run: its analyses go to inproc (generate_cards)
tool        = "rivet"
input       = "events.hepmc"
analyses    = ["ZEUS_2012_I1116258"]
output_file = "validation.yoda"

[tools.yd2rt]
tool        = "yd2rt"
input       = "validation.yoda"
output_file = "validation.root"

# ── quantities (as validation.toml) ───────────────────────────────────────────────────────────

[quantities.pdf]
values = ["LHAPDF6:MSTW2008lo68cl", "LHAPDF6:NNPDF23_lo_as_0130_qed", "LHAPDF6:NNPDF23_nlo_as_0119_qed", "LHAPDF6:PDF4LHC21_40"]
tags   = ["MSTW08lo", "NNPDF23lo", "NNPDF23nlo", "PDF4LHC21"]
labels = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO", "NNPDF 2.3 QCD+QED NLO", "PDF4LHC21"]

[quantities.pt0ref]
key    = { pythia = "MultipartonInteractions:pT0Ref" }
values = [2.8, 3.0, 3.2, 3.4]
tags   = ["pt28", "pt30", "pt32", "pt34"]
labels = ['$p_{T0}^{\mathrm{ref}}$ = 2.8 GeV', '$p_{T0}^{\mathrm{ref}}$ = 3.0 GeV',
          '$p_{T0}^{\mathrm{ref}}$ = 3.2 GeV', '$p_{T0}^{\mathrm{ref}}$ = 3.4 GeV']

[quantities.mpi]
key    = { pythia = "PartonLevel:MPI" }
values = [true, false]
tags   = ["mpi", "nompi"]
labels = ["MPI on", "MPI off"]

[quantities.energies]
values = [[41, 5], [100, 10], [275, 18], [920, 27.5]]
tags   = ["5x41", "10x100", "18x275", "27x920"]
labels = ['5x41 GeV ($\sqrt{s}$ = 28.6 GeV)', '10x100 GeV ($\sqrt{s}$ = 63.2 GeV)',
          '18x275 GeV ($\sqrt{s}$ = 140.7 GeV)', '27.5x920 GeV ($\sqrt{s}$ = 318.1 GeV)']

[quantities.lepton]
key    = { pythia = "Beams:idB" }
values = [11, -11]
tags   = ["em", "ep"]
labels = ["$e^{-}$", "$e^{+}$"]

# ── plot (as validation.toml) ─────────────────────────────────────────────────────────────────

[plot]
backend     = ["root", "yoda"]
void_empty  = false
min_entries = 0
auto_range  = false
y_gutter    = "default"
ratio       = true

[plot.data]
file   = "rivet:ZEUS_2012_I1116258"     # Rivet's own ZEUS 2012 tables
legend = "ZEUS 2012"

[plot.data.map]
"d01-x01-y01" = "/REF/ZEUS_2012_I1116258/d01-x01-y01"
"d02-x01-y01" = "/REF/ZEUS_2012_I1116258/d02-x01-y01"
"d03-x01-y01" = "/REF/ZEUS_2012_I1116258/d03-x01-y01"
"d04-x01-y01" = "/REF/ZEUS_2012_I1116258/d04-x01-y01"
"d05-x01-y01" = "/REF/ZEUS_2012_I1116258/d05-x01-y01"
"d06-x01-y01" = "/REF/ZEUS_2012_I1116258/d06-x01-y01"
"d07-x01-y01" = "/REF/ZEUS_2012_I1116258/d07-x01-y01"
"d08-x01-y01" = "/REF/ZEUS_2012_I1116258/d08-x01-y01"
"d09-x01-y01" = "/REF/ZEUS_2012_I1116258/d09-x01-y01"
"d10-x01-y01" = "/REF/ZEUS_2012_I1116258/d10-x01-y01"
"d11-x01-y01" = "/REF/ZEUS_2012_I1116258/d11-x01-y01"
"d12-x01-y01" = "/REF/ZEUS_2012_I1116258/d12-x01-y01"
