# jets.toml — inclusive jets in ep collisions (rework v2 schema, docs/04_Config_Reference.md).
#
#   hep run Demo/jets                 the configuration named in [run] (pdf)
#   hep run Demo/jets energy_pdf      another one
#   hep run Demo/jets radius --plan   look before running
#
# Translated from the v1 schema-2 file (High-Energy's v1 file at rework/v1-final):
# each [study.<s>] is a [run.<s>], `across` is `sweeps`, `overlay` became `plot_points`, a study's
# pin is its `static`, and v1's quantity types became per-tool keys (the master TOML knows how
# pythia consumes energies and pdf).
#
# Physics notes carried over from v1:
#   * Photon:ProcessType 0 and 1 give identical events with this card; the direct contribution needs
#     its own card (00/B13), so the `process` configuration is a null comparison.
#   * The base card's pTHatMin = 6 GeV sits above photo_eic's lowest jet ET bins, which biases them
#     (00/B27). The `pthatmin` configuration measures that.
#   * photo_eic's ETMIN/ETMIN2 defaults are 17/21 GeV in the source (its .info still says 5/10).

[run]
serial        = 3
name          = "jets"
project       = "Demo"
configuration = "pdf"
event_count   = 1_000_000
threads       = 12            # Pythia's; with rivet's 10 shards that fills the 24 hardware threads

[run.cfgs.single]
description = "One run at the static point (27x920 e+p)"
sweeps      = []
tools       = [["pythia", "rivet"], "yd2rt"]

[run.cfgs.pdf]
serial      = 1
description = "Proton-PDF comparison at the static beams"
sweeps      = ["pdf"]
tools       = [["pythia", "rivet"], "yd2rt"]

[run.cfgs.energies]
serial      = 2
description = "Beam-energy comparison at the static PDF"
sweeps      = ["energies"]
tools       = [["pythia", "rivet"], "yd2rt"]

[run.cfgs.energy_pdf]
serial      = 3
description = "Beams x PDF grid: one page per energy, PDF curves on each"
sweeps      = ["energies", "pdf"]
plot_points = ["energies"]
tools       = [["pythia", "rivet"], "yd2rt"]

[run.cfgs.mpi]
serial      = 4
description = "MPI pT0Ref scan at 18x275 with MPI on"
sweeps      = ["pt0ref"]
tools       = [["pythia", "rivet"], "yd2rt"]
static      = { energies = "18x275" }

[run.cfgs.mpi_onoff]
serial      = 5
description = "MPI on vs off at 18x275"
sweeps      = ["mpi"]
tools       = [["pythia", "rivet"], "yd2rt"]
static      = { energies = "18x275" }

[run.cfgs.mpi_grid]
serial      = 6
description = "pT0Ref x MPI grid: one page per MPI setting, pT0Ref curves on each"
sweeps      = ["pt0ref", "mpi"]
plot_points = ["mpi"]
tools       = [["pythia", "rivet"], "yd2rt"]
static      = { energies = "18x275" }

[run.cfgs.pthatmin]
serial      = 7
description = "Generation-cut stability at the static beams (00/B27)"
sweeps      = ["pthatmin"]
tools       = [["pythia", "rivet"], "yd2rt"]

[run.cfgs.process]
serial      = 8
description = "Photon:ProcessType 0 vs 1 at 18x275: a null comparison with this card (00/B13)"
sweeps      = ["process"]
tools       = [["pythia", "rivet"], "yd2rt"]
static      = { energies = "18x275" }

[run.cfgs.radius]
serial      = 9
description = "Jet radius R at 18x275 (three points, three generations: V9)"
sweeps      = ["radius"]
tools       = [["pythia", "rivet"], "yd2rt"]
static      = { energies = "18x275" }

[run.cfgs.inproc]
serial      = 11
description = "Pythia and Rivet in one process (InprocJets): the card and seeds of `single`, no FIFO"
sweeps      = []
tools       = ["jets", "yd2rt"]
prelim      = {}              # no FIFO: the events never leave the process

[run.cfgs.delphes]
serial      = 12
description = "Detector level: the events to a file, Delphes (ATLAS card), then a jet count (02 §5.1)"
sweeps      = []
tools       = ["pythia_file", "delphes", "jets_reco"]
prelim      = { files = ["showered.hepmc"] }       # a file: Delphes cannot read a FIFO (L11)

[run.cfgs.replicas]
serial      = 10
description = "Three seed replicas at the static point, merged after them by rivet-merge (post)"
sweeps      = ["replica"]
tools       = [["pythia", "rivet"]]
post        = ["merge"]

[prelim]
fifo = ["events.hepmc"]

[static]                     # v1's [static.use] and each quantity's `use`
energies = "27x920"
lepton   = "ep"
pdf      = "NNPDF23lo"
pt0ref   = "pt32"
mpi      = "mpi"

[tools.pythia]
tool        = "pythia"
baseconfig  = "ep.cmnd"
output_file = "events.hepmc"

[tools.rivet]
tool        = "rivet"
input       = "events.hepmc"
analyses    = ["photo_eic"]
output_file = "jets.yoda"
shards      = 10              # 10 Rivet processes, merged into jets.yoda (02 §7.1): one Rivet
                              # reads ~1,500 ev/s; 12 threads + 10 shards run ~9,200 ev/s (L27)

[tools.yd2rt]
tool        = "yd2rt"
input       = "jets.yoda"
output_file = "jets.root"

[tools.jets]                  # an integrated program: modules/Demo/InprocJets.cc (V21)
tool           = "module"
executable     = "InprocJets.exe"
output_file    = "jets.yoda"
pythia_cmnd    = true         # the point card App_Pythia would get, seeds included
rivet_analyses = true         # the rivet table's analyses and the plugin path

[tools.pythia_file]           # the same generator, writing a file for a tool that cannot stream
tool        = "pythia"
baseconfig  = "ep.cmnd"
output_file = "showered.hepmc"

[tools.delphes]
tool        = "delphes"
baseconfig  = "delphes_card_ATLAS.tcl"
input       = "showered.hepmc"
output_file = "delphes.root"

[tools.jets_reco]             # a custom analysis at detector level
tool        = "custom"
executable  = "path:python3"            # V54: PATH by name
arguments   = ["{repo}/modules/Demo/delphes_jets.py", "{input}", "{partial:output}"]
input       = "delphes.root"
output_file = "jets_reco.json"

[tools.merge]                 # post: jets.yoda of every point → one YODA with their statistics
tool        = "merge"
input       = "jets.yoda"
output_file = "merged.yoda"

[quantities.energies]
values = [[41, 5], [100, 10], [275, 18], [920, 27.5]]     # [E_p, E_e]: beam A is the proton
tags   = ["5x41", "10x100", "18x275", "27x920"]
labels = ['5x41 GeV ($\sqrt{s}$ = 28.6 GeV)', '10x100 GeV ($\sqrt{s}$ = 63.2 GeV)',
          '18x275 GeV ($\sqrt{s}$ = 140.7 GeV)', '27x920 GeV ($\sqrt{s}$ = 318.1 GeV)']

[quantities.lepton]
key    = { pythia = "Beams:idB" }
values = [11, -11]
tags   = ["em", "ep"]
labels = ["$e^{-}$", "$e^{+}$"]

[quantities.pdf]
values = ["LHAPDF6:MSTW2008lo68cl", "LHAPDF6:NNPDF23_lo_as_0130_qed", "LHAPDF6:NNPDF23_nlo_as_0119_qed", "LHAPDF6:PDF4LHC21_40"]
tags   = ["MSTW08lo", "NNPDF23lo", "NNPDF23nlo", "PDF4LHC21"]
labels = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO", "NNPDF 2.3 QCD+QED NLO", "PDF4LHC21"]

[quantities.pt0ref]
key    = { pythia = "MultipartonInteractions:pT0Ref" }
values = [3.0, 3.2, 3.4]
tags   = ["pt30", "pt32", "pt34"]
labels = ['$p_{T0}^{\mathrm{ref}}$ = 3.0 GeV', '$p_{T0}^{\mathrm{ref}}$ = 3.2 GeV',
          '$p_{T0}^{\mathrm{ref}}$ = 3.4 GeV']

[quantities.mpi]
key    = { pythia = "PartonLevel:MPI" }
values = [true, false]
tags   = ["mpi", "nompi"]
labels = ["MPI on", "MPI off"]

[quantities.pthatmin]
key    = { pythia = "PhaseSpace:pTHatMin" }
values = [2.0, 3.0, 4.0, 6.0]
tags   = ["pth2", "pth3", "pth4", "pth6"]
labels = ['$\hat{p}_{T}$ > 2 GeV', '$\hat{p}_{T}$ > 3 GeV', '$\hat{p}_{T}$ > 4 GeV', '$\hat{p}_{T}$ > 6 GeV']

[quantities.process]
key    = { pythia = "Photon:ProcessType" }
values = [0, 1]
tags   = ["allproc", "resolved"]
labels = ["resolved + direct", "resolved"]

[quantities.radius]
target = "rivet/photo_eic"
key    = "R"
values = [0.4, 0.7, 1.0]
tags   = ["r04", "r07", "r10"]
labels = ["R = 0.4", "R = 0.7", "R = 1.0"]

[quantities.replica]
target = "pythia/seed"        # enters the generator's identity, so its seed block; renders nothing
values = [1, 2, 3]
tags   = ["s1", "s2", "s3"]
labels = ["seed 1", "seed 2", "seed 3"]

[quantities.etmin]
target = "rivet/photo_eic"
key    = "ETMIN"
values = [4.0, 5.0, 6.0]
tags   = ["et4", "et5", "et6"]
labels = ["$E_{T}$ > 4 GeV", "$E_{T}$ > 5 GeV", "$E_{T}$ > 6 GeV"]

[plot]
backend     = "root"
formats     = ["pdf", "png"]
ratio       = true
y_gutter    = 0.5
auto_range  = true
void_empty  = false
min_entries = 1

[plot.data]
file   = "rivet:ZEUS_2012_I1116258"     # Rivet's own ZEUS 2012 tables (the same numbers as datasets/jets_data.yoda)
legend = "ZEUS 2012"

# Explicit, never matched by name (00/B5, L18). A physics match, not a numbering coincidence:
# photo_eic books the same d-numbers as ZEUS_2012_I1116258 because it was written against that
# measurement. d04 corroborates it: the only ZEUS table with a truncated ET range (17–41 GeV), on
# the only histogram booked with etEdgesBackward. Meaningful at 27x920, which IS HERA kinematics; at
# EIC energies the ratio becomes a statement about beam energy. d13–d17 have no ZEUS counterpart.
[plot.data.map]
"d01-x01-y01" = "/REF/ZEUS_2012_I1116258/d01-x01-y01"   # ET, kT, all eta
"d02-x01-y01" = "/REF/ZEUS_2012_I1116258/d02-x01-y01"   # eta, kT, ET > ETMIN
"d03-x01-y01" = "/REF/ZEUS_2012_I1116258/d03-x01-y01"   # eta, kT, ET > ETMIN2
"d04-x01-y01" = "/REF/ZEUS_2012_I1116258/d04-x01-y01"   # ET, kT, eta < 0
"d05-x01-y01" = "/REF/ZEUS_2012_I1116258/d05-x01-y01"   # ET, kT, 0 < eta < 1
"d06-x01-y01" = "/REF/ZEUS_2012_I1116258/d06-x01-y01"   # ET, kT, 1 < eta < 1.5
"d07-x01-y01" = "/REF/ZEUS_2012_I1116258/d07-x01-y01"   # ET, kT, 1.5 < eta < 2
"d08-x01-y01" = "/REF/ZEUS_2012_I1116258/d08-x01-y01"   # ET, kT, eta > 3
"d09-x01-y01" = "/REF/ZEUS_2012_I1116258/d09-x01-y01"   # ET, anti-kT, all eta
"d10-x01-y01" = "/REF/ZEUS_2012_I1116258/d10-x01-y01"   # ET, SISCone, all eta
"d11-x01-y01" = "/REF/ZEUS_2012_I1116258/d11-x01-y01"   # eta, anti-kT
"d12-x01-y01" = "/REF/ZEUS_2012_I1116258/d12-x01-y01"   # eta, SISCone

