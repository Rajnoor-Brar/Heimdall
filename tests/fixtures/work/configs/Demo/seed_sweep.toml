# seed_sweep.toml — the ZEUS 2012 PDF comparison, each PDF run with several seeds and the seeds
# merged into one curve (combine, V35).
#
#   hep run Demo/seed_sweep            4 PDFs × 5 seeds: pages with one curve per PDF,
#                                                    each the 5 seeds merged (5M events)
#   hep run Demo/seed_sweep spread     the same 20 points, one page per PDF with a
#                                                    curve per seed: how far the seeds scatter
#
# The physics is validation.toml's at the paper's MPI setting (pT0Ref = 3.2 GeV, the 2025 study's
# validation_pdf cards and Rathi & Palni's Figs. 1, 3–5). A seed is the `replica` quantity: it enters the
# generator's identity, so each value gets its own seed block and nothing else changes. The runner
# still gives out the seeds (V22), so the blocks never overlap, and `spread` gets the very same seeds
# as `default`, so the same events.
#
# `combine = ["replica"]`: the points that differ only in the replica are one group; after they
# finish, rivet-merge -e (seed replicas are one process: statistics add, σ is averaged) writes the
# group's validation.yoda to results/…/<configuration>/<pdf>/, beside the replicas' own folders, and the
# pages are drawn from the groups. Five seeds of 1M are one sample of 5M: the curves' statistical
# errors shrink by √5 against one seed.

[run]
serial        = 1
name          = "seed_sweep"
project       = "Demo"
run           = "default"
events        = 1_000_000                 # per seed, as the paper's per PDF
threads       = 12                        # Pythia's; with rivet's 10 shards it fills the 24 hardware threads
chain         = [["pythia", "rivet"]]   # every configuration's, unless it says its own

[cfgs.default]
description = "Proton-PDF comparison at 27.5x920 GeV e+p against ZEUS 2012: 5 seeds per PDF, merged"
vary        = ["pdf", "replica"]
combine     = ["replica"]

[cfgs.spread]
description = "The same points, one page per PDF with a curve per seed"
vary        = ["pdf", "replica"]
plot_points = ["pdf"]

[tools.pythia]
card        = "ep_validation.cmnd"
output      = "events.hepmc"

[tools.rivet]
input       = "pythia"
analyses    = ["ZEUS_2012_I1116258"]
output      = "validation.yoda"
shards      = 10                          # one Rivet reads ~1,500 ev/s; 12 threads + 10 shards ~9,200 (L27)

# ── quantities ─────────────────────────────────────────────────────────────────────────────────────

[quantities.pdf]
points = [
  { tag = "MSTW08lo", value = "LHAPDF6:MSTW2008lo68cl", label = "MSTW 2008 LO" },
  { tag = "NNPDF23lo", value = "LHAPDF6:NNPDF23_lo_as_0130_qed", label = "NNPDF 2.3 QCD+QED LO" },
  { tag = "NNPDF23nlo", value = "LHAPDF6:NNPDF23_nlo_as_0119_qed", label = "NNPDF 2.3 QCD+QED NLO" },
  { tag = "PDF4LHC21", value = "LHAPDF6:PDF4LHC21_40", label = "PDF4LHC21" },
]

[quantities.replica]
to     = { "pythia/seed" = true }
points = [
  { tag = "s1", value = 1, label = "seed 1" },
  { tag = "s2", value = 2, label = "seed 2" },
  { tag = "s3", value = 3, label = "seed 3" },
  { tag = "s4", value = 4, label = "seed 4" },
  { tag = "s5", value = 5, label = "seed 5" },
]

[quantities.pt0ref]
to     = { pythia = "MultipartonInteractions:pT0Ref" }
fixed  = "pt32"
points = [
  { tag = "pt28", value = 2.8, label = '$p_{T0}^{\mathrm{ref}}$ = 2.8 GeV' },
  { tag = "pt30", value = 3.0, label = '$p_{T0}^{\mathrm{ref}}$ = 3.0 GeV' },
  { tag = "pt32", value = 3.2, label = '$p_{T0}^{\mathrm{ref}}$ = 3.2 GeV' },
  { tag = "pt34", value = 3.4, label = '$p_{T0}^{\mathrm{ref}}$ = 3.4 GeV' },
]

[quantities.energies]
fixed  = "27x920"
points = [
  { tag = "5x41", value = [41, 5], label = '5x41 GeV ($\sqrt{s}$ = 28.6 GeV)' },
  { tag = "10x100", value = [100, 10], label = '10x100 GeV ($\sqrt{s}$ = 63.2 GeV)' },
  { tag = "18x275", value = [275, 18], label = '18x275 GeV ($\sqrt{s}$ = 140.7 GeV)' },
  { tag = "27x920", value = [920, 27.5], label = '27.5x920 GeV ($\sqrt{s}$ = 318.1 GeV)' },
]

[quantities.lepton]

# ── plot (as validation.toml) ─────────────────────────────────────────────────────────────────
to     = { pythia = "Beams:idB" }
fixed  = "ep"
points = [
  { tag = "em", value = 11, label = "$e^{-}$" },
  { tag = "ep", value = -11, label = "$e^{+}$" },
]

[plot]
backend     = ["root", "yoda"]
void_empty  = false
min_entries = 0
auto_range  = false
y_gutter    = "native"
ratio       = true

[plot.data]
file   = "rivet:ZEUS_2012_I1116258"       # Rivet's own ZEUS 2012 tables
legend = "ZEUS 2012"

[plot.data.map]
"d01-x01-y01" = "/REF/ZEUS_2012_I1116258/d01-x01-y01"
"d02-x01-y01" = "/REF/ZEUS_2012_I1116258/d02-x01-y01"
"d03-x01-y01" = "/REF/ZEUS_2012_I1116258/d03-x01-y01"
