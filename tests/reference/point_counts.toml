# Point and page counts of the v1-era Demo studies: the P2 S2 gate.
#
# From tests/golden/test_legacy_counts.py (EXPECTED_COUNTS) at rework/v1-final, captured from
# the legacy planner on the frozen configs. `pages` is the legacy count. v1 and legacy drew no
# page for a study with nothing scanned. v2 draws one page for any configuration with at least one
# point (docs/04_Config_Reference.md §5.2), so `pages_v2` is the value to compare against.
#
# Keys are <run>.<configuration> in v2 terms. "default" was the study-less [sweep] of the v1 file,
# which v2 has as the configuration named by [run].configuration (`pdf` for jets).

[jets.default]
points = 4
pages = 1
pages_v2 = 1

[jets.single]
points = 1
pages = 0
pages_v2 = 1

[jets.pdf]
points = 4
pages = 1
pages_v2 = 1

[jets.energies]
points = 4
pages = 1
pages_v2 = 1

[jets.energy_pdf]
points = 16
pages = 4
pages_v2 = 4

[jets.mpi]
points = 3
pages = 1
pages_v2 = 1

[jets.mpi_onoff]
points = 2
pages = 1
pages_v2 = 1

[jets.mpi_grid]
points = 6
pages = 2
pages_v2 = 2

[jets.pthatmin]
points = 4
pages = 1
pages_v2 = 1

[jets.process]
points = 2
pages = 1
pages_v2 = 1

[jets.radius]
points = 3
pages = 1
pages_v2 = 1

[validation.default]
points = 4
pages = 1
pages_v2 = 1
