# decay.toml — Λ → p π⁻ from Pythia (Angantyr Ne-20 on Ne-20, decay.cmnd), through two
# analysis paths on the same events (rework v2 schema, docs/02_User_Guide.md §6.1).
#
#   hep run Decay/decay                   one run at 7 TeV, both paths
#   hep run Decay/decay masswindow        the mass window swept through both paths at once
#
# App_Pythia fans out to two FIFOs: the Rivet analysis DecayRiv reads one, the module program Lambda
# (modules/Decay/Decay.cc) the other. Both use modules/Decay/Reconstruction.hh, so on the same
# events they agree to floating-point precision, which checks both frameworks.
#
# Translated from the v1 file (High-Energy's v1 file at rework/v1-final): [beams] became
# the static beam quantities, [analyzers.module.options] the module's [config], v1's option
# quantities are targeted quantities. A module option can now be swept (masstol, costheta), which v1
# could not do (00/B40). The v1 `RESERVED = 2` (pp's 2 × Z) is kept with Ne–Ne beams, as v1 had it.

[run]
name          = "decay"
project       = "Decay"
configuration = "single"
event_count   = 20_000
threads       = 16

[run.cfgs.single]
description = "One run at 7 TeV, both analysis paths"
sweeps      = []
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[run.cfgs.masswindow]
description = "Mass-window scan through both paths: four points, each its own generation (V9)"
sweeps      = ["masstol"]
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[run.cfgs.costheta]
description = "Does the decay-angle cut buy anything the mass window does not?"
sweeps      = ["costheta"]
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[run.cfgs.cuts_grid]
description = "Mass window x decay angle: one page per angle cut, mass-window curves on it"
sweeps      = ["masstol", "costheta"]
plot_points = ["costheta"]
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[run.cfgs.sets]
description = "The three candidate sets as curves on one page (SET is a DecayRiv option; the module books all three anyway)"
sweeps      = ["set"]
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[run.cfgs.energy]
description = "Lambda yield against collision energy"
sweeps      = ["sqrts"]
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[run.cfgs.replicas]
description = "Three statistically equivalent runs at 7 TeV, for a stability check"
sweeps      = ["replica"]
tools       = [["pythia", "decayriv", "decay"], "yd2rt"]

[prelim]
fifo = ["to_rivet.hepmc", "to_module.hepmc"]     # fan-out: one FIFO per reader (V16)

[static]
sqrts  = "7tev"
beam_a = "Ne20"
beam_b = "Ne20"

[tools.pythia]
tool        = "pythia"
baseconfig  = "decay.cmnd"
output_file = ["to_rivet.hepmc", "to_module.hepmc"]

[tools.decayriv]
tool        = "rivet"
input       = "to_rivet.hepmc"
analyses    = ["DecayRiv"]
options     = { RESERVED = 2 }     # the module's reserved_protons: the two paths' cuts must match
output_file = "decayriv.yoda"

[tools.decay]
tool        = "module"
executable  = "Decay.exe"         # build/Decay/Decay.exe, from modules/Decay/Decay.cc
input       = "to_module.hepmc"
output_file = "decay.root"

[tools.decay.config]              # DecayRiv's option defaults, under the module's names
mass_tolerance      = 0.15         # |m(pπ) − m(Λ)| accepted, GeV
cos_theta_tolerance = 0.0          # 0 = off; else |cos θ* + 1| tolerance
reserved_protons    = 2            # beam protons per event that cannot come from a Λ
track_pt_min        = 0.0
track_eta_max       = 8.0
bins                = 100

[tools.yd2rt]
tool        = "yd2rt"
input       = "decayriv.yoda"
output_file = "decayriv.root"

[quantities.sqrts]
values = [900.0, 7000.0, 13000.0]
tags   = ["900gev", "7tev", "13tev"]
labels = ["900 GeV", "7 TeV", "13 TeV"]

[quantities.beam_a]
values = [1000100200]
tags   = ["Ne20"]

[quantities.beam_b]
values = [1000100200]
tags   = ["Ne20"]

[quantities.masstol]               # one quantity, two consumers, a key for each
target = ["decayriv/DecayRiv", "decay"]
key    = { decayriv = "MASSTOL", decay = "mass_tolerance" }
values = [0.05, 0.10, 0.15, 0.25]
tags   = ["m050", "m100", "m150", "m250"]
labels = ['$\pm$ 50 MeV', '$\pm$ 100 MeV', '$\pm$ 150 MeV', '$\pm$ 250 MeV']

[quantities.costheta]
target = ["decayriv/DecayRiv", "decay"]
key    = { decayriv = "COSTHETATOL", decay = "cos_theta_tolerance" }
values = [0.0, 0.05, 0.2]
tags   = ["noct", "ct005", "ct020"]
labels = ['no cos$\theta$* cut', '|cos$\theta$* + 1| < 0.05', '|cos$\theta$* + 1| < 0.2']

[quantities.set]
target = "decayriv/DecayRiv"
key    = "SET"
values = ["unvalidated", "validated", "selected"]
tags   = ["unval", "val", "sel"]
labels = ["all pairs", "in the mass window", "ranked, one-to-one"]

[quantities.replica]
target = "pythia/seed"
values = [1, 2, 3]
tags   = ["s1", "s2", "s3"]

# Pages come from the YODA product (decayriv.yoda); the module's decay.root is for ROOT users.
[plot]
formats    = ["png"]
objects    = ["/DecayRiv*"]
auto_range = true
